<style>

/* Vizney Blocks tokens: re-declare the same variables on your page's :root and they apply to every card. The card code stays as it is.
   To match your screen, set the background (--vzb-card), the text (--vzb-ink), the accent (--vzb-primary), the type (--vzb-font, --vzb-title-*) and the corners (--vzb-radius*).
   The gray steps (--vzb-ink-2 · muted · grid · track · other · base) and the badge and tooltip colors are mixed from the background, the text and the meaning colors, so they follow. Set one yourself and yours is used.
   A variable set to initial is empty. Empty, the card uses the Vizney shape it gives each element; set, the whole group uses that value.
   The colors come from Vizney's Figma palette: blue (#007aff), pink-red (#ff2d55) and orange (#ff9500) for data, green (#34c759) and red (#ff3b30) for good and bad.
   With "theme": "dark" in the JSON, the .vzb-dark values below draw the card on Vizney black with yellow as the first color.
   List: https://blocks.vizney.com/tokens.css */
:where(:root) {
  /* Type. Vizney Blocks Sans is the name of the @font-face inside the card (the Spoqa Han Sans Neo files). A browser fetches the files only when
     some text is drawn in that name, so once --vzb-font is changed the card requests nothing from outside. */
  --vzb-font: 'Vizney Blocks Sans', 'Spoqa Han Sans Neo', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;   /* every word on the card */
  --vzb-title-font: initial;   /* the font of a chart card's title. Empty: --vzb-font */
  --vzb-title-size: 17px;   /* title size. Anything under 12px is drawn at 12px */
  --vzb-title-weight: 500;   /* title weight */
  --vzb-title-case: none;   /* title case (text-transform): uppercase for capitals */
  --vzb-title-tracking: normal;   /* title letter-spacing, such as 0.08em */
  --vzb-sub-font: initial;   /* the font of the subtitle (period and basis). Empty: --vzb-font */
  --vzb-sub-size: 14px;   /* subtitle size. Anything under 12px is drawn at 12px */
  --vzb-sub-weight: 400;   /* subtitle weight */
  --vzb-sub-case: none;   /* subtitle case */
  --vzb-sub-tracking: normal;   /* subtitle letter-spacing */
  /* Background and text. The gray steps are the text color mixed into the background (in brackets, the color the defaults give). */
  --vzb-card: #ffffff;   /* card background; also the background of opened parts (calendar, list, distribution, download menu), the text on a picked chip or day, the outline of bar labels */
  --vzb-edge: rgba(17, 24, 39, 0.05);   /* border of the card, opened parts and inputs */
  --vzb-ink: #1b1b1b;   /* titles, values, headline figures. On controls, the fill of a picked chip or day, the thumbs and the download button */
  --vzb-ink-2: color-mix(in srgb, var(--vzb-ink) 79.39%, var(--vzb-card));   /* (#4a4a4a) names, legends, text of unpicked chips */
  --vzb-muted: color-mix(in srgb, var(--vzb-ink) 61.4%, var(--vzb-card));   /* (#737373) subtitle, units, axis ticks, light names, the connecting dots of Waterfall */
  --vzb-grid: color-mix(in srgb, var(--vzb-ink) 8.77%, var(--vzb-card));   /* (#ebebeb) the baseline */
  --vzb-track: color-mix(in srgb, var(--vzb-ink) 6.14%, var(--vzb-card));   /* (#f1f1f1) light fills: chips, buttons and the date button, the replay button, the bubble, the band of a picked row */
  --vzb-other: color-mix(in srgb, var(--vzb-ink) 16.67%, var(--vzb-card));   /* (#d9d9d9) hovered fills, the slider rail and distribution bars, the scrubber */
  --vzb-base: color-mix(in srgb, var(--vzb-ink) 25.88%, var(--vzb-card));   /* (#c4c4c4) reference bars: the totals of Waterfall, the bars under the limit in Bar Overflow */
  /* Data colors */
  --vzb-primary: #007aff;   /* first data color (blue): the picked item, the water of Funnel, the picked cells of Waffle, the picked line of Bump. Also the focus ring (when --vzb-focus is empty) */
  --vzb-secondary: #ff2d55;   /* second data color (pink-red): the left group of Butterfly */
  --vzb-tertiary: #ff9500;   /* third data color (orange) */
  /* Meaning colors. good and bad paint only whether a change is good or bad; alert paints only warnings (over a limit, a wrong input, an error message).
     Turn decreases gray and the part over a limit stays red. -tint (badge background) and -ink (text) mix the fill into the background and the text, so they follow. */
  --vzb-good: #34c759;   /* fill of a good change: the increases of Waterfall. Palette green; 2.2:1 on white, so never for text */
  --vzb-good-tint: color-mix(in srgb, var(--vzb-good) 10.04%, var(--vzb-card));   /* (#ebf9ee) background of a good-change badge */
  --vzb-good-ink: color-mix(in srgb, var(--vzb-good) 58.97%, var(--vzb-ink));   /* (#2a8040) text of a good change (badges, the bubble), 4.9:1 on white */
  --vzb-bad: #ff3b30;   /* fill of a bad change: the decreases of Waterfall. Palette red */
  --vzb-bad-tint: color-mix(in srgb, var(--vzb-bad) 10.17%, var(--vzb-card));   /* (#ffebea) background of a bad-change badge */
  --vzb-bad-ink: color-mix(in srgb, var(--vzb-bad) 77.3%, var(--vzb-ink));   /* (#cb342b) text of a bad change, 5.2:1 on white */
  --vzb-alert: #ff3b30;   /* fill of a warning: the part over the limit in Bar Overflow and its key, the border of a wrong date. Palette red */
  --vzb-alert-ink: color-mix(in srgb, var(--vzb-alert) 77.3%, var(--vzb-ink));   /* (#cb342b) text of a warning: the amount over, error messages */
  /* Tooltip and focus */
  --vzb-tip: var(--vzb-ink);   /* (#1b1b1b) tooltip background */
  --vzb-tip-ink: var(--vzb-card);   /* (#ffffff) tooltip text; names and notes are 72% of it */
  --vzb-focus: initial;   /* keyboard focus ring. Empty: --vzb-primary. Set it when the accent is close to the background (lime on white) */
  /* Shape */
  --vzb-radius: 18px;   /* card corners. Floating parts (tooltip 8, calendar and list 16, distribution 12) and the focus outline (4) take the smaller of this and their own */
  --vzb-radius-mark: initial;   /* corners of data marks: bar ends (4), waffle cells (2), the bubble (7), share pills (12), change badges (7), the band of a picked row (4), legend keys (2 · 3). 0 squares them all */
  --vzb-radius-control: initial;   /* corners of controls: chips and the date and list buttons (pills), icon buttons and thumbs (circles), inputs (10), period buttons, day cells, list rows. 0 squares them all */
  --vzb-unit: 168px;   /* 1 height unit; a chart card is 1, 1.5 or 2 units tall */
  --vzb-shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 18px 40px -22px rgba(17, 24, 39, 0.22);   /* card shadow; none for no shadow */
  --vzb-shadow-float: initial;   /* shadow of floating parts (tooltip, calendar, list, distribution, download menu). Empty: the Vizney shadow of each; none for no shadow */
  /* Motion. What moves decides the value. A spring is two numbers, 'stiffness damping' (stiffer is faster; less damping bounces more).
     Things you touch: Follow · Settle · Pop · Fade · Press. Things that carry a value: Move (never overshoots: a height or a position
     is the value, so a bounce shows a wrong value for a moment). Rhythm: Lead · Seq · Rest. Move what sits around the cards
     (KPI tiles, tables, tabs) with the same values and the screen reads as made by one hand. */
  --vzb-follow: 1000 63;   /* Follow: sticks to the pointer while held (the slider thumb). No overshoot */
  --vzb-settle: 340 26;   /* Settle: lands when let go, opened or widened (calendar, list, menu, rolling digits). 4% overshoot */
  --vzb-pop: 520 21;   /* Pop: a released button, a picked day or chip, a surfacing label. Not a value, so it bounces. 20% overshoot */
  --vzb-move: 200 28.3;   /* Move: what carries a value, such as a bar height, goes to its place. No overshoot (damping = 2√stiffness) */
  --vzb-fade: 0.14s;   /* Fade: the time opacity and color take, the same in and out */
  --vzb-press: 0.08s;   /* Press: the time to sink when pressed. Released, it comes back with Pop */
  --vzb-lead: 400ms;   /* Lead: the wait before a chart card starts once it is in view */
  --vzb-seq: 1200ms;   /* Seq: the whole time items take to move in turn, shared out among them */
  --vzb-rest: 2600ms;   /* Rest: the pause before a looping card (the gallery) starts again */
  /* The six below are the CSS transition time (-t) and curve (-e) worked out from the springs above. Do not edit them: change the
     springs and the cards work them out again. */
  --vzb-settle-t: 0.39s;
  --vzb-settle-e: linear(0, 0.023, 0.081, 0.164, 0.26, 0.362, 0.463, 0.56, 0.65, 0.731, 0.801, 0.861, 0.91, 0.95, 0.981, 1.005, 1.022, 1.033, 1.04, 1.043, 1.044, 1.042, 1.039, 1.036, 1.031, 1.027, 1.022, 1.018, 1.014, 1.011, 1.008, 1.005, 1);
  --vzb-pop-t: 0.52s;
  --vzb-pop-e: linear(0, 0.061, 0.212, 0.41, 0.619, 0.811, 0.969, 1.085, 1.158, 1.192, 1.193, 1.172, 1.138, 1.097, 1.057, 1.022, 0.995, 0.976, 0.965, 0.962, 0.963, 0.969, 0.977, 0.985, 0.992, 0.998, 1.003, 1.006, 1.007, 1.007, 1.007, 1.005, 1);
  --vzb-move-t: 0.54s;
  --vzb-move-e: linear(0, 0.024, 0.083, 0.161, 0.248, 0.335, 0.419, 0.498, 0.569, 0.633, 0.689, 0.737, 0.78, 0.816, 0.846, 0.872, 0.894, 0.913, 0.928, 0.941, 0.951, 0.96, 0.967, 0.973, 0.978, 0.982, 0.985, 0.988, 0.99, 0.992, 0.994, 0.995, 1);
}

/* Dark ("theme": "dark"): it picks the Vizney black background, so the card sets the same variables again inside itself, and colors on :root do not reach it.
   To match your screen, leave theme empty even on a dark screen and set the background, text and accent on :root. To change this block, write .vzb-dark { … } on your page (it is :where, so yours wins).
   Yellow, white and gray pass a color vision simulation (closest pair ΔE 14.9) and a contrast check against the card.
   Good and bad are the same green (#34c759) and red (#ff3b30) as on white, and on black they serve as text too (7.8:1 and 4.9:1). */
:where(.vzb-dark) {
  --vzb-card: #1b1b1b;   /* card background (Vizney black) */
  --vzb-edge: rgba(255, 255, 255, 0.08);   /* card border */
  --vzb-ink: #f5f5f5;   /* title and headline figure */
  --vzb-ink-2: color-mix(in srgb, var(--vzb-ink) 82.57%, var(--vzb-card));   /* (#cfcfcf) body text */
  --vzb-muted: color-mix(in srgb, var(--vzb-ink) 58.72%, var(--vzb-card));   /* (#9b9b9b) subtitle, units, axis ticks */
  --vzb-grid: color-mix(in srgb, var(--vzb-ink) 9.17%, var(--vzb-card));   /* (#2f2f2f) the baseline */
  --vzb-track: color-mix(in srgb, var(--vzb-ink) 7.8%, var(--vzb-card));   /* (#2c2c2c) light fills */
  --vzb-other: color-mix(in srgb, var(--vzb-ink) 22.94%, var(--vzb-card));   /* (#4d4d4d) hovered fills, rails */
  --vzb-base: color-mix(in srgb, var(--vzb-ink) 36.7%, var(--vzb-card));   /* (#6b6b6b) reference bars */
  --vzb-primary: #ffcc00;   /* first data color (Vizney yellow) */
  --vzb-secondary: #f5f5f5;   /* second data color (white) */
  --vzb-tertiary: #9b9b9b;   /* third data color (gray) */
  --vzb-good: #34c759;   /* good change (palette green) */
  --vzb-good-tint: color-mix(in srgb, var(--vzb-good) 16.24%, var(--vzb-card));   /* (#1f3725) good badge background */
  --vzb-good-ink: var(--vzb-good);   /* text of a good change */
  --vzb-bad: #ff3b30;   /* bad change (palette red) */
  --vzb-bad-tint: color-mix(in srgb, var(--vzb-bad) 8.07%, var(--vzb-card));   /* (#2d1e1d) bad badge background (as much as keeps 4.5:1 for the text) */
  --vzb-bad-ink: var(--vzb-bad);   /* text of a bad change */
  --vzb-alert: #ff3b30;   /* warning (palette red) */
  --vzb-alert-ink: var(--vzb-alert);   /* text of a warning */
  --vzb-tip: color-mix(in srgb, var(--vzb-ink) 14.22%, var(--vzb-card));   /* (#3a3a3a) tooltip background */
  --vzb-tip-ink: #ffffff;   /* tooltip text */
  --vzb-shadow: none;   /* card shadow */
}
/* 카드: 놓인 자리를 채웁니다. 폭은 자리의 폭이고, 높이는 1 · 1.5 · 2단위 가운데 하나를 바닥으로(단위 --vzb-unit, 카드마다 자기 CSS에서 정합니다)
   자리가 그보다 높으면 그 높이까지 늘어납니다. 높이가 정해진 요소 안에 두든(100%), 격자 · 플렉스 줄에서 옆 카드에 맞춰 늘어나든 같습니다.
   늘어난 높이는 그림이 씁니다(chart.css의 .vzb-fill). */
.vzb-card {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: max(var(--vzb-unit) * 1.5, 100%);
  padding: 24px;
  background: var(--vzb-card);
  color: var(--vzb-ink);
  border: 1px solid var(--vzb-edge);
  border-radius: var(--vzb-radius);
  box-shadow: var(--vzb-shadow);
  font: 400 14px/20px var(--vzb-font);   /* 글자 크기는 세 단계: 기본 14px, 보조 12px(단위 · 축 눈금 · 요일 · 개수 · 큰 숫자 위 설명), 큰 숫자 18px(말풍선 · 툴팁). 그 밖에 제목 17px, 대표 수치 34px(단위 16px) */
  text-align: left;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
.vzb-card *, .vzb-card *::before, .vzb-card *::after { box-sizing: border-box; }

/* 머리: 제목과 기간 부제, 그 아래 대표 수치와 바로 뒤의 증감 배지.
   배지와 비교 문구는 숫자와 같은 줄의 항목이라, 좁으면 비교 문구만 아래 줄로 내려가고 배지는 숫자 뒤에 남습니다. */
/* 제목과 부제의 글꼴 · 크기 · 굵기 · 대소문자 · 자간은 --vzb-title-* · --vzb-sub-*로 바꿉니다. 크기는 12px 밑으로 내려가지 않고, 줄 높이는 크기에 맞춰 늘어납니다(기본 24px · 20px). */
.vzb-title { font-family: var(--vzb-title-font, var(--vzb-font)); font-size: max(12px, var(--vzb-title-size)); line-height: max(24px, calc(var(--vzb-title-size) * 1.3)); font-weight: var(--vzb-title-weight); text-transform: var(--vzb-title-case); letter-spacing: var(--vzb-title-tracking); }
.vzb-sub { margin-top: 2px; color: var(--vzb-muted); font-family: var(--vzb-sub-font, var(--vzb-font)); font-size: max(12px, var(--vzb-sub-size)); line-height: max(20px, calc(var(--vzb-sub-size) * 1.4)); font-weight: var(--vzb-sub-weight); text-transform: var(--vzb-sub-case); letter-spacing: var(--vzb-sub-tracking); }
.vzb-fig { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; margin-top: 20px; }   /* 숫자 줄은 기준선 아래에 16px이 남아 줄 사이를 따로 두지 않습니다 */
.vzb-num { margin-right: 4px; font-size: 34px; line-height: 40px; font-weight: 400; letter-spacing: -0.02em; white-space: nowrap; }   /* 숫자와 배지 사이 12px, 배지와 비교 문구 사이 8px */
.vzb-unit { margin-left: 4px; font-size: 16px; letter-spacing: 0; color: var(--vzb-muted); }
.vzb-delta { display: contents; color: var(--vzb-muted); white-space: nowrap; }
.vzb-vs { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.vzb-badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px 3px 6px; border-radius: var(--vzb-radius-mark, 7px); font-weight: 500; }
.vzb-badge.vzb-good { color: var(--vzb-good-ink); background: var(--vzb-good-tint); }
.vzb-badge.vzb-bad { color: var(--vzb-bad-ink); background: var(--vzb-bad-tint); }
.vzb-badge.vzb-flat { color: var(--vzb-ink-2); background: var(--vzb-track); padding-left: 8px; }
.vzb-arrow { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.vzb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* 그래픽은 카드 아래쪽에 붙습니다. 같은 줄의 카드 높이가 맞춰져도 그래픽끼리 바닥이 맞습니다. */
.vzb-foot { margin-top: auto; padding-top: 20px; }
.vzb-error { margin: 8px 0 0; color: var(--vzb-alert-ink); }
/* 굴러가는 숫자: 숫자 칸의 높이는 글자 높이(1.2em)이고, 칸 안의 0–9 띠가 위아래로 굴러 새 값에 섭니다. */
.vzb-rl { display: inline-flex; vertical-align: bottom; white-space: nowrap; font-variant-numeric: tabular-nums; }
.vzb-rl-col { display: inline-block; height: 1.2em; overflow: hidden; }
.vzb-rl-strip { display: flex; flex-direction: column; transition: transform var(--vzb-settle-t) var(--vzb-settle-e); }
.vzb-rl-strip > span, .vzb-rl-ch { display: block; height: 1.2em; line-height: 1.2em; }
/* Filter Chips: 카드 틀 없이 칩만 그립니다. 칩은 높이 40px, 모서리 20px(--vzb-radius-control), 14px 글자이고 사이는 8px입니다(컨트롤 크기 기준: 글자가 있는 조작부는 높이 40px · 글자 14px, 아이콘만 있는 단추는 44px). 고른 칩은 글자색(밝은 바탕 검정, 어두운 바탕 흰색)으로
   채우고 카드 바탕색으로 체크와 이름을 적습니다. 고르지 않은 칩은 트랙 회색입니다. 세 줄을 넘으면 한 줄로 두고 가로로 밉니다(is-scroll).
   누르면 0.92배로 눌렸다가 살짝 넘쳐 돌아오고(용수철 곡선), 체크는 칩이 13px 넓어지며 그려집니다. */

    list.addEventListener('click', (e) => {
      const b = e.target.closest('.vzb-ch-chip');
      if (!b) return;
      idle = performance.now() + 6000;
      toggle(b === all ? -1 : chips.indexOf(b));
    });
    paint();
    emit(true);
    onSize(list, fit);

    // 갤러리(data-vzb-loop): 화면에 보이는 동안, 손을 대기 전과 손을 뗀 지 6초 뒤부터 칩을 차례로 눌러 보입니다.
    if (card.closest('[data-vzb-loop]')) {
      const plan = [3, 4, -1, 5, 4];   // 한 바퀴 돌면 처음 고른 넷으로 돌아옵니다
      let k = 0, seen = true;
      if ('IntersectionObserver' in window) new IntersectionObserver((es) => { seen = es[es.length - 1].isIntersecting; }).observe(card);
      const timer = setInterval(() => {
        if (!card.isConnected) { clearInterval(timer); return; }
        if (!seen || performance.now() < idle) return;
        const i = plan[k++ % plan.length], b = i < 0 ? all : chips[i % chips.length];
        if (!b) return;
        b.classList.add('is-press');
        setTimeout(() => b.classList.remove('is-press'), 120);
        toggle(i < 0 ? -1 : i % chips.length);
      }, 1300);
    }
  });
})();
</script>
