.vzb-tip {

/* 색 이름: t1 · t2 · t3 선(주황 · 분홍빨강 · 파랑), f1 · f2 · f3 막대와 면(주황 · 분홍빨강 · 노랑), fs 옅은 주황,
   t0 · f0 비교 회색, tx · fx 그 밖의 회색, fg · fb 좋음 · 나쁨, ti 목표 · 기준 표시 */

.vzb-fg { --vzb-c: var(--vzb-good); }

/* 라인 카드: 2px 선(주황 · 분홍빨강 · 파랑, 비교는 회색, 넷째부터는 옅은 회색), 흰 테두리 점, 기간을 찾는 세로선.
   선이 하나인 카드는 선 아래를 위 22%에서 아래 0%로 옅어지게 칠합니다. */
.vzb-ln-line { fill: none; stroke: var(--vzb-c); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }

/* 탭 카드: 머리 아래를 같은 폭의 칸으로 나눠 지표 이름과 대표 수치를 둡니다. 고른 칸은 검정 밑줄, 나머지는 회색 글자입니다. */
.vzb-tabs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); margin-top: 12px; border-bottom: 1px solid var(--vzb-grid); }
.vzb-tab {

}

<script>
(() => {
  'use strict';
  /* 공통 도구: 숫자 표기, 증감, 카드 머리, 그리기 시작 */
  const SVGNS = 'http://www.w3.org/2000/svg';
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function svgEl(tag, attrs) {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  const nfs = {};
  function num(v, d) {
    nfs[d] = nfs[d] || new Intl.NumberFormat('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d });
    return nfs[d].format(v);
  }
  function krw(v) {
    const a = Math.abs(v);
    if (a >= 1e12) return [num(v / 1e12, 1), '조'];
    if (a >= 1e8) return [num(v / 1e8, a >= 1e10 ? 0 : 1), '억'];
    if (a >= 1e4) return [num(v / 1e4, 0), '만'];
    return [num(v, 0), '원'];
  }
  // 달러 금액: 원래 값을 받아 K · M · B로 줄이고 소수 한 자리로 맞춥니다($745.6K). 접미사는 단위처럼 작게 씁니다.
  function usd(v, d) {
    const a = Math.abs(v), s = v < 0 ? '−' : '';
    const [div, u] = a >= 1e9 ? [1e9, 'B'] : a >= 1e6 ? [1e6, 'M'] : a >= 1e3 ? [1e3, 'K'] : [1, ''];
    return [`${s}$${num(a / div, d != null ? d : div > 1 ? 1 : 0)}`, u];
  }
  // format: eok(억 단위 값) · krw(원 단위 값) · usd(달러 값) · count(unit으로 단위) · pct(증감을 %p로) · days
  function format(d) {
    const dec = (v, fallback) => (d.decimals != null ? d.decimals : fallback);
    switch (d.format) {
      case 'eok': return { parts: (v) => [num(v, dec(v, Number.isInteger(v) || Math.abs(v) >= 100 ? 0 : 1)), '억'], rel: true };
      case 'krw': return { parts: krw, rel: true };
      case 'usd': return { parts: (v) => usd(v, d.decimals), rel: true, usd: true };
      case 'pct': return { parts: (v) => [num(v, dec(v, 1)), '%'], rel: false };
      case 'days': return { parts: (v) => [num(v, dec(v, 1)), '일'], rel: true };
      default: return { parts: (v) => [num(v, dec(v, Number.isInteger(v) ? 0 : 1)), d.unit || ''], rel: true };
    }
  }
  const show = (f, v) => f.parts(v).join('');
  // 그릴 수 있는 숫자인지(빈 값 · 빈 글자 · NaN 제외)
  const fin = (v) => v != null && v !== '' && isFinite(v);
  // 증감: 방향은 화살표로, 좋고 나쁨(tone)은 better(up · down · neutral)로 정합니다. 비율은 %p로 적습니다.
  function delta(f, value, base, better) {
    const diff = value - base;

  // 같은 종류의 카드를 모두 찾아 그립니다. 코드를 두 번 붙여 넣어도 카드는 한 번만 그립니다.

      if (S.stack) {
        for (let i = 0; i < n; i++) {
          let pos = 0, neg = 0;

      const first = S.series[0] ? lastIdx(S.series[0].values, n) : -1;   // 첫 선(현재)의 마지막 기간
      S.latest = first >= 0 ? first : Math.max(-1, ...S.series.map((s) => lastIdx(s.values, n)));
      plot.setAttribute('aria-label', `${S.name || d.title || ''} ${S.kind || '차트'}, ${labels[0] || ''}–${labels[n - 1] || ''}. 좌우 화살표로 기간을 옮깁니다. 모든 값은 이어지는 표에 있습니다.`);
      const table = el('table');
      const hr = el('tr');
      hr.append(el('th', null, '기간'));
      S.series.forEach((s) => hr.append(el('th', null, s.name)));
      table.append(el('caption', null, S.name || d.title || ''), hr);
      labels.forEach((l, i) => {
        const tr = el('tr');
        tr.append(el('th', null, l));
        S.series.forEach((s) => tr.append(el('td', null, s.values[i] == null ? '' : show(S.f, s.values[i]))));
        table.append(tr);
      });
      sr.replaceChildren(table);
    }
    use({});

    function draw(w, h) {
      lastW = w; lastH = h;
      const top = S.padTop || 8;
      const sides = (S.side || []).filter((m) => isFinite(m.value));
      const ends = S.paint.gutter(S, c);
      const endW = Math.max(0, ...ends.map((s) => textW(s, 500, fam)), ...sides.map((m) => Math.max(...m.lines.map((l) => textW(l, 500, fam)))));
      const labW = Math.max(...labels.map((l) => textW(l, 400, fam)));
      // 눈금과 가로 배치: 바닥(base)에 따라 눈금 수와 눈금 글자 폭이 바뀌므로 함께 계산합니다.
      const layout = (base) => {
        const t = yTicks(S.vmin, S.vmax, Math.max(3, Math.min(4, Math.floor((base - top) / 28) + 1)));
        const dec = stepDec(t.step), ticks = [];
        for (let k = 0; k < t.n; k++) ticks.push(+(t.lo + k * t.step).toFixed(dec));
        const tt = tickText(S.fmt, dec, t.step, Math.max(...ticks.map(Math.abs)));
        // 단위(억 · % · 만 · $ 등)는 맨 위 눈금에만 붙이고, 나머지 눈금은 숫자만 적습니다.
        const tickLabel = ticks.map((v, k) => (k === ticks.length - 1 ? tt(v) : tt(v).replace(/[^\d.,−]+$/, '').replace(/^(−?)\$/, '$1')));
        const gut = Math.ceil(Math.max(...tickLabel.map((s) => textW(s, 400, fam)))) + 10;
        const x0 = gut + 4, right = w - Math.max(endW ? endW + 14 : 0, S.band ? 4 : labW / 2 + 1, 8);
        const step = S.band ? (right - x0) / Math.max(1, n) : (right - x0) / Math.max(1, n - 1);
        return { base, t, ticks, tickLabel, gut, x0, right, step };
      };
      // 항목 축(categorical)의 이름이 한 줄에 다 들어가지 않으면 솎아 내지 않고 두 줄로 엇갈려 적습니다(바닥을 14px 올립니다).
      let L = layout(h - 24);
      const stagger = !!S.categorical && n > 1 && labW + 6 > L.step;
      if (stagger) L = layout(h - 38);
      const { base, t, ticks, tickLabel, gut, x0, right } = L, bottom = base;
      c.step = L.step;
      c.xs = labels.map((_, i) => (S.band ? x0 + c.step * (i + 0.5) : n < 2 ? (x0 + right) / 2 : x0 + i * c.step));
      c.y = (v) => bottom - ((v - t.lo) / (t.hi - t.lo)) * (bottom - top);
      Object.assign(c, { w, h, top, bottom, left: x0, right });
      svg.setAttribute('width', w);
      svg.setAttribute('height', h);
      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
      svg.replaceChildren();
      ticks.forEach((v, k) => {
        const y = Math.round(c.y(v)) + 0.5;
        svg.append(svgEl('line', { x1: gut, x2: right, y1: y, y2: y, class: v === 0 ? 'vzb-ax-zero' : 'vzb-ax-grid' }), svgText(gut - 8, y + 4, tickLabel[k], 'vzb-ax-label', 'end'));
      });
      // 기간 이름은 겹치지 않고 다섯 개 안팎이 되도록 솎아 내되, 마지막 값이 있는 기간은 항상 남깁니다. 항목 축(categorical)은 모두 적고 굵게 하지 않습니다.
      const every = stagger ? 1 : Math.max(1, Math.ceil((labW + (S.categorical ? 6 : 16)) / Math.max(1, c.step)), S.categorical ? 1 : Math.ceil((n - 1) / 4));
      const anchor = S.categorical ? 0 : S.latest >= 0 ? S.latest : n - 1;
      labels.forEach((l, i) => {
        if ((((anchor - i) % every) + every) % every) return;
        svg.append(svgText(c.xs[i], base + 18 + (stagger && i % 2 ? 14 : 0), l, !S.categorical && i === anchor ? 'vzb-ax-label is-last' : 'vzb-ax-label', 'middle'));
      });
      if (S.under) S.under(svg, c);
      back = svgEl('g', {});
      svg.append(back);
      const taken = S.paint.draw(svg, c, S) || [];
      // 오른쪽 끝 이름은 선 높이를 가운데로 두고, 선 끝 값과 겹치면 그 값의 반대쪽으로 비켜 적습니다.
      sides.forEach((m) => {
        const y = c.y(m.value), lh = 14;
        let first = y + 4 - ((m.lines.length - 1) * lh) / 2;
        const span = () => [first - 11, first + (m.lines.length - 1) * lh + 3];
        taken.forEach((ty) => {
          const [a, b] = span();
          if (ty + 8 <= a || ty - 8 >= b) return;
          first += ty < y ? ty + 8 - a : ty - 8 - b;
        });
        m.lines.forEach((l, j) => svg.append(svgText(right + 10, first + j * lh, l, j ? 'vzb-ax-end vzb-ax-mute' : 'vzb-ax-end')));
      });
      if (S.over) S.over(svg, c);
      front = svgEl('g', {});
      svg.append(front);
    }
    onSize(plot, draw);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (lastW) draw(lastW, lastH); });

    function defaultTip(i) {
      const series = S.series;
      if (series.length === 1) return { value: series[0].values[i] == null ? '–' : show(S.f, series[0].values[i]) };
      const rows = series.filter((s) => s.values[i] != null).map((s) => ({ tone: s.tone, name: s.name, value: show(S.f, s.values[i]), v: s.values[i] }));
      if (S.sort) rows.sort((a, b) => b.v - a.v);
      return { rows };
    }
    function point(i) {
      back.replaceChildren();
      front.replaceChildren();
      S.paint.mark(i, c, S, back, front);
      const t = tipBody(S.tip ? S.tip(i) : defaultTip(i), labels[i]);
      const r = plot.getBoundingClientRect();
      return { x: r.left + c.xs[i], y: r.top + c.top, label: labels[i], value: t.node, text: t.text, side: true };
    }
    interact(plot, n,
      (cx) => {
        const x = cx - plot.getBoundingClientRect().left;
        let best = 0;
        c.xs.forEach((v, i) => { if (Math.abs(v - x) < Math.abs(c.xs[best] - x)) best = i; });
        return best;
      },
      point,
      () => { if (back) back.replaceChildren(); if (front) front.replaceChildren(); });
    return {
      show(next) {
        use(next);
        if (back) back.replaceChildren();
        if (front) front.replaceChildren();
        hideTip();
        if (lastW) draw(lastW, lastH);
      },
    };
  }

  /* 라인 카드: 축 차트 공통 틀 위에 선을 그립니다. 선 모양(curve)은 곡선 · 직선 · 계단 가운데 고릅니다.
     series의 end는 마지막 기간 값을 선 끝에 적고, dot은 선의 마지막 점을 찍고, area는 선 아래를 옅게 칠합니다. */

  // 빈 기간(null)에서 선을 끊고, 이어진 구간마다 고른 모양으로 잇습니다.
  function pathOf(vals, c, curve) {
    let d = '', run = [];
    for (let i = 0; i <= c.n; i++) {
      const v = i < c.n ? vals[i] : null;
      if (v == null) { if (run.length) d += linePath(run, curve); run = []; continue; }
      run.push({ x: c.xs[i], y: c.y(v) });
    }
    return d;
  }
  // 선 아래 음영: 이어진 구간마다 선에서 그래프 바닥까지 칠하고, 위(선 색 22%)에서 아래(0%)로 옅어집니다. KPI - Line과 같은 음영입니다.
  function areaOf(vals, c, curve) {
    let d = '', run = [];
    const flush = () => {
      if (run.length > 1) d += `${linePath(run, curve)}L${run[run.length - 1].x.toFixed(2)},${c.bottom}L${run[0].x.toFixed(2)},${c.bottom}Z`;
      run = [];
    };
    for (let i = 0; i <= c.n; i++) {
      const v = i < c.n ? vals[i] : null;
      if (v == null) flush(); else run.push({ x: c.xs[i], y: c.y(v) });
    }
    return d;
  }
  const linePaint = {
    gutter: (S, c) => S.series.filter((s) => s.end && lastIdx(s.values, c.n) === c.n - 1).map((s) => show(S.f, s.values[c.n - 1])),
    draw(svg, c, S) {
      const series = S.series, n = c.n;
      const lines = series.map((s) => svgEl('path', { d: pathOf(s.values, c, S.curve), class: `vzb-ln-line vzb-${s.tone}` }));
      series.forEach((s) => {
        if (!s.area) return;
        const id = `vzb-ar${Math.random().toString(36).slice(2, 8)}`, defs = svgEl('defs', {});
        const g = svgEl('linearGradient', { id, x1: 0, y1: 0, x2: 0, y2: 1, class: `vzb-${s.tone}` });
        g.append(svgEl('stop', { offset: 0, class: 'vzb-ln-g1' }), svgEl('stop', { offset: 1, class: 'vzb-ln-g2' }));
        defs.append(g);
        svg.append(defs, svgEl('path', { d: areaOf(s.values, c, S.curve), fill: `url(#${id})`, class: 'vzb-ln-area' }));
      });
      // 그 밖의 회색 선, 비교 회색 선, 색 선 순서로 겹칩니다.
      ['tx', 't0'].forEach((tone) => series.forEach((s, k) => { if (s.tone === tone) svg.append(lines[k]); }));
      series.forEach((s, k) => { if (s.tone !== 'tx' && s.tone !== 't0') svg.append(lines[k]); });
      series.forEach((s) => {
        const i = lastIdx(s.values, n);
        if (s.dot && i >= 0) svg.append(svgEl('circle', { cx: c.xs[i], cy: c.y(s.values[i]), r: 4, class: `vzb-ln-dot vzb-${s.tone}` }));
      });
      // 선 끝 값은 앞 항목부터 적고, 이미 적은 값과 겹치면 생략합니다. 값은 툴팁과 표에 남습니다.
      const taken = [];
      series.forEach((s) => {
        if (!s.end || lastIdx(s.values, n) !== n - 1) return;
        const y = c.y(s.values[n - 1]);
        if (taken.some((ty) => Math.abs(ty - y) < 14)) return;
        taken.push(y);
        svg.append(svgText(c.xs[n - 1] + 10, y + 4, show(S.f, s.values[n - 1]), 'vzb-ax-end'));
      });
      return taken;
    },
    mark(i, c, S, back, front) {   // 기간을 찾는 세로선과 그 기간의 점
      front.append(svgEl('line', { x1: c.xs[i], x2: c.xs[i], y1: c.top, y2: c.bottom, class: 'vzb-ln-cross' }));
      S.series.forEach((s) => {
        const v = s.values[i];
        if (v != null) front.append(svgEl('circle', { cx: c.xs[i], cy: c.y(v), r: 4, class: `vzb-ln-dot vzb-${s.tone}` }));
      });
    },
  };
  function lineCard(card, d, f, cfg) {
    return axisCard(card, d, f, Object.assign({ paint: linePaint, kind: '선 차트', headroom: 0.15 }, cfg));
  }

  /* 탭 카드: 머리 아래를 똑같은 폭의 칸으로 나눠 지표 이름과 대표 수치를 두고, 고른 탭만 그립니다.
     탭마다 format이 달라도 되고, 대표 수치는 value가 없으면 마지막 값입니다. 값이 없는 탭(목록)은 이름만 적습니다.
     draw는 lineCard · barCard · basicList, make(탭)은 그 탭의 그리기 설정입니다. 탭은 좌우 화살표로도 옮깁니다. */
  function tabsCard(card, d, draw, make) {
    const tabs = (d.tabs || []).slice(0, 3);
    if (!tabs.length) throw new Error('tabs를 확인하세요.');
    const n = (d.labels || []).length;
    const fmts = tabs.map((t) => format(t));
    const row = el('div', 'vzb-tabs');
    row.setAttribute('role', 'tablist');
    row.setAttribute('aria-label', d.title || '지표');
    let cur = 0, chart = null;
    const spec = (i) => Object.assign({ f: fmts[i], fmt: tabs[i], name: tabs[i].name }, make(tabs[i]));
    if (!tabs.some((t) => Array.isArray(t.values))) row.classList.add('is-plain');
    const btns = tabs.map((t, i) => {
      const b = el('button', 'vzb-tab');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      const vals = t.values || [];
      let k = Math.min(vals.length, n) - 1;
      while (k >= 0 && vals[k] == null) k--;
      const v = t.value != null ? t.value : k >= 0 ? vals[k] : null;
      b.append(el('span', null, t.name));
      if (v != null) {
        const [text, unit] = fmts[i].parts(v);
        const fig = el('b', null, text);
        if (unit) fig.append(el('small', null, unit));
        b.append(fig);
      }
      b.addEventListener('click', () => pick(i));
      row.append(b);
      return b;
    });
    row.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      pick((cur + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length);
      btns[cur].focus();
    });
    const mark = () => btns.forEach((b, k) => { b.setAttribute('aria-selected', String(k === cur)); b.tabIndex = k === cur ? 0 : -1; });
    function pick(i) {
      if (i === cur) return;
      cur = i;
      mark();
      chart.show(spec(i));
    }
    mark();
    chart = draw(card, d, fmts[0], Object.assign({ top: row }, spec(0)));
  }

  // Line - Tabs: 머리 아래 세 칸 탭에 지표 이름과 대표 수치를 두고, 고른 지표의 선만 그립니다.
  mount('line-tabs', (card, d) => {
    tabsCard(card, d, lineCard, (t) => ({ series: [{ name: t.name, values: t.values || [], tone: 't1', end: true, dot: true, area: true }] }));
  });
})();
</script>
