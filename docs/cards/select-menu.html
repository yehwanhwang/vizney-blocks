/* Vizney Blocks tokens: re-declare the same variables on your page's :root and they apply to every card.
   The colors come from Vizney's Figma palette: blue (#007aff), pink-red (#ff2d55) and orange (#ff9500) for data, green (#34c759) and red (#ff3b30)
   for good and bad, with lighter steps mixed from the same colors and the background. The text is Vizney black (#1b1b1b).
   With "theme": "dark" in the JSON, the .vzb-dark values below draw the card on Vizney black with yellow as the first color and white as the second.
   List: https://blocks.vizney.com/tokens.css */
:where(:root) {
  --vzb-font: 'Spoqa Han Sans Neo', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;   /* every word on the card */
  --vzb-card: #ffffff;   /* card background */
  --vzb-edge: rgba(17, 24, 39, 0.05);   /* card border */
  --vzb-ink: #1b1b1b;   /* title and headline figure */
  --vzb-ink-2: #4a4a4a;   /* body text, the no-change badge */
  --vzb-muted: #737373;   /* subtitle, units, axis ticks */
  --vzb-grid: #ebebeb;   /* grid lines and the line under the head: a solid gray one step off the background */
  --vzb-primary: #007aff;   /* first data color (blue): lines, bars, the largest item */
  --vzb-primary-tint: #e6f2ff;   /* light blue background: the shade under a line, the radar area */
  --vzb-primary-soft: #bfdeff;   /* bar-list bars that carry the name */
  --vzb-secondary: #ff2d55;   /* second data color (pink-red) */
  --vzb-tertiary: #ff9500;   /* third data color (orange) */
  --vzb-primary-mid: #8cc3ff;     /* one step lighter, for wide areas (treemap cells) */
  --vzb-secondary-mid: #ff7a93;   /* pink-red for wide areas */
  --vzb-tertiary-mid: #ffb54d;   /* orange for wide areas */
  --vzb-other-mid: #e3e3e3;   /* the Other group on wide areas */
  --vzb-line-3: #ff9500;   /* third line color (orange) */
  --vzb-base: #c4c4c4;   /* the baseline (last year's line, the radar baseline outline) */
  --vzb-track: #f1f1f1;   /* track behind the gauge and attainment bars */
  --vzb-other: #d9d9d9;   /* items folded into Other, items from the fourth on */
  --vzb-good: #34c759;   /* fill of a good change (increases in a waterfall, met targets). Palette green; 2.2:1 on white, so never for text */
  --vzb-good-tint: #ebf9ee;   /* background of a good-change badge (green 10%) */
  --vzb-good-ink: #2a8040;   /* text of a good change (badges): green with 41% black, 4.9:1 on white */
  --vzb-bad: #ff3b30;   /* fill of a bad change or of the part over a limit. Palette red, 3.6:1 on white */
  --vzb-bad-tint: #ffebea;   /* background of a bad-change badge (red 10%) */
  --vzb-bad-ink: #cb342b;   /* text of a bad change and of errors: red with 23% black, 5.2:1 on white */
  --vzb-tip: #1b1b1b;   /* tooltip background */
  --vzb-radius: 18px;   /* card corners */
  --vzb-unit: 168px;   /* 1 height unit; a chart card is 1, 1.5 or 2 units tall */
  --vzb-shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 18px 40px -22px rgba(17, 24, 39, 0.22);   /* card shadow */
  /* Motion. What moves decides the value. A spring is two numbers, 'stiffness damping' (stiffer is faster; less damping bounces more).
     Things you touch: Follow · Settle · Pop · Fade · Press. Things that carry a value: Move (never overshoots: a height or a position
     is the value, so a bounce shows a wrong value for a moment). Rhythm: Lead · Seq · Rest. Move what sits around the cards
     (KPI tiles, tables, tabs) with the same values and the screen reads as made by one hand. */
  --vzb-follow: 1000 63;   /* Follow: sticks to the pointer while held (the slider thumb). No overshoot */
  --vzb-settle: 340 26;   /* Settle: lands when let go, opened or widened (calendar, list, menu, rolling digits). 4% overshoot */
  --vzb-pop: 520 21;   /* Pop: a released button, a picked day or chip, a surfacing label. Not a value, so it bounces. 20% overshoot */
  --vzb-move: 200 28.3;   /* Move: what carries a value, such as a bar height, goes to its place. No overshoot (damping = 2√stiffness) */
  --vzb-fade: 0.14s;   /* Fade: the time opacity and color take, the same in and out */
  --vzb-press: 0.08s;   /* Press: the time to sink when pressed. Released, it comes back with Pop */
  --vzb-lead: 400ms;   /* Lead: the wait before a chart card starts once it is in view */
  --vzb-seq: 1200ms;   /* Seq: the whole time items take to move in turn, shared out among them */
  --vzb-rest: 2600ms;   /* Rest: the pause before a looping card (the gallery) starts again */
  /* The six below are the CSS transition time (-t) and curve (-e) worked out from the springs above. Do not edit them: change the
     springs and the cards work them out again. */
  --vzb-settle-t: 0.39s;
  --vzb-settle-e: linear(0, 0.023, 0.081, 0.164, 0.26, 0.362, 0.463, 0.56, 0.65, 0.731, 0.801, 0.861, 0.91, 0.95, 0.981, 1.005, 1.022, 1.033, 1.04, 1.043, 1.044, 1.042, 1.039, 1.036, 1.031, 1.027, 1.022, 1.018, 1.014, 1.011, 1.008, 1.005, 1);
  --vzb-pop-t: 0.52s;
  --vzb-pop-e: linear(0, 0.061, 0.212, 0.41, 0.619, 0.811, 0.969, 1.085, 1.158, 1.192, 1.193, 1.172, 1.138, 1.097, 1.057, 1.022, 0.995, 0.976, 0.965, 0.962, 0.963, 0.969, 0.977, 0.985, 0.992, 0.998, 1.003, 1.006, 1.007, 1.007, 1.007, 1.005, 1);
  --vzb-move-t: 0.54s;
  --vzb-move-e: linear(0, 0.024, 0.083, 0.161, 0.248, 0.335, 0.419, 0.498, 0.569, 0.633, 0.689, 0.737, 0.78, 0.816, 0.846, 0.872, 0.894, 0.913, 0.928, 0.941, 0.951, 0.96, 0.967, 0.973, 0.978, 0.982, 0.985, 0.988, 0.99, 0.992, 0.994, 0.995, 1);
}

/* Dark ("theme": "dark"): the same variables, changed inside the card only. One yellow plus white and gray draws in Vizney black, white and yellow.
   Yellow, white and gray pass a color vision simulation (closest pair ΔE 14.9) and a contrast check against the card.
   Good and bad are the same green (#34c759) and red (#ff3b30) as on white, and on black they serve as text too (7.8:1 and 4.9:1). */
.vzb-dark {
  --vzb-card: #1b1b1b;   /* card background (Vizney black) */
  --vzb-edge: rgba(255, 255, 255, 0.08);   /* card border */
  --vzb-ink: #f5f5f5;   /* title and headline figure */
  --vzb-ink-2: #cfcfcf;   /* body text */
  --vzb-muted: #9b9b9b;   /* subtitle, units, axis ticks */
  --vzb-grid: #2f2f2f;   /* grid lines and the rule under the head */
  --vzb-primary: #ffcc00;   /* first data color (Vizney yellow) */
  --vzb-primary-tint: #362f18;   /* dim yellow background */
  --vzb-primary-soft: #5f5013;   /* bar-list bars that carry the name */
  --vzb-secondary: #f5f5f5;   /* second data color (white) */
  --vzb-tertiary: #9b9b9b;   /* third data color (gray) */
  --vzb-primary-mid: #826b0f;   /* wide areas, one step darker so light text sits on them */
  --vzb-secondary-mid: #5c5c5c;   /* white for wide areas, gray so white text reads on it */
  --vzb-tertiary-mid: #424242;   /* gray for wide areas */
  --vzb-other-mid: #3a3a3a;   /* the Other group for wide areas */
  --vzb-line-3: #9b9b9b;   /* third line color (gray) */
  --vzb-base: #6b6b6b;   /* comparison baseline */
  --vzb-track: #2c2c2c;   /* gauge and attainment-bar track */
  --vzb-other: #4d4d4d;   /* items folded into Other */
  --vzb-good: #34c759;   /* good change (palette green) */
  --vzb-good-tint: #1f3725;   /* good badge background (green 16%) */
  --vzb-good-ink: #34c759;   /* text of a good change */
  --vzb-bad: #ff3b30;   /* bad change, over the limit (palette red) */
  --vzb-bad-tint: #2d1e1d;   /* bad badge background (red 8%, as much as keeps 4.5:1 for the text) */
  --vzb-bad-ink: #ff3b30;   /* text of a bad change and of errors */
  --vzb-tip: #3a3a3a;   /* tooltip background */
  --vzb-shadow: none;   /* card shadow */
}
/* 카드: 놓인 자리의 폭을 채우고, 높이는 1 · 1.5 · 2단위 가운데 하나입니다(단위 --vzb-unit, 카드마다 자기 CSS에서 정합니다). */
.vzb-card {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: calc(var(--vzb-unit) * 1.5);
  padding: 24px;
  background: var(--vzb-card);
  color: var(--vzb-ink);
  border: 1px solid var(--vzb-edge);
  border-radius: var(--vzb-radius);
  box-shadow: var(--vzb-shadow);
  font: 400 14px/20px var(--vzb-font);   /* 글자 크기는 세 단계: 기본 14px, 보조 12px(단위 · 축 눈금 · 요일 · 개수 · 큰 숫자 위 설명), 큰 숫자 18px(말풍선 · 툴팁). 그 밖에 제목 17px, 대표 수치 34px(단위 16px) */
  text-align: left;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
.vzb-card *, .vzb-card *::before, .vzb-card *::after { box-sizing: border-box; }

/* 머리: 제목과 기간 부제, 그 아래 대표 수치와 바로 뒤의 증감 배지.
   배지와 비교 문구는 숫자와 같은 줄의 항목이라, 좁으면 비교 문구만 아래 줄로 내려가고 배지는 숫자 뒤에 남습니다. */
.vzb-title { font-size: 17px; line-height: 24px; font-weight: 500; }
.vzb-sub { margin-top: 2px; color: var(--vzb-muted); }
.vzb-fig { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; margin-top: 20px; }   /* 숫자 줄은 기준선 아래에 16px이 남아 줄 사이를 따로 두지 않습니다 */
.vzb-num { margin-right: 4px; font-size: 34px; line-height: 40px; font-weight: 400; letter-spacing: -0.02em; white-space: nowrap; }   /* 숫자와 배지 사이 12px, 배지와 비교 문구 사이 8px */
.vzb-unit { margin-left: 4px; font-size: 16px; letter-spacing: 0; color: var(--vzb-muted); }
.vzb-delta { display: contents; color: var(--vzb-muted); white-space: nowrap; }
.vzb-vs { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.vzb-badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px 3px 6px; border-radius: 7px; font-weight: 500; }
.vzb-badge.vzb-good { color: var(--vzb-good-ink); background: var(--vzb-good-tint); }
.vzb-badge.vzb-bad { color: var(--vzb-bad-ink); background: var(--vzb-bad-tint); }
.vzb-badge.vzb-flat { color: var(--vzb-ink-2); background: var(--vzb-track); padding-left: 8px; }
.vzb-arrow { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.vzb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* 그래픽은 카드 아래쪽에 붙습니다. 같은 줄의 카드 높이가 맞춰져도 그래픽끼리 바닥이 맞습니다. */
.vzb-foot { margin-top: auto; padding-top: 20px; }
.vzb-error { margin: 8px 0 0; color: var(--vzb-bad-ink); }
/* 굴러가는 숫자: 숫자 칸의 높이는 글자 높이(1.2em)이고, 칸 안의 0–9 띠가 위아래로 굴러 새 값에 섭니다. */
.vzb-rl { display: inline-flex; vertical-align: bottom; white-space: nowrap; font-variant-numeric: tabular-nums; }
.vzb-rl-col { display: inline-block; height: 1.2em; overflow: hidden; }
.vzb-rl-strip { display: flex; flex-direction: column; transition: transform var(--vzb-settle-t) var(--vzb-settle-e); }
.vzb-rl-strip > span, .vzb-rl-ch { display: block; height: 1.2em; line-height: 1.2em; }
/* Select Menu: 카드 틀 없이 단추만 그립니다. 단추는 Date Picker와 같은 알약(높이 40px · 모서리 20px · 300px, 놓인 자리가 더 좁으면 그 폭)으로,
   트랙 회색 바탕에 목록 아이콘 · 고른 것(14px, 왼쪽 맞춤, 넘치면 '+남은 수') · 고른 수(여럿 고를 때, 굴러가는 숫자) · 펼침 표시를 둡니다.
   열려 있는 동안은 글자색으로 채웁니다. 펼친 목록은 카드(카드 바탕 · 테두리 · 그림자)로 단추 아래 8px에 떠오르고, 맨 위에 검색칸(36px),
   여럿 고를 때는 모두 고르기 · 모두 풀기와 고른 수(12px), 그 아래 항목 줄(36px, 14px)이 6줄까지 보이고 더 있으면 안에서 밉니다.
   고른 줄은 네모 칸을 글자색으로 채우고 체크를 긋습니다. count가 있으면 줄 오른쪽에 막대(44px 폭 안에서 가장 많은 항목 대비)와 숫자(12px)를 두고,
   목록이 펼쳐질 때 막대가 0에서 자랍니다. 검색어와 맞는 글자는 굵어지며 아래에 띠가 왼쪽에서 그어지고, 맞지 않는 줄은 접히며 사라집니다. */
/* 컨트롤은 카드 머리(제목 · 부제)와 카드 틀(바탕 · 테두리 · 그림자 · 안쪽 여백) 없이 조작부만 그립니다. 차트 위 필터 줄이나 머리글처럼
   원하는 자리에 그대로 놓는 부품이기 때문입니다. 폭은 놓인 자리를 채우고, 높이는 조작부 자체의 높이입니다.
   바탕을 비워 두므로 theme은 놓을 자리의 바탕에 맞춰 고릅니다(어두운 바탕이면 "dark"). */
.vzb-card[data-vzb="select-menu"] { min-height: 0; padding: 0; background: none; border: 0; border-radius: 0; box-shadow: none; }
.vzb-sm { display: flex; min-width: 0; }
.vzb-sm.is-end { justify-content: flex-end; }
.vzb-sm-anchor { position: relative; flex: none; width: 300px; max-width: 100%; }
.vzb-sm-btn { display: flex; align-items: center; gap: 8px; box-sizing: border-box; width: 100%; height: 40px; padding: 0 12px 0 14px; border: 0; border-radius: 20px; background: var(--vzb-track); color: var(--vzb-ink); font: 600 14px/1 var(--vzb-font); white-space: nowrap; overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform var(--vzb-pop-t) var(--vzb-pop-e); }
.vzb-sm-btn > * { color: var(--vzb-ink); }
.vzb-sm-btn:hover { background: var(--vzb-other); }
.vzb-sm.is-open .vzb-sm-btn { background: var(--vzb-ink); color: var(--vzb-card); }
.vzb-sm.is-open .vzb-sm-btn > * { color: var(--vzb-card); }
.vzb-sm-btn:active { transform: scale(0.97); transition-duration: var(--vzb-press); }
.vzb-sm-btn:focus-visible { outline: 2px solid var(--vzb-primary); outline-offset: 2px; }
.vzb-sm-ic { flex: none; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
.vzb-sm-ic circle { fill: currentColor; stroke: none; }
.vzb-sm-val { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.vzb-sm.is-none .vzb-sm-tx { color: var(--vzb-muted); }
.vzb-sm.is-open.is-none .vzb-sm-tx { color: color-mix(in srgb, var(--vzb-card) 70%, transparent); }
.vzb-sm-n { flex: none; display: inline-flex; align-items: baseline; padding: 3px 7px; border-radius: 10px; background: color-mix(in srgb, var(--vzb-ink) 10%, transparent); font-size: 12px; font-weight: 700; line-height: 1.2em; }
.vzb-sm.is-open .vzb-sm-n { background: color-mix(in srgb, var(--vzb-card) 22%, transparent); }
.vzb-sm-chev { flex: none; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: transform var(--vzb-pop-t) var(--vzb-pop-e); }
.vzb-sm.is-open .vzb-sm-chev { transform: rotate(180deg); }
.vzb-sm-pop { position: absolute; left: 0; top: calc(100% + 8px); z-index: 3; box-sizing: border-box; width: 100%; padding: 10px 6px 6px; border: 1px solid var(--vzb-edge); border-radius: 16px; background: var(--vzb-card); box-shadow: 0 12px 32px rgba(27, 27, 27, 0.18); color: var(--vzb-ink); opacity: 0; visibility: hidden; transform: translateY(-6px) scale(0.97); transform-origin: 50% 0; transition: opacity var(--vzb-fade), transform var(--vzb-fade) ease-out, visibility 0s var(--vzb-fade); }
.vzb-sm.is-up .vzb-sm-pop { top: auto; bottom: calc(100% + 8px); transform: translateY(6px) scale(0.97); transform-origin: 50% 100%; }
.vzb-sm.is-open .vzb-sm-pop { opacity: 1; visibility: visible; transform: none; transition: opacity var(--vzb-fade), transform var(--vzb-settle-t) var(--vzb-settle-e), visibility 0s; }
.vzb-sm-search { position: relative; display: flex; align-items: center; margin: 0 4px 6px; }
.vzb-sm-sic { position: absolute; left: 10px; width: 16px; height: 16px; fill: none; stroke: var(--vzb-muted); stroke-width: 1.6; stroke-linecap: round; pointer-events: none; }
.vzb-sm-in { flex: 1 1 auto; min-width: 0; box-sizing: border-box; height: 36px; padding: 0 34px 0 34px; border: 1px solid var(--vzb-edge); border-radius: 10px; background: var(--vzb-card); color: var(--vzb-ink); font: 500 14px/1 var(--vzb-font); outline: none; transition: border-color var(--vzb-fade), box-shadow var(--vzb-fade); }
.vzb-sm-in::placeholder { color: var(--vzb-muted); }
.vzb-sm-in:hover { border-color: color-mix(in srgb, var(--vzb-ink) 30%, transparent); }
.vzb-sm-in:focus { border-color: var(--vzb-ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--vzb-ink) 14%, transparent); }

    const empty = el('p', 'vzb-sm-empty');
    empty.hidden = true;
    pop.append(sbox, ...(one ? [] : [bar]), list, empty);
    anchorEl.append(btn, pop);
    root.append(anchorEl, say);
    card.append(root);

    // 한글 초성: 가(0xAC00)부터 588자마다 초성이 바뀝니다. 초성 글자(0x3131…)만 친 검색어는 이름의 초성과 견줍니다.
    function initials(s) {
      const CHO = [0x3131, 0x3132, 0x3134, 0x3137, 0x3138, 0x3139, 0x3141, 0x3142, 0x3143, 0x3145, 0x3146, 0x3147, 0x3148, 0x3149, 0x314a, 0x314b, 0x314c, 0x314d, 0x314e];
      return [...s].map((c) => { const k = c.charCodeAt(0) - 0xac00; return k >= 0 && k < 11172 ? String.fromCharCode(CHO[Math.floor(k / 588)]) : c.toLowerCase(); }).join('');
    }
    const isCho = (q) => q.length > 0 && [...q].every((c) => { const k = c.charCodeAt(0); return k >= 0x3131 && k <= 0x314e; });
    // 맞는 자리: [시작, 끝] 또는 null. 초성 검색이면 초성 글자열에서, 아니면 이름에서 대소문자 없이 찾습니다(두 글자열의 자리는 글자마다 같습니다).
    const hit = (row, q) => {
      if (!q) return [0, 0];
      const at = (isCho(q) ? row.cho : row.low).indexOf(q.toLowerCase());
      return at < 0 ? null : [at, at + q.length];
    };

    let q = '', active = -1;
    function filter() {
      let n = 0;
      rows.forEach((row) => {
        const h = hit(row, q);
        row.on = !!h;
        row.r.classList.toggle('is-gone', !h);
        row.r.setAttribute('aria-hidden', String(!h));
        if (h) n += 1;
        // 맞는 글자를 드러냅니다(밑줄이 왼쪽에서 그어지며 굵어짐). 검색어가 없으면 이름만 둡니다.
        if (h && q) row.nm.replaceChildren(row.name.slice(0, h[0]), el('mark', 'vzb-sm-hit', row.name.slice(h[0], h[1])), row.name.slice(h[1]));
        else row.nm.textContent = row.name;
      });
      empty.hidden = n > 0;
      empty.textContent = n ? '' : tx(d, '"%s"와 맞는 항목이 없습니다.', q);
      sbox.classList.toggle('has-q', !!q);
      const vis = visible();
      if (!vis.includes(active)) setActive(vis.length ? vis[0] : -1);
      if (q) say.textContent = n ? tx(d, '%s개 찾음', n) : empty.textContent;
      list.scrollTop = 0;
    }
    const visible = () => rows.map((row, i) => (row.on ? i : -1)).filter((i) => i >= 0);
    function setActive(i, scroll) {
      active = i;
      rows.forEach((row, k) => row.r.classList.toggle('is-active', k === i));
      if (i >= 0) input.setAttribute('aria-activedescendant', rows[i].r.id); else input.removeAttribute('aria-activedescendant');
      if (scroll && i >= 0) {
        const r = rows[i].r, top = r.offsetTop, bot = top + r.offsetHeight;
        if (top < list.scrollTop) list.scrollTop = top;
        else if (bot > list.scrollTop + list.clientHeight) list.scrollTop = bot - list.clientHeight;
      }
    }

    // 단추 글자: 모두 고르면 all, 하나도 안 고르면 '고른 항목 없음', 아니면 고른 이름을 options 순서대로 잇고 넘치면 '+남은 수'로 줄입니다.
    const picked = () => names.filter((v) => sel.has(v));
    function fitText() {
      const p = picked();
      if (!one && p.length === names.length) { txt.textContent = allLabel; return; }
      if (!p.length) { txt.textContent = tx(d, '고른 항목 없음'); return; }
      for (let k = p.length; k >= 1; k--) {
        txt.textContent = p.slice(0, k).join(', ') + (k < p.length ? ` +${p.length - k}` : '');
        if (val.scrollWidth <= val.clientWidth + 1 || k === 1) break;
      }
    }
    function valueText() {
      const p = picked();
      if (one) return p[0];
      if (p.length === names.length) return `${allLabel}, ${tx(d, '%1개 중 %2개 고름', names.length, p.length)}`;
      return `${p.length ? p.join(', ') : tx(d, '고른 항목 없음')}, ${tx(d, '%1개 중 %2개 고름', names.length, p.length)}`;
    }
    function paint() {
      rows.forEach((row) => row.r.setAttribute('aria-selected', String(sel.has(row.name))));
      root.classList.toggle('is-none', !sel.size);
      if (!one) {
        roll(cntNum, String(sel.size));
        tally.textContent = tx(d, '%1개 중 %2개 고름', names.length, sel.size);
        const vis = visible();
        allB.disabled = vis.every((i) => sel.has(rows[i].name));
        noneB.disabled = vis.every((i) => !sel.has(rows[i].name));
      }
      fitText();
      btn.setAttribute('aria-label', `${name}: ${valueText()}`);
    }
    function emit(quiet) {
      const value = one ? picked()[0] : picked();
      card.setAttribute('data-vzb-value', JSON.stringify(value));
      if (quiet) return;
      say.textContent = valueText();
      card.dispatchEvent(new CustomEvent('vzb-change', { bubbles: true, detail: { name: d.name || '', value } }));
    }

    // 열고 닫기: 아래에 목록이 들어갈 자리가 없고 위가 더 넓으면 위로 엽니다. 닫을 때 검색어를 지웁니다.
    let open = false, closeT = 0;
    const loop = !!card.closest('[data-vzb-loop]');
    function place() {
      const r = btn.getBoundingClientRect(), vh = window.innerHeight || document.documentElement.clientHeight;
      const below = vh - r.bottom - 8, above = r.top - 8;
      root.classList.toggle('is-up', below < pop.offsetHeight + 8 && above > below);
    }
    function setOpen(v, focus) {
      clearTimeout(closeT);
      if (open === v) return;
      open = v;
      if (v) {
        place();
        const first = names.findIndex((x) => sel.has(x));
        setActive(first >= 0 ? first : 0);
        list.scrollTop = 0;
        if (active >= 0) setActive(active, true);
      } else if (q) { q = ''; input.value = ''; filter(); }
      root.classList.toggle('is-open', v);
      btn.setAttribute('aria-expanded', String(v));
      if (v && focus) input.focus({ preventScroll: true });
    }
    function toggle(i) {
      if (i < 0) return;
      const nm = rows[i].name;
      if (one) {
        const changed = !sel.has(nm);
        sel.clear();
        sel.add(nm);
        paint();
        if (changed) emit();
        if (!loop) closeT = setTimeout(() => { const inside = root.contains(document.activeElement); setOpen(false); if (inside) btn.focus(); }, 180);
        return;
      }
      if (sel.has(nm)) sel.delete(nm); else sel.add(nm);
      paint();
      emit();
    }
    function bulk(on) {   // 모두 고르기 · 모두 풀기: 검색 중이면 맞는 항목에만 씁니다
      const before = sel.size;
      visible().forEach((i) => { if (on) sel.add(rows[i].name); else sel.delete(rows[i].name); });
      if (sel.size === before) return;
      paint();
      emit();
    }

    // 손으로 하는 조작
    let idle = 0;
    const touch = () => { idle = performance.now() + 6000; };
    root.addEventListener('pointerdown', touch);
    root.addEventListener('keydown', touch);
    btn.addEventListener('click', () => setOpen(!open, true));
    btn.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown') { e.preventDefault(); setOpen(true, true); } });
    input.addEventListener('input', () => { q = input.value.trim(); filter(); paint(); });
    input.addEventListener('keydown', (e) => {
      const vis = visible(), k = vis.indexOf(active);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!vis.length) return;
        const j = k < 0 ? 0 : Math.max(0, Math.min(vis.length - 1, k + (e.key === 'ArrowDown' ? 1 : -1)));
        setActive(vis[j], true);
      } else if (e.key === 'PageDown' || e.key === 'PageUp') {
        e.preventDefault();
        if (!vis.length) return;
        const j = Math.max(0, Math.min(vis.length - 1, (k < 0 ? 0 : k) + (e.key === 'PageDown' ? 5 : -5)));
        setActive(vis[j], true);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (active >= 0 && rows[active].on) toggle(active);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        if (q) { q = ''; input.value = ''; filter(); paint(); return; }
        setOpen(false);
        btn.focus();
      }
    });
    wipe.addEventListener('click', () => { q = ''; input.value = ''; filter(); paint(); input.focus(); });
    list.addEventListener('pointerdown', (e) => e.preventDefault());   // 누르는 동안 검색칸의 포커스를 지킵니다
    list.addEventListener('click', (e) => { const r = e.target.closest('.vzb-sm-opt'); if (r) toggle(rows.findIndex((x) => x.r === r)); });
    list.addEventListener('pointermove', (e) => { const r = e.target.closest('.vzb-sm-opt'); const i = r ? rows.findIndex((x) => x.r === r) : -1; if (i >= 0 && i !== active) setActive(i); });
    // 모두 고르기 · 모두 풀기를 누르면 그 단추가 쓸 수 없게 바뀌어 포커스를 잃으므로, 포커스를 검색칸으로 돌려 Esc · 화살표가 이어지게 합니다.
    allB.addEventListener('click', () => { bulk(true); input.focus({ preventScroll: true }); });
    noneB.addEventListener('click', () => { bulk(false); input.focus({ preventScroll: true }); });
    root.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape' || !open) return;
      e.preventDefault();
      setOpen(false);
      btn.focus();
    });
    root.addEventListener('focusout', (e) => { if (open && e.relatedTarget && !root.contains(e.relatedTarget)) setOpen(false); });
    document.addEventListener('pointerdown', function away(e) {
      if (!card.isConnected) { document.removeEventListener('pointerdown', away, true); return; }
      if (open && !root.contains(e.target)) setOpen(false);
    }, true);

    filter();
    paint();
    emit(true);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (card.isConnected) fitText(); });
    onSize(val, () => fitText());

    // 갤러리(data-vzb-loop): 화면에 보이는 동안, 손을 대기 전과 손을 뗀 지 6초 뒤부터 열기 → 검색어를 한 글자씩 치기 → 맞는 항목 둘을 고르기 →
    // 검색어 지우기 → 둘을 다시 풀기 → 닫기를 차례로 보여 줍니다(한 바퀴 돌면 처음 고른 것으로 돌아옵니다).
    // 검색어는 데이터에서 고릅니다: 한글 이름이면 첫 글자의 초성, 아니면 두 글자 가운데 맞는 항목이 넷에 가장 가까운 것.
    if (loop) {
      const cands = new Map();
      rows.forEach((row) => {
        const c0 = row.cho[0];
        if (isCho(c0)) cands.set(c0, 0);
        else for (let k = 0; k + 2 <= row.low.length; k++) if (!/\s/.test(row.low.slice(k, k + 2))) cands.set(row.low.slice(k, k + 2), 0);
      });
      let word = '', best = Infinity;
      cands.forEach((_, w) => { const n = rows.filter((row) => hit(row, w)).length; const s = Math.abs(n - 4) + (n < 2 ? 9 : 0); if (s < best) { best = s; word = w; } });
      const press = (node) => { if (!node) return; node.classList.add('is-press'); setTimeout(() => node.classList.remove('is-press'), 140); };
      const typeTo = (s) => { input.value = s; q = s; filter(); paint(); };
      let picks = [];
      const steps = [];
      [...word].forEach((_, k) => steps.push(() => typeTo(word.slice(0, k + 1))));
      steps.push(() => { picks = visible().filter((i) => !sel.has(rows[i].name)).slice(0, one ? 1 : 2); if (picks[0] != null) { setActive(picks[0], true); press(rows[picks[0]].r); toggle(picks[0]); } });
      if (!one) steps.push(() => { if (picks[1] != null) { setActive(picks[1], true); press(rows[picks[1]].r); toggle(picks[1]); } });
      steps.push(() => { press(wipe); typeTo(''); });
      if (!one) steps.push(() => { picks.forEach((i) => { if (sel.has(rows[i].name)) toggle(i); }); });
      steps.push(() => setOpen(false));
      const first = names.find((x) => sel.has(x));
      let k = 0;
      const timer = setInterval(() => {
        if (!card.isConnected) { clearInterval(timer); return; }
        if (!seen || performance.now() < idle) return;
        if (!open) {
          if (one && first && !sel.has(first)) { sel.clear(); sel.add(first); paint(); emit(true); }
          setOpen(true);
          k = 0;
          return;
        }
        steps[k++ % steps.length]();
      }, 1100);
      let seen = true;
      if ('IntersectionObserver' in window) new IntersectionObserver((es) => { seen = es[es.length - 1].isIntersecting; }).observe(card);
    }
  });
})();
</script>
