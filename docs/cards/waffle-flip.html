<style>
/* Vizney Blocks tokens: re-declare the same variables on your page's :root and they apply to every card.
   The colors come from Vizney's Figma palette: blue (#007aff), pink-red (#ff2d55) and orange (#ff9500) for data, green (#34c759) and red (#ff3b30)
   for good and bad, with lighter steps mixed from the same colors and the background. The text is Vizney black (#1b1b1b).
   With "theme": "dark" in the JSON, the .vzb-dark values below draw the card on Vizney black with yellow as the first color and white as the second.
   List: https://blocks.vizney.com/tokens.css */
:where(:root) {
  --vzb-font: 'Spoqa Han Sans Neo', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;   /* every word on the card */
  --vzb-card: #ffffff;   /* card background */
  --vzb-edge: rgba(17, 24, 39, 0.05);   /* card border */
  --vzb-ink: #1b1b1b;   /* title and headline figure */
  --vzb-ink-2: #4a4a4a;   /* body text, the no-change badge */
  --vzb-muted: #737373;   /* subtitle, units, axis ticks */
  --vzb-grid: #ebebeb;   /* grid lines and the line under the head: a solid gray one step off the background */
  --vzb-primary: #007aff;   /* first data color (blue): lines, bars, the largest item */
  --vzb-primary-tint: #e6f2ff;   /* light blue background: the shade under a line, the radar area */
  --vzb-primary-soft: #bfdeff;   /* bar-list bars that carry the name */
  --vzb-secondary: #ff2d55;   /* second data color (pink-red) */
  --vzb-tertiary: #ff9500;   /* third data color (orange) */
  --vzb-primary-mid: #8cc3ff;     /* one step lighter, for wide areas (treemap cells) */
  --vzb-secondary-mid: #ff7a93;   /* pink-red for wide areas */
  --vzb-tertiary-mid: #ffb54d;   /* orange for wide areas */
  --vzb-other-mid: #e3e3e3;   /* the Other group on wide areas */
  --vzb-line-3: #ff9500;   /* third line color (orange) */
  --vzb-base: #c4c4c4;   /* the baseline (last year's line, the radar baseline outline) */
  --vzb-track: #f1f1f1;   /* track behind the gauge and attainment bars */
  --vzb-other: #d9d9d9;   /* items folded into Other, items from the fourth on */
  --vzb-good: #34c759;   /* fill of a good change (increases in a waterfall, met targets). Palette green; 2.2:1 on white, so never for text */
  --vzb-good-tint: #ebf9ee;   /* background of a good-change badge (green 10%) */
  --vzb-good-ink: #2a8040;   /* text of a good change (badges): green with 41% black, 4.9:1 on white */
  --vzb-bad: #ff3b30;   /* fill of a bad change or of the part over a limit. Palette red, 3.6:1 on white */
  --vzb-bad-tint: #ffebea;   /* background of a bad-change badge (red 10%) */
  --vzb-bad-ink: #cb342b;   /* text of a bad change and of errors: red with 23% black, 5.2:1 on white */
  --vzb-tip: #1b1b1b;   /* tooltip background */
  --vzb-radius: 18px;   /* card corners */
  --vzb-unit: 168px;   /* 1 height unit; a chart card is 1, 1.5 or 2 units tall */
  --vzb-shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 18px 40px -22px rgba(17, 24, 39, 0.22);   /* card shadow */
}

/* Dark ("theme": "dark"): the same variables, changed inside the card only. One yellow plus white and gray draws in Vizney black, white and yellow.
   Yellow, white and gray pass a color vision simulation (closest pair ΔE 14.9) and a contrast check against the card.
   Good and bad are the same green (#34c759) and red (#ff3b30) as on white, and on black they serve as text too (7.8:1 and 4.9:1). */
.vzb-dark {
  --vzb-card: #1b1b1b;   /* card background (Vizney black) */
  --vzb-edge: rgba(255, 255, 255, 0.08);   /* card border */
  --vzb-ink: #f5f5f5;   /* title and headline figure */
  --vzb-ink-2: #cfcfcf;   /* body text */
  --vzb-muted: #9b9b9b;   /* subtitle, units, axis ticks */
  --vzb-grid: #2f2f2f;   /* grid lines and the rule under the head */
  --vzb-primary: #ffcc00;   /* first data color (Vizney yellow) */
  --vzb-primary-tint: #362f18;   /* dim yellow background */
  --vzb-primary-soft: #5f5013;   /* bar-list bars that carry the name */
  --vzb-secondary: #f5f5f5;   /* second data color (white) */
  --vzb-tertiary: #9b9b9b;   /* third data color (gray) */
  --vzb-primary-mid: #826b0f;   /* wide areas, one step darker so light text sits on them */
  --vzb-secondary-mid: #5c5c5c;   /* white for wide areas, gray so white text reads on it */
  --vzb-tertiary-mid: #424242;   /* gray for wide areas */
  --vzb-other-mid: #3a3a3a;   /* the Other group for wide areas */
  --vzb-line-3: #9b9b9b;   /* third line color (gray) */
  --vzb-base: #6b6b6b;   /* comparison baseline */
  --vzb-track: #2c2c2c;   /* gauge and attainment-bar track */
  --vzb-other: #4d4d4d;   /* items folded into Other */
  --vzb-good: #34c759;   /* good change (palette green) */
  --vzb-good-tint: #1f3725;   /* good badge background (green 16%) */
  --vzb-good-ink: #34c759;   /* text of a good change */
  --vzb-bad: #ff3b30;   /* bad change, over the limit (palette red) */
  --vzb-bad-tint: #2d1e1d;   /* bad badge background (red 8%, as much as keeps 4.5:1 for the text) */
  --vzb-bad-ink: #ff3b30;   /* text of a bad change and of errors */
  --vzb-tip: #3a3a3a;   /* tooltip background */
  --vzb-shadow: none;   /* card shadow */
}
/* 카드: 놓인 자리의 폭을 채우고, 높이는 1 · 1.5 · 2단위 가운데 하나입니다(단위 --vzb-unit, 카드마다 자기 CSS에서 정합니다). */
.vzb-card {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: calc(var(--vzb-unit) * 1.5);
  padding: 24px;
  background: var(--vzb-card);
  color: var(--vzb-ink);
  border: 1px solid var(--vzb-edge);
  border-radius: var(--vzb-radius);
  box-shadow: var(--vzb-shadow);
  font: 400 13px/18px var(--vzb-font);
  text-align: left;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
.vzb-card *, .vzb-card *::before, .vzb-card *::after { box-sizing: border-box; }

/* 머리: 제목과 기간 부제, 그 아래 대표 수치와 바로 뒤의 증감 배지.
   배지와 비교 문구는 숫자와 같은 줄의 항목이라, 좁으면 비교 문구만 아래 줄로 내려가고 배지는 숫자 뒤에 남습니다. */
.vzb-title { font-size: 17px; line-height: 24px; font-weight: 500; }
.vzb-sub { margin-top: 2px; color: var(--vzb-muted); }
.vzb-fig { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; margin-top: 20px; }   /* 숫자 줄은 기준선 아래에 16px이 남아 줄 사이를 따로 두지 않습니다 */
.vzb-num { margin-right: 4px; font-size: 34px; line-height: 40px; font-weight: 400; letter-spacing: -0.02em; white-space: nowrap; }   /* 숫자와 배지 사이 12px, 배지와 비교 문구 사이 8px */
.vzb-unit { margin-left: 4px; font-size: 16px; letter-spacing: 0; color: var(--vzb-muted); }
.vzb-delta { display: contents; color: var(--vzb-muted); white-space: nowrap; }
.vzb-vs { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.vzb-badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px 3px 6px; border-radius: 7px; font-weight: 500; }
.vzb-badge.vzb-good { color: var(--vzb-good-ink); background: var(--vzb-good-tint); }
.vzb-badge.vzb-bad { color: var(--vzb-bad-ink); background: var(--vzb-bad-tint); }
.vzb-badge.vzb-flat { color: var(--vzb-ink-2); background: var(--vzb-track); padding-left: 8px; }
.vzb-arrow { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.vzb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* 그래픽은 카드 아래쪽에 붙습니다. 같은 줄의 카드 높이가 맞춰져도 그래픽끼리 바닥이 맞습니다. */
.vzb-foot { margin-top: auto; padding-top: 20px; }
.vzb-error { margin: 8px 0 0; color: var(--vzb-bad-ink); }
/* 그래프 영역: 마우스를 올리거나, 포커스한 뒤 좌우 화살표로 값을 봅니다. */
.vzb-plot { position: relative; border-radius: 4px; outline: none; touch-action: pan-y; }
.vzb-plot:focus-visible { outline: 2px solid var(--vzb-primary); outline-offset: 4px; }
/* 남은 높이를 채우는 차트: 그래프 영역이 늘어나고 그림은 그 크기에 맞춰 다시 그립니다. */
.vzb-fill { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
.vzb-fill > .vzb-plot { flex: 1 1 auto; min-height: 72px; }
.vzb-fill > .vzb-plot > svg { position: absolute; left: 0; top: 0; }
.vzb-tip {
  position: fixed;
  z-index: 1000;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  padding: 7px 10px;
  border-radius: 8px;
  background: var(--vzb-tip);
  color: #ffffff;
  box-shadow: 0 10px 24px -8px rgba(27, 27, 27, 0.4);
  font: 400 12px/17px var(--vzb-font);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.12s;
}
.vzb-tip.is-on { opacity: 1; }
.vzb-tip-label { color: rgba(255, 255, 255, 0.72); }
.vzb-tip-value { font-size: 13px; font-weight: 700; }
/* 색 이름: t1 · t2 · t3 선(파랑 · 분홍빨강 · 주황, 어두운 바탕은 노랑 · 흰색 · 회색), f1 · f2 · f3 막대와 면(같은 순서), fs 옅은 첫째 색,
   t0 · f0 비교 회색, tx · fx 그 밖의 회색, fg · fb 좋음 · 나쁨, ti 목표 · 기준 표시 */
.vzb-t1, .vzb-f1 { --vzb-c: var(--vzb-primary); }
.vzb-t2, .vzb-f2 { --vzb-c: var(--vzb-secondary); }
.vzb-t3 { --vzb-c: var(--vzb-line-3); }
.vzb-f3 { --vzb-c: var(--vzb-tertiary); }
.vzb-t0, .vzb-f0 { --vzb-c: var(--vzb-base); }
.vzb-tx, .vzb-fx { --vzb-c: var(--vzb-other); }
.vzb-fg { --vzb-c: var(--vzb-good); }
.vzb-fb { --vzb-c: var(--vzb-bad); }
.vzb-ti { --vzb-c: var(--vzb-ink); }
.vzb-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 10px 0 0; padding: 0; list-style: none; color: var(--vzb-ink-2); }
.vzb-legend li { display: inline-flex; align-items: center; gap: 6px; }
.vzb-key, .vzb-tip-key { display: inline-block; flex: none; width: 12px; height: 3px; border-radius: 2px; background: var(--vzb-c); }
.vzb-key.is-box { width: 10px; height: 10px; border-radius: 3px; }
.vzb-key.is-dot { width: 9px; height: 9px; border-radius: 50%; }
.vzb-key.is-dim { opacity: 0.4; }
.vzb-tip-body { display: flex; flex-direction: column; }
.vzb-tip-rows { display: grid; grid-template-columns: auto auto auto; justify-content: start; align-items: center; column-gap: 8px; row-gap: 1px; margin-top: 3px; }
.vzb-tip-row { display: contents; }
.vzb-tip-row b { font-size: 13px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.vzb-tip-row span { color: rgba(255, 255, 255, 0.72); }
.vzb-tip-note { margin-top: 3px; color: rgba(255, 255, 255, 0.72); }
.vzb-tip-note + .vzb-tip-note { margin-top: 0; }
/* 툴팁의 증감: 툴팁 바탕이 어두우므로 좋음 · 나쁨 색을 흰색에 조금 섞어 밝게 씁니다(어두운 바탕 툴팁에서도 대비 4.5:1 이상). */
.vzb-tip .is-good { color: color-mix(in srgb, var(--vzb-good) 82%, #fff); font-weight: 700; }
.vzb-tip .is-bad { color: color-mix(in srgb, var(--vzb-bad) 68%, #fff); font-weight: 700; }
.vzb-fs { --vzb-c: var(--vzb-primary-soft); }
.vzb-key.is-tick { width: 2px; height: 12px; border-radius: 1px; }
/* Waffle Flip: 높이 2단위. 머리 아래 짚을 항목의 비중을 큰 숫자로 적고, 그 바로 아래에 와플 100칸(5줄 × 20칸)과 범례를 둡니다(넓으면 범례는 칸 오른쪽).
   칸은 카드 높이와 폭 안에서 될 수 있는 만큼 키웁니다(한 변 30px까지, 틈 3px, 좁으면 2px) 모서리 2px이고, 짚을 항목은 첫째 데이터 색, 나머지는 글자색을 50 · 30 · 16% 깐 회색 단계입니다.
   괄호는 바뀐 칸이 든 세로줄들 아래에 글자색보다 옅은 1.25px 선으로 긋고, 바뀐 %p를 굵게 적습니다.
   칸이 뒤집히는 움직임은 스크립트가 그리고, 배지는 흐려졌다 또렷해지며 나옵니다.
   두 기간을 주면 머리 오른쪽 위에 기간 단추를 둡니다: 옅은 바탕 위에서 고른 기간만 글자색 알약(글자는 카드 바탕색)이 미끄러져 옮겨 갑니다. */
.vzb-card[data-vzb="waffle-flip"] { min-height: calc(var(--vzb-unit) * 2); }
.vzb-wf-fig > [hidden] { display: none; }
.vzb-wf-none { margin: auto 0; color: var(--vzb-muted); text-align: center; }
.vzb-wf-fig .vzb-num { font-variant-numeric: tabular-nums; }
.vzb-wf.vzb-foot { margin-top: 0; padding-top: 16px; }   /* 칸은 큰 숫자 바로 아래. 폭이 좁아 칸이 높이를 다 못 채우면 남는 자리는 카드 아래로 갑니다 */
.vzb-wf-svg { display: block; overflow: visible; font-family: var(--vzb-font); }
.vzb-wf-cell { transition: opacity 0.12s; }
.vzb-wf-c0 { fill: var(--vzb-primary); }
.vzb-wf-c1, .vzb-wf-c2, .vzb-wf-c3 { fill: var(--vzb-ink); }
.vzb-wf-c1 { fill-opacity: 0.5; }
.vzb-wf-c2 { fill-opacity: 0.3; }
.vzb-wf-c3 { fill-opacity: 0.16; }
.vzb-wf-svg.is-hover .vzb-wf-cell:not(.is-on) { opacity: 0.25; }
.vzb-wf-br { fill: none; stroke: var(--vzb-ink-2); stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
.vzb-wf-brt { font-size: 11px; font-weight: 700; fill: var(--vzb-ink); font-variant-numeric: tabular-nums; }
.vzb-wf-ctl { margin-top: 8px; }
.vzb-wf.is-side { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 28px; align-items: start; }   /* 넓은 카드: 범례를 칸 오른쪽에 세로로 */
.vzb-wf.is-side .vzb-wf-ctl { margin-top: 0; }
.vzb-wf.is-side .vzb-wf-legend { flex-direction: column; align-items: flex-start; gap: 6px; }   /* 항목은 글자 폭만큼(칸 크기를 잴 때 범례 폭으로 씁니다) */
.vzb-card[data-vzb="waffle-flip"] .vzb-hd { position: relative; }
.vzb-wf-per { position: absolute; top: -4px; right: 0; display: inline-flex; padding: 2px; border-radius: 16px; background: var(--vzb-track); }   /* 제목 오른쪽 자리는 스크립트가 단추 폭만큼 비웁니다 */
.vzb-wf-pill { position: absolute; top: 2px; bottom: 2px; left: 0; width: 0; border-radius: 14px; background: var(--vzb-ink); pointer-events: none; }
.vzb-wf-per.is-ready .vzb-wf-pill { transition: transform 0.38s cubic-bezier(0.3, 1.4, 0.5, 1), width 0.38s cubic-bezier(0.3, 1.4, 0.5, 1); }
.vzb-wf-opt { position: relative; height: 28px; padding: 0 12px; border: 0; border-radius: 14px; background: none; color: var(--vzb-ink-2); font: 500 13px/28px var(--vzb-font); font-variant-numeric: tabular-nums; white-space: nowrap; cursor: pointer; transition: color 0.2s; }
.vzb-wf-opt:hover { color: var(--vzb-ink); }
.vzb-wf-opt.is-on { color: var(--vzb-card); }
.vzb-wf-opt:focus-visible { outline: 2px solid var(--vzb-primary); outline-offset: 2px; }
.vzb-wf-legend { display: flex; flex-wrap: wrap; gap: 2px 14px; min-width: 0; margin: 0; padding: 0; list-style: none; font-size: 12px; line-height: 16px; color: var(--vzb-ink-2); }
.vzb-wf-legend li { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: opacity 0.12s; }
.vzb-wf-legend.is-hover li:not(.is-on) { opacity: 0.4; }
.vzb-wf-legend b { font-weight: 700; color: var(--vzb-ink); font-variant-numeric: tabular-nums; }
.vzb-wf-key { flex: none; width: 10px; height: 10px; border-radius: 2px; }
.vzb-wf-key.vzb-wf-c0 { background: var(--vzb-primary); }
.vzb-wf-key.vzb-wf-c1, .vzb-wf-key.vzb-wf-c2, .vzb-wf-key.vzb-wf-c3 { background: var(--vzb-ink); }
.vzb-wf-key.vzb-wf-c1 { opacity: 0.5; }
.vzb-wf-key.vzb-wf-c2 { opacity: 0.3; }
.vzb-wf-key.vzb-wf-c3 { opacity: 0.16; }
.vzb-wf-in { animation: vzb-wf-in 0.32s ease-out; }
@keyframes vzb-wf-in { from { opacity: 0; filter: blur(3px); } to { opacity: 1; filter: none; } }
</style>
<div class="vzb-card" data-vzb="waffle-flip">
<script type="application/json">
{
  "title": "Market Share",
  "subtitle": "By units sold, 2025 → 2026",
  "lang": "en",
  "format": "count",
  "unit": "units",
  "periods": ["2025", "2026"],
  "focus": "Our brand",
  "items": [
    {
      "name": "Our brand",
      "values": [41400, 62400]
    },
    {
      "name": "Brand A",
      "values": [80500, 80600]

        braceText.setAttribute('text-anchor', right ? 'start' : 'end');
        braceText.setAttribute('x', fx(right ? x2 + 6 : x1 - 6));
        braceText.setAttribute('y', fx(y + 4));
      }
      placePill();
      render();
    }
    // 기간 단추의 알약: 처음 자리는 움직이지 않고 놓은 뒤부터 미끄러집니다(is-ready).
    let pillAt = -1;
    function placePill() {
      if (!per || pillAt < 0) return;
      const b = opts[pillAt];
      pill.style.width = `${b.offsetWidth}px`;
      pill.style.transform = `translateX(${b.offsetLeft}px)`;
      if (!per.classList.contains('is-ready') && b.offsetWidth) requestAnimationFrame(() => per.classList.add('is-ready'));
    }
    function setPill(p) {
      if (!per || p === pillAt) return;
      pillAt = p;
      opts.forEach((b, q) => { b.setAttribute('aria-checked', String(q === p)); b.tabIndex = q === p ? 0 : -1; b.classList.toggle('is-on', q === p); });
      placePill();
    }
    function render() {
      if (!W) return;
      const moving = from !== to, src = cats[from], dst = cats[to], rev = to < from, cnt = items.map(() => 0);
      cells.forEach((r, i) => {
        const j0 = order.get(i);
        let cat = dst[i], sx = 1;
        if (moving && j0 != null) {
          // 앞으로 갈 때는 번호 순서, 되돌아갈 때는 거꾸로(마지막에 뒤집힌 칸부터) 뒤집습니다.
          const k = clamp((t - lead - (rev ? K - 1 - j0 : j0) * STAG) / FLIP);
          cat = k >= 0.4 ? dst[i] : src[i];
          sx = k <= 0 || k >= 1 ? 1 : k < 0.4 ? 1 - easeIn(k / 0.4) : Math.max(0.02, spring((k - 0.4) / 0.6));
        }
        cnt[cat]++;
        if (r.cat !== cat) { r.classList.replace(`vzb-wf-c${r.cat}`, `vzb-wf-c${cat}`); r.cat = cat; }
        const cx = Math.floor(i / ROWS) * pitch + cell / 2;
        r.setAttribute('transform', sx === 1 ? '' : `matrix(${sx.toFixed(3)} 0 0 1 ${fx(cx * (1 - sx))} 0)`);
      });
      // 큰 숫자와 범례는 지금 보이는 칸 수 그대로입니다.
      nowText.nodeValue = num(cnt[0], 0);
      items.forEach((it) => { const v = pctText(cnt[it.k], 0); if (it.val.textContent !== v) it.val.textContent = v; });
      setPill(shownP());
      const end = endOf(), done = !moving || t >= end, atLast = P > 1 && to === last;
      const kb = atLast && diff ? (moving ? clamp((t - end) / OUT) : 1) : 0;
      brace.setAttribute('stroke-dashoffset', fx((brace.len || 0) * (1 - kb)));
      brace.style.opacity = kb > 0 ? 1 : 0;
      braceText.style.opacity = atLast && diff ? (moving ? fx(clamp((t - end - OUT * 0.5) / (OUT * 0.5))) : 1) : 0;
      if (bd) { const show = atLast && done; bd.hidden = !show; vs.hidden = !show; }
    }

    // 재생: 화면에 보이고(inView) 마우스 · 포커스로 잠시 멈추지 않았을 때(holds)만 움직입니다. 카드가 페이지에서 빠지면 멈춥니다.
    const live = card.hasAttribute('data-vzb-live');   // 데이터가 바뀌어 다시 그린 카드: 처음부터 재생하지 않습니다
    const loop = !!card.closest('[data-vzb-loop]');
    const holds = new Set();
    let playing = false, seen = false, inView = false, rest = 0, lastStamp = 0, raf = 0, took = false;
    const on = () => playing && inView && !holds.size && card.isConnected;
    function tick(stamp) {
      raf = 0;
      if (!on()) { lastStamp = 0; return; }
      const dt = lastStamp ? Math.min(100, stamp - lastStamp) : 16;
      lastStamp = stamp;
      if (rest > 0) { rest -= dt; if (rest <= 0) go(to === last ? 0 : last, 0); }   // 갤러리: 잠시 쉬고 다른 기간으로
      else {
        t = Math.min(total(), t + dt);
        if (t >= total()) { from = to; t = 0; if (loop && !took) rest = 2600; else playing = false; }
      }
      render();
      if (on()) raf = requestAnimationFrame(tick);
    }
    function kick() { if (!raf && on()) raf = requestAnimationFrame(tick); }
    // 기간 p로 갑니다. 다른 기간으로 가는 중에 되돌리면, 이미 뒤집힌 칸부터 거꾸로 되짚습니다.
    function go(p, wait) {
      if (from !== to && p === from) {
        const span = endOf() - lead, s = Math.max(0, Math.min(span, t - lead));
        from = to; to = p; lead = 0; t = span - s;
      } else if (p !== to) { from = to; to = p; lead = wait; t = 0; }
      else return;
      playing = true;
      lastStamp = 0;
      render();
      kick();
    }
    // 단추로 고른 기간: 갤러리의 오가기를 멈추고, 다시 그려도 이어 가도록 카드에 적어 두고, 화면 낭독기에 알립니다.
    function pick(p) {
      took = true;
      rest = 0;
      card.setAttribute('data-vzb-period', periods[p]);
      if (p === to) return;
      go(p, 0);
      say.textContent = `${periods[p]}: ${focus.name} ${pctText(focus.cells[p], 0)}${p === last && diff ? ` (${ppText(diff, 0)} ${tx(d, '%s 대비', periods[0])})` : ''}`;
    }
    plot.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') { holds.add('hover'); render(); } });
    plot.addEventListener('pointerleave', () => { holds.delete('hover'); kick(); });
    plot.addEventListener('focus', () => { if (plot.matches(':focus-visible')) { holds.add('focus'); render(); } });   // 키보드로 들어왔을 때만 멈춥니다
    plot.addEventListener('blur', () => { holds.delete('focus'); kick(); });
    // 툴팁: 칸을 짚으면 그 항목의 칸만 진하게 남기고 비중(소수 한 자리) · 원래 값 · 앞 기간 대비 %p를 보여 줍니다.
    interact(plot, items.length,
      (cx, cy) => {
        const r = svg.getBoundingClientRect(), col = Math.floor((cx - r.left) / pitch), row = Math.floor((cy - r.top) / pitch);
        if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return -1;
        return cells[col * ROWS + row].cat;
      },
      (k) => {
        const it = items[k], r = svg.getBoundingClientRect();
        svg.classList.add('is-hover');
        legend.classList.add('is-hover');
        items.forEach((x) => x.li.classList.toggle('is-on', x === it));
        const mine = cells.map((c, i) => [c, i]).filter(([c]) => c.cat === k);
        mine.forEach(([c]) => c.classList.add('is-on'));
        cells.forEach((c) => { if (c.cat !== k) c.classList.remove('is-on'); });
        // 툴팁은 짚은 칸 묶음의 옆(묶음이 왼쪽 절반이면 오른쪽, 아니면 왼쪽)에 띄웁니다. 칸 위에 띄우면 머리의 대표 수치를 덮어 같은 숫자가 겹쳐 보이기 때문입니다.
        const cols = mine.map(([, i]) => Math.floor(i / ROWS)), c0 = cols.length ? Math.min(...cols) : 0, c1 = cols.length ? Math.max(...cols) + 1 : 0, leftHalf = (c0 + c1) / 2 < COLS / 2;
        const p = shownP(), note = [P > 1 ? `${periods[p]} · ${show(f, it.vals[p])}` : show(f, it.vals[p])];
        const want = d.better === 'down' ? -1 : d.better === 'neutral' ? 0 : 1, dv = it.share[last] - it.share[0];
        if (P > 1 && p === last) note.push({ text: `${ppText(dv, 1)} ${tx(d, '%s 대비', periods[0])}`, tone: want === 0 || Math.abs(dv) < 1e-9 ? null : Math.sign(dv) === want ? 'good' : 'bad' });
        const tb = tipBody({ value: pctText(it.share[p], 1), note }, it.name);
        return { x: r.left + (leftHalf ? c1 * pitch : c0 * pitch), y: r.top + (ROWS * pitch) / 2, side: leftHalf ? 'right' : 'left', label: it.name, value: tb.node, text: tb.text };
      },
      () => { svg.classList.remove('is-hover'); legend.classList.remove('is-hover'); items.forEach((x) => x.li.classList.remove('is-on')); cells.forEach((c) => c.classList.remove('is-on')); },
      false, true);

    // 처음 장면: 재생할 카드는 앞 기간에 멈춰 기다리고, 아니면(다시 그림 · 한 기간) 고른 기간 또는 뒤 기간입니다.
    const auto = !live && P > 1;
    if (auto) from = to = 0;
    onSize(foot, layout);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (W) layout(foot.clientWidth); });
    // 화면에 처음 보일 때 움직입니다. 화면 밖에 있는 동안은 멈춰 둡니다.
    const start = () => { if (!seen) { seen = true; if (auto && !took) go(last, T0); } };
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((es) => {
        if (!card.isConnected) { io.disconnect(); return; }
        inView = es[es.length - 1].isIntersecting;
        if (inView) start();
        kick();
      }, { threshold: 0.3 });
      io.observe(card);
    } else { inView = true; start(); }
  });
})();
