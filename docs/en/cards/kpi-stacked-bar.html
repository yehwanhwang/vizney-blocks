/* Vizney Blocks tokens: re-declare the same variables on your page's :root and they apply to every card.
   The colors are the Vizney chart guide's orange, pink-red and yellow with a lighter step of each; the text is Vizney black (#1b1b1b).
   List: https://blocks.vizney.com/en/tokens.css */
:where(:root) {
  --vzb-font: 'Spoqa Han Sans Neo', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;   /* every word on the card */
  --vzb-card: #ffffff;   /* card background */
  --vzb-edge: rgba(17, 24, 39, 0.05);   /* card border */
  --vzb-ink: #1b1b1b;   /* title and headline figure */
  --vzb-ink-2: #4a4a4a;   /* body text, the no-change badge */
  --vzb-muted: #737373;   /* subtitle, units, axis ticks */
  --vzb-grid: #ebebeb;   /* grid lines and the line under the head: a solid gray one step off the background */
  --vzb-primary: #ff9500;   /* first data color (orange): lines, bars, the largest item */
  --vzb-primary-tint: #fff1de;   /* light orange background: the shade under a line, the radar area */
  --vzb-primary-soft: #ffd9a6;   /* bar-list bars that carry the name */
  --vzb-secondary: #ff2d55;   /* second data color (pink-red) */
  --vzb-tertiary: #ffcc00;   /* third data color (yellow); not used for thin lines */
  --vzb-primary-mid: #ffb54d;     /* one step lighter, for wide areas (treemap cells) */
  --vzb-secondary-mid: #ff7a93;   /* pink-red for wide areas */
  --vzb-tertiary-mid: #ffdc4d;   /* yellow for wide areas */
  --vzb-other-mid: #e3e3e3;   /* the Other group on wide areas */
  --vzb-line-3: #007aff;   /* third line color: yellow is hard to see as a thin line on white, so blue */
  --vzb-base: #c4c4c4;   /* the baseline (last year's line, the radar baseline outline) */
  --vzb-track: #f1f1f1;   /* track behind the gauge and attainment bars */
  --vzb-other: #d9d9d9;   /* items folded into Other, items from the fourth on */
  --vzb-good: #12814a;   /* a good change (badges, increases in a waterfall) */
  --vzb-good-tint: #e5f5ec;   /* background of a good-change badge */
  --vzb-bad: #d42346;   /* a bad change, over the limit, error text */
  --vzb-bad-tint: #fdebef;   /* background of a bad-change badge */
  --vzb-tip: #1b1b1b;   /* tooltip background */
  --vzb-radius: 18px;   /* card corners */
  --vzb-unit: 168px;   /* height unit 1 (KPI - Number); Line and Bar are 2, the other KPI cards 1.5, chart cards 2 */
  --vzb-shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 18px 40px -22px rgba(17, 24, 39, 0.22);   /* card shadow */
}
/* 카드: 놓인 자리의 폭을 채우고, 높이는 세 단계입니다(Number 1 · Line, Bar 2 · 나머지 1.5, 단위 --vzb-unit). */
.vzb-card {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: calc(var(--vzb-unit) * 1.5);
  padding: 24px;
  background: var(--vzb-card);
  color: var(--vzb-ink);
  border: 1px solid var(--vzb-edge);
  border-radius: var(--vzb-radius);
  box-shadow: var(--vzb-shadow);
  font: 400 13px/18px var(--vzb-font);
  text-align: left;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
.vzb-card *, .vzb-card *::before, .vzb-card *::after { box-sizing: border-box; }

/* 머리: 제목과 기간 부제, 그 아래 대표 수치와 바로 뒤의 증감 배지 */
.vzb-title { font-size: 17px; line-height: 24px; font-weight: 500; }
.vzb-sub { margin-top: 2px; color: var(--vzb-muted); }
.vzb-fig { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-top: 20px; }
.vzb-num { font-size: 34px; line-height: 40px; font-weight: 400; letter-spacing: -0.02em; white-space: nowrap; }
.vzb-unit { margin-left: 4px; font-size: 16px; letter-spacing: 0; color: var(--vzb-muted); }
.vzb-delta { display: inline-flex; align-items: center; gap: 8px; color: var(--vzb-muted); white-space: nowrap; }
.vzb-badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px 3px 6px; border-radius: 7px; font-weight: 500; }
.vzb-badge.vzb-good { color: var(--vzb-good); background: var(--vzb-good-tint); }
.vzb-badge.vzb-bad { color: var(--vzb-bad); background: var(--vzb-bad-tint); }
.vzb-badge.vzb-flat { color: var(--vzb-ink-2); background: var(--vzb-track); padding-left: 8px; }
.vzb-arrow { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.vzb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* 그래픽은 카드 아래쪽에 붙습니다. 같은 줄의 카드 높이가 맞춰져도 그래픽끼리 바닥이 맞습니다. */
.vzb-foot { margin-top: auto; padding-top: 20px; }
.vzb-error { margin: 8px 0 0; color: var(--vzb-bad); }
/* 그래프 영역: 마우스를 올리거나, 포커스한 뒤 좌우 화살표로 값을 봅니다. */
.vzb-plot { position: relative; border-radius: 4px; outline: none; touch-action: pan-y; }
.vzb-plot:focus-visible { outline: 2px solid var(--vzb-primary); outline-offset: 4px; }
/* 남은 높이를 채우는 차트: 그래프 영역이 늘어나고 그림은 그 크기에 맞춰 다시 그립니다. */
.vzb-fill { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
.vzb-fill > .vzb-plot { flex: 1 1 auto; min-height: 72px; }
.vzb-fill > .vzb-plot > svg { position: absolute; left: 0; top: 0; }
.vzb-tip {
  position: fixed;
  z-index: 1000;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  padding: 7px 10px;
  border-radius: 8px;
  background: var(--vzb-tip);
  color: #ffffff;
  box-shadow: 0 10px 24px -8px rgba(27, 27, 27, 0.4);
  font: 400 12px/17px var(--vzb-font);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.12s;
}
.vzb-tip.is-on { opacity: 1; }
.vzb-tip-label { color: rgba(255, 255, 255, 0.72); }
.vzb-tip-value { font-size: 13px; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .vzb-tip { transition: none; } }
/* 색 이름: t1 · t2 · t3 선(주황 · 분홍빨강 · 파랑), f1 · f2 · f3 막대와 면(주황 · 분홍빨강 · 노랑), fs 옅은 주황,
   t0 · f0 비교 회색, tx · fx 그 밖의 회색, fg · fb 좋음 · 나쁨, ti 목표 · 기준 표시 */
.vzb-t1, .vzb-f1 { --vzb-c: var(--vzb-primary); }
.vzb-t2, .vzb-f2 { --vzb-c: var(--vzb-secondary); }
.vzb-t3 { --vzb-c: var(--vzb-line-3); }
.vzb-f3 { --vzb-c: var(--vzb-tertiary); }
.vzb-t0, .vzb-f0 { --vzb-c: var(--vzb-base); }
.vzb-tx, .vzb-fx { --vzb-c: var(--vzb-other); }
.vzb-fg { --vzb-c: var(--vzb-good); }
.vzb-fb { --vzb-c: var(--vzb-bad); }
.vzb-ti { --vzb-c: var(--vzb-ink); }
.vzb-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 10px 0 0; padding: 0; list-style: none; color: var(--vzb-ink-2); }
.vzb-legend li { display: inline-flex; align-items: center; gap: 6px; }
.vzb-key, .vzb-tip-key { display: inline-block; flex: none; width: 12px; height: 3px; border-radius: 2px; background: var(--vzb-c); }
.vzb-key.is-box { width: 10px; height: 10px; border-radius: 3px; }
.vzb-key.is-dot { width: 9px; height: 9px; border-radius: 50%; }
.vzb-key.is-dim { opacity: 0.4; }
.vzb-tip-body { display: flex; flex-direction: column; }
.vzb-tip-rows { display: grid; grid-template-columns: auto auto auto; justify-content: start; align-items: center; column-gap: 8px; row-gap: 1px; margin-top: 3px; }
.vzb-tip-row { display: contents; }
.vzb-tip-row b { font-size: 13px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.vzb-tip-row span { color: rgba(255, 255, 255, 0.72); }
.vzb-tip-note { margin-top: 3px; color: rgba(255, 255, 255, 0.72); }
.vzb-tip-note + .vzb-tip-note { margin-top: 0; }
.vzb-fs { --vzb-c: var(--vzb-primary-soft); }
.vzb-key.is-tick { width: 2px; height: 12px; border-radius: 1px; }
/* KPI - Stacked Bar: 4px 간격의 둥근 조각, 큰 순서로 주황 · 분홍빨강 · 노랑, 기타는 회색. 범례는 2×2에 이름과 비중만 */
.vzb-sp-bar { display: flex; gap: 4px; height: 10px; }
.vzb-sp-seg { display: block; flex: 0 1 0; min-width: 4px; border-radius: 5px; transition: opacity 0.15s; }
.vzb-sp-c1 { background: var(--vzb-primary); }
.vzb-sp-c2 { background: var(--vzb-secondary); }
.vzb-sp-c3 { background: var(--vzb-tertiary); }
.vzb-sp-co { background: var(--vzb-other); }
.vzb-sp-legend { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px; }
.vzb-sp-legend li { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; column-gap: 8px; cursor: default; transition: opacity 0.15s; }
.vzb-sp-key { width: 8px; height: 8px; border-radius: 50%; }
.vzb-sp-legend b { font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.vzb-dim { opacity: 0.35; }
@media (prefers-reduced-motion: reduce) { .vzb-sp-seg, .vzb-sp-legend li { transition: none; } }
</style>

    'labels와 values(또는 series)를 확인하세요.': 'Check labels and values (or series).', 'tabs를 확인하세요.': 'Check tabs.', 'reference.value에 숫자나 "avg"를 적으세요.': 'Set reference.value to a number or "avg".',
  };
  // tx(d 또는 f, 원문, 값…): d.lang(format()이 f에 옮겨 둡니다)이 en이면 영어 문구를, 아니면 원문을 돌려줍니다.
  function tx(x, s, ...a) {
    let i = 0;
    const out = x && x.lang === 'en' && EN[s] !== undefined ? EN[s] : s.split('|')[0];
    return out.replace(/%(\d|s)/g, (m, k) => String(a[k === 's' ? i++ : k - 1]));
  }
  // 숫자 뒤의 단위: 영어 단위(days · orders)는 한 칸 띄우고, 기호와 한 글자 단위(% · K · 억)는 붙입니다.
  const withUnit = (n, u) => (/^[A-Za-z]{2}/.test(u) ? `${n} ${u}` : n + u);
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function svgEl(tag, attrs) {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  const nfs = {};
  function num(v, d) {
    nfs[d] = nfs[d] || new Intl.NumberFormat('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d });
    return nfs[d].format(v);
  }
  function krw(v) {
    const a = Math.abs(v);
    if (a >= 1e12) return [num(v / 1e12, 1), '조'];
    if (a >= 1e8) return [num(v / 1e8, a >= 1e10 ? 0 : 1), '억'];
    if (a >= 1e4) return [num(v / 1e4, 0), '만'];
    return [num(v, 0), '원'];
  }
  // 달러 금액: 원래 값을 받아 K · M · B로 줄이고 소수 한 자리로 맞춥니다($745.6K). 접미사는 단위처럼 작게 씁니다.
  function usd(v, d) {
    const a = Math.abs(v), s = v < 0 ? '−' : '';
    const [div, u] = a >= 1e9 ? [1e9, 'B'] : a >= 1e6 ? [1e6, 'M'] : a >= 1e3 ? [1e3, 'K'] : [1, ''];
    return [`${s}$${num(a / div, d != null ? d : div > 1 ? 1 : 0)}`, u];
  }
  // format: eok(억 단위 값) · krw(원 단위 값) · usd(달러 값) · count(unit으로 단위) · pct(증감을 %p로) · days
  // 축이나 탭처럼 카드 안의 다른 객체로 만들 때는 두 번째 인자로 카드 데이터를 주어 lang을 잇습니다.
  function format(d, root) {
    const dec = (v, fallback) => (d.decimals != null ? d.decimals : fallback);
    const F = (o) => Object.assign(o, { lang: (root || d).lang });
    switch (d.format) {
      case 'eok': return F({ parts: (v) => [num(v, dec(v, Number.isInteger(v) || Math.abs(v) >= 100 ? 0 : 1)), '억'], rel: true });
      case 'krw': return F({ parts: krw, rel: true });
      case 'usd': return F({ parts: (v) => usd(v, d.decimals), rel: true, usd: true });
      case 'pct': return F({ parts: (v) => [num(v, dec(v, 1)), '%'], rel: false });
      case 'days': return F({ parts: (v) => [num(v, dec(v, 1)), tx(root || d, '일')], rel: true });
      default: return F({ parts: (v) => [num(v, dec(v, Number.isInteger(v) ? 0 : 1)), d.unit || ''], rel: true });
    }
  }
  const show = (f, v) => withUnit(...f.parts(v));
  // 그릴 수 있는 숫자인지(빈 값 · 빈 글자 · NaN 제외)
  const fin = (v) => v != null && v !== '' && isFinite(v);
  // 증감: 방향은 화살표로, 좋고 나쁨(tone)은 better(up · down · neutral)로 정합니다. 비율은 %p로 적습니다.
  function delta(f, value, base, better) {
    const diff = value - base;
    const dir = Math.abs(diff) < 1e-9 ? 0 : Math.sign(diff);
    const want = better === 'down' ? -1 : better === 'neutral' ? 0 : 1;
    const tone = dir === 0 || want === 0 ? 'flat' : dir === want ? 'good' : 'bad';
    let text;
    if (!f.rel) text = tx(f, '%s%p', num(Math.abs(diff), 1));
    else if (base) text = `${num(Math.abs(diff / base) * 100, 1)}%`;
    else text = show(f, Math.abs(diff));
    return { dir, tone, text };
  }
  function arrow(dir) {
    const s = svgEl('svg', { class: 'vzb-arrow', viewBox: '0 0 12 12', 'aria-hidden': 'true' });
    s.append(svgEl('path', { d: dir > 0 ? 'M3.5 8.5l5-5M4.5 3.5h4v4' : 'M3.5 3.5l5 5M8.5 4.5v4h-4' }));
    return s;
  }
  // 대표 수치(단위는 작게)
  function figure(f, value) {
    const n = el('div', 'vzb-num');
    const [text, unit] = f.parts(value);
    n.append(text);
    if (unit) n.append(el('span', 'vzb-unit', unit));
    return n;
  }
  // 증감 배지: 화살표는 오르내림, 색은 좋고 나쁨(better)입니다.
  function badge(f, value, base, better) {
    const dl = delta(f, value, base, better);
    const b = el('span', `vzb-badge vzb-${dl.tone}`);
    if (dl.dir) b.append(arrow(dl.dir), el('span', 'vzb-sr', tx(f, dl.dir > 0 ? '증가' : '감소')));
    b.append(dl.text);
    return b;
  }
  // 머리: 제목 · 기간 부제(subtitle) · 대표 수치와 바로 뒤의 증감 배지. value가 null이면 제목만 둡니다.
  function head(card, d, f, value, cmp, cmpText) {
    const hd = el('div', 'vzb-hd');
    hd.append(el('div', 'vzb-title', d.title || ''));
    if (d.subtitle) hd.append(el('div', 'vzb-sub', d.subtitle));
    card.append(hd);
    if (value == null) return;
    const fig = el('div', 'vzb-fig');
    fig.append(figure(f, value));
    if (cmp && cmp.value != null) {
      const line = el('span', 'vzb-delta');
      line.append(badge(f, value, cmp.value, d.better), el('span', null, cmpText || tx(d, '%s 대비', cmp.label || tx(d, '비교 기간'))));
      fig.append(line);
    }
    card.append(fig);
  }
  // 같은 종류의 카드를 모두 찾아 그립니다. 코드를 두 번 붙여 넣어도 카드는 한 번만 그립니다.
  function mount(type, draw) {
    const run = () => {
      document.querySelectorAll(`.vzb-card[data-vzb="${type}"]:not([data-vzb-ready])`).forEach((card) => {
        card.setAttribute('data-vzb-ready', '');
        const src = card.querySelector('script[type="application/json"]');
        const raw = src ? src.textContent : '';
        let d;
        try { d = JSON.parse(raw); } catch (e) {
          card.append(el('p', 'vzb-error', tx(/"lang"\s*:\s*"en"/.test(raw) ? { lang: 'en' } : null, '카드 데이터(JSON)를 읽지 못했습니다: %s', e.message)));
          return;
        }
        card.setAttribute('role', 'group');
        if (d.title) card.setAttribute('aria-label', d.title);
        try { draw(card, d, format(d)); } catch (e) {
          card.append(el('p', 'vzb-error', tx(d, '카드를 그리지 못했습니다: %s', e.message)));
        }
      });
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
    else run();
  }
  // 크기가 바뀔 때마다 그래픽을 다시 그립니다. 차트는 카드에 남은 높이를 채웁니다.
  function onSize(node, fn) {
    let lw = 0, lh = 0;
    new ResizeObserver((entries) => {
      const w = Math.floor(entries[0].contentRect.width), h = Math.floor(entries[0].contentRect.height);
      if (w > 0 && h > 0 && (w !== lw || h !== lh)) { lw = w; lh = h; fn(w, h); }
    }).observe(node);
  }

  /* 툴팁과 조작: 마우스는 올리면 보이고 벗어나면 숨깁니다. 터치는 탭하면 보이고 다른 곳을 탭하면 닫힙니다.
     키보드는 그래프에 포커스한 뒤 화살표로 옮깁니다(가로 그래프는 좌우, 목록은 위아래). */
  let tip;
  // value는 글자나 요소입니다. side가 참이면 점 위가 아니라 세로선 옆, 그래프 윗선에 맞춰 둡니다(선 · 막대 차트).
  function showTip(x, y, label, value, side) {
    if (!tip) {
      tip = el('div', 'vzb-tip');
      tip.setAttribute('aria-hidden', 'true');
      document.body.append(tip);
    }
    tip.replaceChildren(el('span', 'vzb-tip-label', label), typeof value === 'string' ? el('span', 'vzb-tip-value', value) : value);
    tip.classList.add('is-on');
    const w = tip.offsetWidth, h = tip.offsetHeight, W = window.innerWidth, H = window.innerHeight;
    if (side) {
      // side가 'left'이면 기준선 왼쪽을 먼저, 그 밖에는 오른쪽을 먼저 씁니다. 자리가 모자라면 반대쪽으로 넘깁니다.
      const right = x + 14 + w <= W - 8, left = x - w - 14 >= 8;
      tip.style.left = `${(side === 'left' ? left || !right : !right) ? Math.max(8, x - w - 14) : x + 14}px`;
      tip.style.top = `${Math.min(Math.max(8, y), H - h - 8)}px`;
      return;
    }
    tip.style.left = `${Math.min(Math.max(8, x - w / 2), W - w - 8)}px`;
    tip.style.top = `${y - h - 12 < 8 ? y + 16 : y - h - 12}px`;
  }
  function hideTip() { if (tip) tip.classList.remove('is-on'); }
  // 툴팁 내용: { value, note } 또는 { rows: [{ tone, value, name }], note }. 값이 먼저, 이름은 뒤에 옅게 적습니다.
  function tipBody(spec, label) {
    const body = el('span', 'vzb-tip-body');
    let text = label;
    if (spec.rows) {
      const grid = el('span', 'vzb-tip-rows');
      spec.rows.forEach((r) => {
        const row = el('span', 'vzb-tip-row');
        row.append(el('i', `vzb-tip-key vzb-${r.tone}`), el('b', null, r.value), el('span', null, r.name));
        grid.append(row);
        text += `, ${r.name} ${r.value}`;
      });
      body.append(grid);
    } else {
      body.append(el('span', 'vzb-tip-value', spec.value));
      text += ` ${spec.value}`;
    }
    // note는 한 줄 글 또는 줄마다 나눈 배열입니다.
    (Array.isArray(spec.note) ? spec.note : [spec.note]).filter(Boolean).forEach((line) => {
      body.append(el('span', 'vzb-tip-note', line));
      text += `, ${line}`;
    });
    return { node: body, text };
  }
  // 범례: [{ name, tone, box(면), dot(점), dim(옅게), tick(세로 눈금) }]. 선은 짧은 선, 막대와 면은 네모, 점은 동그라미로 표시합니다.
  function legendEl(items) {
    const ul = el('ul', 'vzb-legend');
    items.forEach((it) => {
      const li = el('li');
      li.append(el('i', `vzb-key vzb-${it.tone}${it.box ? ' is-box' : ''}${it.dot ? ' is-dot' : ''}${it.dim ? ' is-dim' : ''}${it.tick ? ' is-tick' : ''}`), it.name);
      ul.append(li);
    });
    return ul;
  }
  // 글자 폭(12px 기준, size를 주면 그 크기)과 SVG 글자
  let meter;
  function textW(s, weight, family, size) {
    meter = meter || document.createElement('canvas').getContext('2d');
    meter.font = `${weight} ${size || 12}px ${family}`;
    return meter.measureText(s).width;
  }
  function svgText(x, y, s, cls, anchor) {
    const t = svgEl('text', { x, y, class: cls, 'text-anchor': anchor || 'start' });
    t.textContent = s;
    return t;
  }
  // 차이를 부호와 함께 적습니다. 비율 지표는 %p입니다.
  function signed(f, diff) {
    const s = diff > 0 ? '+' : diff < 0 ? '−' : '';
    return f.rel ? `${s}${show(f, Math.abs(diff))}` : `${s}${num(Math.abs(diff), 1)}%p`;
  }
  // pick(clientX, clientY) → 순번, point(순번) → { x, y, label, value, text, side }(화면 좌표), clear() → 강조 해제
  // n은 개수나 개수를 돌려주는 함수입니다. vertical이면 위아래 화살표로 옮깁니다. 돌려주는 { show(순번), at() }로 키를 더 붙입니다.
  // 아무것도 고르지 않은 채 화살표를 누르면 기간 차트는 마지막(최근)부터, vertical이나 first면 첫 순번부터 짚습니다.
  function interact(plot, n, pick, point, clear, vertical, first) {
    let idx = -1, touched = false;
    const count = () => (typeof n === 'function' ? n() : n);
    const live = el('span', 'vzb-sr');
    live.setAttribute('aria-live', 'polite');
    plot.after(live);
    const go = (i) => {
      if (i < 0 || i >= count()) return;
      idx = i;
      const p = point(i);
      showTip(p.x, p.y, p.label, p.value, p.side);
      live.textContent = p.text || `${p.label} ${p.value}`;
    };
    const end = () => {
      if (idx < 0) return;
      idx = -1;
      clear();
      hideTip();
    };
    const [back, next] = vertical ? ['ArrowUp', 'ArrowDown'] : ['ArrowLeft', 'ArrowRight'];
    // pick이 -1이면(조각 밖) 강조를 풉니다.
    const at = (e) => { const i = pick(e.clientX, e.clientY); if (i < 0) end(); else go(i); };
    plot.addEventListener('pointermove', (e) => { if (e.pointerType !== 'touch' || touched) at(e); });
    plot.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') { touched = true; at(e); } });
    plot.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch') end(); });
    document.addEventListener('pointerdown', (e) => { if (touched && !plot.contains(e.target)) { touched = false; end(); } }, true);
    plot.addEventListener('keydown', (e) => {
      if (e.key !== back && e.key !== next) return;
      e.preventDefault();
      const last = count() - 1;
      go(idx < 0 ? (vertical || first ? 0 : last) : Math.max(0, Math.min(last, idx + (e.key === next ? 1 : -1))));
    });
    plot.addEventListener('blur', end);
    window.addEventListener('scroll', end, { passive: true });
    return { show: go, at: () => idx, end };
  }

  // KPI - Stacked Bar: 합계를 이루는 부분의 비중을 간격 있는 둥근 조각으로 나눕니다. 조각은 네 개까지입니다.
  // 큰 세 항목은 주황 · 분홍빨강 · 노랑으로, 나머지(와 "other": true인 항목)는 회색 한 조각으로 묶습니다.
  // 범례는 두 줄 두 칸에 이름과 비중만 적고, 금액은 조각이나 범례에 마우스를 올리면 툴팁으로 보여줍니다.
  mount('kpi-stacked-bar', (card, d, f) => {
    const sum = (list) => list.reduce((s, p) => s + p.value, 0);
    let named = d.parts.filter((p) => !p.other);
    if (d.sort !== false) named = named.slice().sort((a, b) => b.value - a.value);
    const rest = named.slice(3).concat(d.parts.filter((p) => p.other));
    const segs = named.slice(0, 3).map((p, i) => ({ label: p.label, value: p.value, cls: `vzb-sp-c${i + 1}` }));
    if (rest.length === 1) segs.push({ label: rest[0].label, value: rest[0].value, cls: 'vzb-sp-co' });
    else if (rest.length) segs.push({ label: tx(d, '기타'), value: sum(rest), cls: 'vzb-sp-co', note: rest.map((p) => p.label).join('·') });
    const whole = sum(segs) || 1;
    const share = (v) => `${num((v / whole) * 100, 1)}%`;
    head(card, d, f, d.value != null ? d.value : sum(d.parts), d.compare);

    const foot = el('div', 'vzb-foot');
    const bar = el('div', 'vzb-plot vzb-sp-bar');
    bar.tabIndex = 0;
    bar.setAttribute('role', 'img');
    bar.setAttribute('aria-label', tx(d, '%s. 좌우 화살표로 항목을 옮깁니다.', segs.map((s) => `${s.label} ${share(s.value)}`).join(', ')));
    const legend = el('ul', 'vzb-sp-legend');
    const segEls = [], rowEls = [];
    const focus = (i) => {
      segEls.forEach((e, j) => e.classList.toggle('vzb-dim', i >= 0 && j !== i));
      rowEls.forEach((e, j) => e.classList.toggle('vzb-dim', i >= 0 && j !== i));
    };
    segs.forEach((s, i) => {
      const seg = el('i', `vzb-sp-seg ${s.cls}`);
      seg.style.flexGrow = Math.max(0, s.value);
      bar.append(seg);
      segEls.push(seg);
      const row = el('li');
      const name = el('span', 'vzb-sp-name', s.label);   // 기타에 든 항목은 툴팁에 적습니다
      row.append(el('i', `vzb-sp-key ${s.cls}`), name, el('b', null, share(s.value)));
      row.addEventListener('pointerenter', () => { const p = point(i); showTip(p.x, p.y, p.label, p.value); });
      row.addEventListener('pointerleave', () => { focus(-1); hideTip(); });
      legend.append(row);
      rowEls.push(row);
    });
    foot.append(bar, legend);
    card.append(foot);
    function point(i) {
      focus(i);
      const r = segEls[i].getBoundingClientRect(), s = segs[i];
      return { x: r.left + r.width / 2, y: r.top, label: s.note ? `${s.label} (${s.note})` : s.label, value: `${show(f, s.value)} · ${share(s.value)}` };
    }
    interact(bar, segs.length,
      (cx) => { const i = segEls.findIndex((e) => cx <= e.getBoundingClientRect().right + 1); return i < 0 ? segs.length - 1 : i; },
      point,
      () => focus(-1));
  });
})();
</script>
