<!-- Vizney Blocks v0.54 · 범프 차트 · Rank Lines (bump-race)

<link rel="stylesheet" href="https://spoqa.github.io/spoqa-han-sans/css/SpoqaHanSansNeo.css">
<style>
/* Vizney Blocks 토큰: 내 페이지의 :root에 같은 변수를 다시 적으면 모든 카드에 적용됩니다.
   색은 Vizney의 Figma 팔레트에서 고릅니다. 데이터는 파랑(#007aff) · 분홍빨강(#ff2d55) · 주황(#ff9500), 좋고 나쁨은 초록(#34c759) · 빨강(#ff3b30)이고,
   옅은 단계는 같은 색을 바탕에 섞어 만듭니다. 글자는 Vizney 검정(#1b1b1b)입니다.
   JSON에 "theme": "dark"를 적으면 아래 .vzb-dark 값으로 Vizney 검정 바탕에 노랑을 첫째 색, 흰색을 둘째 색으로 그립니다.
   목록: https://blocks.vizney.com/ko/tokens.css */
:where(:root) {
  --vzb-font: 'Spoqa Han Sans Neo', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;   /* 카드의 모든 글자 */
  --vzb-card: #ffffff;   /* 카드 바탕 */
  --vzb-edge: rgba(17, 24, 39, 0.05);   /* 카드 테두리 */
  --vzb-ink: #1b1b1b;   /* 제목과 대표 수치 */
  --vzb-ink-2: #4a4a4a;   /* 본문 글자, 변화 없음 배지 */
  --vzb-muted: #737373;   /* 부제, 단위, 축 눈금 */
  --vzb-grid: #ebebeb;   /* 격자와 머리 아래 선. 바탕에서 한 단계 떨어진 회색 실선 */
  --vzb-primary: #007aff;   /* 첫째 데이터 색(파랑). 선, 막대, 가장 큰 항목 */
  --vzb-primary-tint: #e6f2ff;   /* 파랑의 옅은 바탕. 선 아래 음영, 레이더 면 */
  --vzb-primary-soft: #bfdeff;   /* 이름을 얹는 바 리스트 막대 */
  --vzb-secondary: #ff2d55;   /* 둘째 데이터 색(분홍빨강) */
  --vzb-tertiary: #ff9500;   /* 셋째 데이터 색(주황) */
  --vzb-primary-mid: #8cc3ff;     /* 넓은 면(트리맵 칸)에 쓰는 한 단계 옅은 색 */
  --vzb-secondary-mid: #ff7a93;   /* 분홍빨강의 넓은 면 */
  --vzb-tertiary-mid: #ffb54d;   /* 주황의 넓은 면 */
  --vzb-other-mid: #e3e3e3;   /* 기타 묶음의 넓은 면 */
  --vzb-line-3: #ff9500;   /* 선의 셋째 색(주황) */
  --vzb-base: #c4c4c4;   /* 비교 기준(작년 선, 레이더의 기준 면 테두리) */
  --vzb-track: #f1f1f1;   /* 게이지 · 달성률 막대의 바탕 */
  --vzb-other: #d9d9d9;   /* 기타로 묶은 항목, 넷째부터의 항목 */
  --vzb-good: #34c759;   /* 좋은 증감의 면(워터폴의 늘린 요인, 달성 막대). 팔레트 초록. 흰 바탕 대비 2.2:1로 옅어 글자에는 쓰지 않습니다 */
  --vzb-good-tint: #ebf9ee;   /* 좋은 증감 배지의 바탕(초록 10%) */
  --vzb-good-ink: #2a8040;   /* 좋은 증감의 글자(배지). 초록에 검정 41%를 섞어 흰 바탕 대비 4.9:1 */
  --vzb-bad: #ff3b30;   /* 나쁜 증감, 한도 초과의 면. 팔레트 빨강. 흰 바탕 대비 3.6:1 */
  --vzb-bad-tint: #ffebea;   /* 나쁜 증감 배지의 바탕(빨강 10%) */
  --vzb-bad-ink: #cb342b;   /* 나쁜 증감과 오류 문구의 글자. 빨강에 검정 23%를 섞어 흰 바탕 대비 5.2:1 */
  --vzb-tip: #1b1b1b;   /* 툴팁 바탕 */
  --vzb-radius: 18px;   /* 카드 모서리 */
  --vzb-unit: 168px;   /* 높이 1단위(KPI - Number). Line · Bar는 2배, 나머지 KPI는 1.5배, 차트 카드는 2배 */
  --vzb-shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 18px 40px -22px rgba(17, 24, 39, 0.22);   /* 카드 그림자 */
}

/* 어두운 바탕("theme": "dark"): 같은 변수를 카드 안에서만 바꿉니다. 노랑 하나에 흰색과 회색을 더해 Vizney 검정 · 흰색 · 노랑으로 그립니다.
   노랑 · 흰색 · 회색은 색각 시뮬레이션(가장 가까운 쌍 ΔE 14.9)과 바탕 대비 검사를 통과합니다.
   좋고 나쁨은 밝은 바탕과 같은 초록(#34c759) · 빨강(#ff3b30)이고, 검정 바탕에서는 글자에도 그대로 씁니다(대비 7.8:1 · 4.9:1). */
.vzb-dark {
  --vzb-card: #1b1b1b;   /* 카드 바탕(Vizney 검정) */
  --vzb-edge: rgba(255, 255, 255, 0.08);   /* 카드 테두리 */
  --vzb-ink: #f5f5f5;   /* 제목과 대표 수치 */
  --vzb-ink-2: #cfcfcf;   /* 본문 글자 */
  --vzb-muted: #9b9b9b;   /* 부제, 단위, 축 눈금 */
  --vzb-grid: #2f2f2f;   /* 격자와 머리 아래 선 */
  --vzb-primary: #ffcc00;   /* 첫째 데이터 색(Vizney 노랑) */
  --vzb-primary-tint: #362f18;   /* 노랑의 옅은 바탕 */
  --vzb-primary-soft: #5f5013;   /* 이름을 얹는 바 리스트 막대 */
  --vzb-secondary: #f5f5f5;   /* 둘째 데이터 색(흰색) */
  --vzb-tertiary: #9b9b9b;   /* 셋째 데이터 색(회색) */
  --vzb-primary-mid: #826b0f;   /* 넓은 면. 밝은 글자가 올라가도록 한 단계 어둡게 */
  --vzb-secondary-mid: #5c5c5c;   /* 흰색의 넓은 면. 흰 글자가 올라가도록 회색으로 */
  --vzb-tertiary-mid: #424242;   /* 회색의 넓은 면 */
  --vzb-other-mid: #3a3a3a;   /* 기타 묶음의 넓은 면 */
  --vzb-line-3: #9b9b9b;   /* 선의 셋째 색(회색) */
  --vzb-base: #6b6b6b;   /* 비교 기준 */
  --vzb-track: #2c2c2c;   /* 게이지 · 달성률 막대의 바탕 */
  --vzb-other: #4d4d4d;   /* 기타로 묶은 항목 */
  --vzb-good: #34c759;   /* 좋은 증감(팔레트 초록) */
  --vzb-good-tint: #1f3725;   /* 좋은 증감 배지의 바탕(초록 16%) */
  --vzb-good-ink: #34c759;   /* 좋은 증감의 글자 */
  --vzb-bad: #ff3b30;   /* 나쁜 증감, 한도 초과(팔레트 빨강) */
  --vzb-bad-tint: #2d1e1d;   /* 나쁜 증감 배지의 바탕(빨강 8%, 글자 대비 4.5:1을 지키는 만큼) */
  --vzb-bad-ink: #ff3b30;   /* 나쁜 증감과 오류 문구의 글자 */
  --vzb-tip: #3a3a3a;   /* 툴팁 바탕 */
  --vzb-shadow: none;   /* 카드 그림자 */
}
/* 카드: 놓인 자리의 폭을 채우고, 높이는 세 단계입니다(Number 1 · Line, Bar 2 · 나머지 1.5, 단위 --vzb-unit). */
.vzb-card {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: calc(var(--vzb-unit) * 1.5);
  padding: 24px;
  background: var(--vzb-card);
  color: var(--vzb-ink);
  border: 1px solid var(--vzb-edge);
  border-radius: var(--vzb-radius);
  box-shadow: var(--vzb-shadow);
  font: 400 13px/18px var(--vzb-font);
  text-align: left;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
.vzb-card *, .vzb-card *::before, .vzb-card *::after { box-sizing: border-box; }

/* 머리: 제목과 기간 부제, 그 아래 대표 수치와 바로 뒤의 증감 배지.
   배지와 비교 문구는 숫자와 같은 줄의 항목이라, 좁으면 비교 문구만 아래 줄로 내려가고 배지는 숫자 뒤에 남습니다. */
.vzb-title { font-size: 17px; line-height: 24px; font-weight: 500; }
.vzb-sub { margin-top: 2px; color: var(--vzb-muted); }
.vzb-fig { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; margin-top: 20px; }   /* 숫자 줄은 기준선 아래에 16px이 남아 줄 사이를 따로 두지 않습니다 */
.vzb-num { margin-right: 4px; font-size: 34px; line-height: 40px; font-weight: 400; letter-spacing: -0.02em; white-space: nowrap; }   /* 숫자와 배지 사이 12px, 배지와 비교 문구 사이 8px */
.vzb-unit { margin-left: 4px; font-size: 16px; letter-spacing: 0; color: var(--vzb-muted); }
.vzb-delta { display: contents; color: var(--vzb-muted); white-space: nowrap; }
.vzb-vs { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.vzb-badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px 3px 6px; border-radius: 7px; font-weight: 500; }
.vzb-badge.vzb-good { color: var(--vzb-good-ink); background: var(--vzb-good-tint); }
.vzb-badge.vzb-bad { color: var(--vzb-bad-ink); background: var(--vzb-bad-tint); }
.vzb-badge.vzb-flat { color: var(--vzb-ink-2); background: var(--vzb-track); padding-left: 8px; }
.vzb-arrow { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.vzb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* 그래픽은 카드 아래쪽에 붙습니다. 같은 줄의 카드 높이가 맞춰져도 그래픽끼리 바닥이 맞습니다. */
.vzb-foot { margin-top: auto; padding-top: 20px; }
.vzb-error { margin: 8px 0 0; color: var(--vzb-bad-ink); }
/* 그래프 영역: 마우스를 올리거나, 포커스한 뒤 좌우 화살표로 값을 봅니다. */
.vzb-plot { position: relative; border-radius: 4px; outline: none; touch-action: pan-y; }
.vzb-plot:focus-visible { outline: 2px solid var(--vzb-primary); outline-offset: 4px; }
/* 남은 높이를 채우는 차트: 그래프 영역이 늘어나고 그림은 그 크기에 맞춰 다시 그립니다. */
.vzb-fill { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
.vzb-fill > .vzb-plot { flex: 1 1 auto; min-height: 72px; }
.vzb-fill > .vzb-plot > svg { position: absolute; left: 0; top: 0; }
.vzb-tip {
  position: fixed;
  z-index: 1000;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  padding: 7px 10px;
  border-radius: 8px;
  background: var(--vzb-tip);
  color: #ffffff;
  box-shadow: 0 10px 24px -8px rgba(27, 27, 27, 0.4);
  font: 400 12px/17px var(--vzb-font);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.12s;
}
.vzb-tip.is-on { opacity: 1; }
.vzb-tip-label { color: rgba(255, 255, 255, 0.72); }
.vzb-tip-value { font-size: 13px; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .vzb-tip { transition: none; } }
/* 색 이름: t1 · t2 · t3 선(파랑 · 분홍빨강 · 주황, 어두운 바탕은 노랑 · 흰색 · 회색), f1 · f2 · f3 막대와 면(같은 순서), fs 옅은 첫째 색,
   t0 · f0 비교 회색, tx · fx 그 밖의 회색, fg · fb 좋음 · 나쁨, ti 목표 · 기준 표시 */
.vzb-t1, .vzb-f1 { --vzb-c: var(--vzb-primary); }
.vzb-t2, .vzb-f2 { --vzb-c: var(--vzb-secondary); }
.vzb-t3 { --vzb-c: var(--vzb-line-3); }
.vzb-f3 { --vzb-c: var(--vzb-tertiary); }
.vzb-t0, .vzb-f0 { --vzb-c: var(--vzb-base); }
.vzb-tx, .vzb-fx { --vzb-c: var(--vzb-other); }
.vzb-fg { --vzb-c: var(--vzb-good); }
.vzb-fb { --vzb-c: var(--vzb-bad); }
.vzb-ti { --vzb-c: var(--vzb-ink); }
.vzb-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 10px 0 0; padding: 0; list-style: none; color: var(--vzb-ink-2); }
.vzb-legend li { display: inline-flex; align-items: center; gap: 6px; }
.vzb-key, .vzb-tip-key { display: inline-block; flex: none; width: 12px; height: 3px; border-radius: 2px; background: var(--vzb-c); }
.vzb-key.is-box { width: 10px; height: 10px; border-radius: 3px; }
.vzb-key.is-dot { width: 9px; height: 9px; border-radius: 50%; }
.vzb-key.is-dim { opacity: 0.4; }
.vzb-tip-body { display: flex; flex-direction: column; }
.vzb-tip-rows { display: grid; grid-template-columns: auto auto auto; justify-content: start; align-items: center; column-gap: 8px; row-gap: 1px; margin-top: 3px; }
.vzb-tip-row { display: contents; }
.vzb-tip-row b { font-size: 13px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.vzb-tip-row span { color: rgba(255, 255, 255, 0.72); }
.vzb-tip-note { margin-top: 3px; color: rgba(255, 255, 255, 0.72); }
.vzb-tip-note + .vzb-tip-note { margin-top: 0; }
.vzb-fs { --vzb-c: var(--vzb-primary-soft); }
.vzb-key.is-tick { width: 2px; height: 12px; border-radius: 1px; }
/* Rank Lines: 높이 2단위. 그래프는 머리 아래 남은 높이를 채우고, 맨 아래에 구간 막대(34px)를 둡니다.
   선은 2px S자 곡선이고, 짚을 항목만 첫째 데이터 색, 나머지는 글자색을 카드 바탕에 30% 섞은 회색입니다(겹쳐도 진해지지 않게 불투명).
   기간마다 지름 5px 점은 짚을 항목(과 마우스로 짚은 항목)에만 찍고, 선 끝 점(지름 8px · 짚을 항목 10px)은 카드 바탕색 2px 테두리로 겹친 선과 떼어 냅니다.
   이름표는 선 끝 오른쪽 10px에 '순위 이름'으로 적습니다(12px, 순위는 굵게 옅은 글자색, 짚을 항목은 이름까지 굵게 글자색).
   앞지르는 동안 두 이름표가 겹치면 짚을 항목 · 순위가 높은 쪽만 남기고 다른 쪽은 잠시 옅게 둡니다.

    onSize(plot, layout);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (W) layout(W, H); });
    // 화면에 처음 보일 때 첫 기간에서 잠시 멈췄다가 재생합니다. 화면 밖에 있는 동안은 멈춰 둡니다.
    const start = () => { if (!seen) { seen = true; if (auto && !took) { playing = true; wait = LEAD; setBtn(); } } };
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((es) => {
        if (!card.isConnected) { io.disconnect(); return; }
        inView = es[es.length - 1].isIntersecting;
        if (inView) start();
        kick();
      }, { threshold: 0.3 });
      io.observe(card);
    } else { inView = true; start(); }
  });
})();
