/* Vizney Blocks 토큰: 내 페이지의 :root에 같은 변수를 다시 적으면 모든 카드에 적용됩니다.

   목록: https://blocks.vizney.com/ko/tokens.css */
:where(:root) {

  --vzb-base: #c4c4c4;   /* 비교 기준(작년 선, 레이더의 기준 면 테두리) */

/* 어두운 바탕("theme": "dark"): 같은 변수를 카드 안에서만 바꿉니다. 노랑 하나에 흰색과 회색을 더해 Vizney 검정 · 흰색 · 노랑으로 그립니다.
   노랑 · 흰색 · 회색은 색각 시뮬레이션(가장 가까운 쌍 ΔE 14.9)과 바탕 대비 검사를 통과합니다.
   경고(한도 초과 · 나쁜 증감)는 노랑 대신 같은 팔레트의 분홍빨강(#ff2d55, 밝은 바탕의 둘째 데이터 색)을 씁니다. 바탕 대비 4.7:1입니다. */
.vzb-dark {
  --vzb-card: #1b1b1b;   /* 카드 바탕(Vizney 검정) */
  --vzb-edge: rgba(255, 255, 255, 0.08);   /* 카드 테두리 */
  --vzb-ink: #f5f5f5;   /* 제목과 대표 수치 */
  --vzb-ink-2: #cfcfcf;   /* 본문 글자 */
  --vzb-muted: #9b9b9b;   /* 부제, 단위, 축 눈금 */
  --vzb-grid: #2f2f2f;   /* 격자와 머리 아래 선 */
  --vzb-primary: #ffcc00;   /* 첫째 데이터 색(Vizney 노랑) */
  --vzb-primary-tint: #362f18;   /* 노랑의 옅은 바탕 */
  --vzb-primary-soft: #5f5013;   /* 이름을 얹는 바 리스트 막대 */
  --vzb-secondary: #f5f5f5;   /* 둘째 데이터 색(흰색) */
  --vzb-tertiary: #9b9b9b;   /* 셋째 데이터 색(회색) */
  --vzb-primary-mid: #826b0f;   /* 넓은 면. 밝은 글자가 올라가도록 한 단계 어둡게 */
  --vzb-secondary-mid: #5c5c5c;   /* 흰색의 넓은 면. 흰 글자가 올라가도록 회색으로 */
  --vzb-tertiary-mid: #424242;   /* 회색의 넓은 면 */
  --vzb-other-mid: #3a3a3a;   /* 기타 묶음의 넓은 면 */
  --vzb-line-3: #9b9b9b;   /* 선의 셋째 색(회색) */
  --vzb-base: #6b6b6b;   /* 비교 기준 */
  --vzb-track: #2c2c2c;   /* 게이지 · 달성률 막대의 바탕 */
  --vzb-other: #4d4d4d;   /* 기타로 묶은 항목 */
  --vzb-good: #30d158;   /* 좋은 증감 */
  --vzb-good-tint: #1e3624;   /* 좋은 증감 배지의 바탕 */
  --vzb-bad: #ff2d55;   /* 나쁜 증감, 한도 초과 */
  --vzb-bad-tint: #3d1e24;   /* 나쁜 증감 배지의 바탕 */
  --vzb-tip: #3a3a3a;   /* 툴팁 바탕 */
  --vzb-shadow: none;   /* 카드 그림자 */
}
/* 카드: 놓인 자리의 폭을 채우고, 높이는 세 단계입니다(Number 1 · Line, Bar 2 · 나머지 1.5, 단위 --vzb-unit). */
.vzb-card {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: calc(var(--vzb-unit) * 1.5);
  padding: 24px;
  background: var(--vzb-card);
  color: var(--vzb-ink);
  border: 1px solid var(--vzb-edge);
  border-radius: var(--vzb-radius);
  box-shadow: var(--vzb-shadow);
  font: 400 13px/18px var(--vzb-font);
  text-align: left;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
.vzb-card *, .vzb-card *::before, .vzb-card *::after { box-sizing: border-box; }

/* 머리: 제목과 기간 부제, 그 아래 대표 수치와 바로 뒤의 증감 배지.
   배지와 비교 문구는 숫자와 같은 줄의 항목이라, 좁으면 비교 문구만 아래 줄로 내려가고 배지는 숫자 뒤에 남습니다. */
.vzb-title { font-size: 17px; line-height: 24px; font-weight: 500; }
.vzb-sub { margin-top: 2px; color: var(--vzb-muted); }
.vzb-fig { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; margin-top: 20px; }   /* 숫자 줄은 기준선 아래에 16px이 남아 줄 사이를 따로 두지 않습니다 */
.vzb-num { margin-right: 4px; font-size: 34px; line-height: 40px; font-weight: 400; letter-spacing: -0.02em; white-space: nowrap; }   /* 숫자와 배지 사이 12px, 배지와 비교 문구 사이 8px */
.vzb-unit { margin-left: 4px; font-size: 16px; letter-spacing: 0; color: var(--vzb-muted); }
.vzb-delta { display: contents; color: var(--vzb-muted); white-space: nowrap; }
.vzb-vs { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.vzb-badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px 3px 6px; border-radius: 7px; font-weight: 500; }
.vzb-badge.vzb-good { color: var(--vzb-good); background: var(--vzb-good-tint); }
.vzb-badge.vzb-bad { color: var(--vzb-bad); background: var(--vzb-bad-tint); }
.vzb-badge.vzb-flat { color: var(--vzb-ink-2); background: var(--vzb-track); padding-left: 8px; }
.vzb-arrow { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.vzb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* 그래픽은 카드 아래쪽에 붙습니다. 같은 줄의 카드 높이가 맞춰져도 그래픽끼리 바닥이 맞습니다. */
.vzb-foot { margin-top: auto; padding-top: 20px; }
.vzb-error { margin: 8px 0 0; color: var(--vzb-bad); }
/* 범위 슬라이더(컨트롤): 높이 1단위. 위에서부터 말풍선(22px) · 손잡이와 트랙(20px) · 양 끝 값(14px)입니다.
   고른 구간과 손잡이, 말풍선은 글자색(밝은 바탕 검정, 어두운 바탕 흰색)으로 두어 차트의 데이터 색과 겨루지 않습니다.
   손잡이는 카드 바탕색 테두리로 트랙과 떼고, 움직임(용수철 · 기울기 · 합쳐짐)은 스크립트가 transform으로 그립니다. */
.vzb-card[data-vzb^="control-"] { min-height: var(--vzb-unit); }
.vzb-sl.vzb-foot { padding-top: 10px; }
.vzb-sl-area { position: relative; height: 48px; cursor: pointer; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
.vzb-sl-track { position: absolute; left: 0; right: 0; bottom: 8px; height: 4px; border-radius: 2px; background: var(--vzb-other); }
.vzb-sl-fill { position: absolute; left: 0; bottom: 8px; width: 1px; height: 4px; background: var(--vzb-ink); transform-origin: 0 50%; }
.vzb-sl-thumb { position: absolute; left: 0; bottom: 0; width: 20px; height: 20px; margin-left: -10px; border: 3px solid var(--vzb-card); border-radius: 50%; background: var(--vzb-ink); cursor: grab; outline: none; }
.vzb-sl-area.is-drag, .vzb-sl-area.is-drag .vzb-sl-thumb { cursor: grabbing; }
.vzb-sl-thumb:focus-visible { box-shadow: 0 0 0 2px var(--vzb-primary); }
.vzb-sl-tip { position: absolute; left: 0; top: 0; padding: 2px 8px; border-radius: 8px; background: var(--vzb-ink); color: var(--vzb-card); font-size: 12px; line-height: 18px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; transform-origin: 50% 100%; pointer-events: none; will-change: transform, opacity; }
.vzb-sl-ends { display: flex; justify-content: space-between; margin-top: 2px; color: var(--vzb-muted); font-size: 11px; line-height: 14px; font-variant-numeric: tabular-nums; }

    const foot = el('div', 'vzb-foot vzb-sl'), area = el('div', 'vzb-sl-area'), ends = el('div', 'vzb-sl-ends');
    area.setAttribute('data-vzb-input', '');
    const bubble = () => { const b = el('span', 'vzb-sl-tip'); b.setAttribute('aria-hidden', 'true'); return b; };
    const knob = (name) => {
      const k = el('span', 'vzb-sl-thumb');
      k.tabIndex = 0;
      k.setAttribute('role', 'slider');
      k.setAttribute('aria-label', name);
      k.setAttribute('aria-valuemin', 0);
      k.setAttribute('aria-valuemax', n);
      return k;
    };
    const ta = bubble(), tb = bubble(), tm = bubble(), A = knob(cfg.aria[0]), B = knob(cfg.aria[1]);
    const fill = el('span', 'vzb-sl-fill');
    ends.append(el('span', null, cfg.text(0)), el('span', null, cfg.text(n)));
    area.append(ta, tb, tm, el('span', 'vzb-sl-track'), fill, A, B);
    foot.append(area, ends);
    card.append(foot);

    const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    // 용수철 셋: 앞 손잡이 · 뒤 손잡이의 가로 자리(px)와 말풍선이 합쳐진 정도(0…1). k는 세기, c는 잦아드는 힘입니다.
    const spring = (k, c) => ({ x: 0, v: 0, t: 0, k, c });
    const sa = spring(320, 24), sb = spring(320, 24), sm = spring(340, 30), all = [sa, sb, sm];
    const held = (s) => { s.k = 1000; s.c = 63; };   // 끄는 동안: 넘치지 않고 손가락에 붙습니다
    const freed = (s) => { s.k = 320; s.c = 24; };    // 놓은 뒤 · 키보드: 한 번 살짝 넘쳤다 자리를 잡습니다
    let W = 0, wa = 0, wb = 0, wm = 0, drag = null, raf = 0, last = 0, idle = 0;
    const pos = (i) => R + (i / n) * Math.max(1, W - 2 * R);
    const at = (x) => Math.round(((x - R) / Math.max(1, W - 2 * R)) * n);
    const mid = (w, x) => Math.max(w / 2, Math.min(W - w / 2, x));   // 말풍선 가운데는 카드 안쪽에 머뭅니다

    function emit(quiet) {
      const value = [cfg.value(lo), cfg.value(hi)];
      card.setAttribute('data-vzb-value', JSON.stringify(value));
      if (!quiet) card.dispatchEvent(new CustomEvent('vzb-change', { bubbles: true, detail: { name: d.name || '', value } }));
    }
    function write() {
      const a = cfg.text(lo), b = cfg.text(hi);
      ta.textContent = a;
      tb.textContent = b;
      tm.textContent = lo === hi ? a : `${a} – ${b}`;
      wa = ta.offsetWidth; wb = tb.offsetWidth; wm = tm.offsetWidth;
      A.setAttribute('aria-valuenow', lo);
      A.setAttribute('aria-valuetext', a);
      B.setAttribute('aria-valuenow', hi);
      B.setAttribute('aria-valuetext', b);
    }
    function set(a, b) {
      if (a === lo && b === hi) return;
      lo = a; hi = b;
      write();
      emit();
    }
    const place = (node, w, x, v, o, k) => {
      const lean = Math.max(-10, Math.min(10, -v * 0.018));   // 빠를수록 움직이는 쪽으로 기웁니다
      node.style.opacity = o.toFixed(3);
      node.style.transform = `translateX(${(mid(w, x) - w / 2).toFixed(2)}px) rotate(${lean.toFixed(2)}deg) scale(${k.toFixed(3)})`;
    };
    function draw() {
      const xa = sa.x, xb = sb.x, m = Math.max(0, Math.min(1, sm.x)), c = (xa + xb) / 2;
      A.style.transform = `translateX(${xa.toFixed(2)}px)`;
      B.style.transform = `translateX(${xb.toFixed(2)}px)`;
      fill.style.transform = `translateX(${xa.toFixed(2)}px) scaleX(${Math.max(0, xb - xa).toFixed(2)})`;
      // 따로 있던 두 말풍선은 가운데로 모이며 옅어지고, 합친 말풍선이 그 자리에서 커집니다.
      place(ta, wa, xa + (c - xa) * m, sa.v, 1 - m, 1 - 0.2 * m);
      place(tb, wb, xb + (c - xb) * m, sb.v, 1 - m, 1 - 0.2 * m);
      place(tm, wm, c, (sa.v + sb.v) / 2, m, 0.8 + 0.2 * m);
    }
    // 두 말풍선이 서로 닿을 만큼 가까우면 합칩니다(카드 끝에 걸려 밀린 자리까지 따집니다).
    const near = () => mid(wb, sb.x) - mid(wa, sa.x) < (wa + wb) / 2 + 6;
    function frame(now) {
      raf = 0;
      if (!card.isConnected) return;
      const dt = Math.min(0.033, last ? (now - last) / 1000 : 0.016) / 4;
      last = now;
      sm.t = near() ? 1 : 0;
      for (let i = 0; i < 4; i++) all.forEach((s) => { s.v += (-s.k * (s.x - s.t) - s.c * s.v) * dt; s.x += s.v * dt; });
      draw();
      if (drag || Math.abs(sa.x - sa.t) > 0.05 || Math.abs(sb.x - sb.t) > 0.05 || Math.abs(sm.x - sm.t) > 0.004 || Math.abs(sa.v) + Math.abs(sb.v) > 1) raf = requestAnimationFrame(frame);
      else { jump(); last = 0; }
    }
    function jump() {   // 용수철 없이 제자리에
      sa.x = sa.t; sb.x = sb.t; sa.v = sb.v = sm.v = 0;
      sm.x = sm.t = near() ? 1 : 0;
      draw();
    }
    const wake = () => { if (reduce) jump(); else if (!raf) raf = requestAnimationFrame(frame); };
    function rest() {   // 손을 뗀 뒤와 키보드: 고른 칸의 자리로 돌아갑니다
      freed(sa); freed(sb);
      sa.t = pos(lo); sb.t = pos(hi);
      wake();
    }

    // 끌기: 조작 영역 어디를 눌러도 가까운 손잡이가 따라옵니다. 두 손잡이가 같은 자리면 끄는 방향으로 정합니다.
    const local = (e) => e.clientX - area.getBoundingClientRect().left;
    function move(x) {
      if (!drag.who) {
        if (Math.abs(x - drag.x) < 2) return;
        drag.who = x > drag.x ? B : A;
      }
      const first = drag.who === A, s = first ? sa : sb;
      if (!drag.held) { drag.held = true; held(s); }
      const px = Math.max(R, Math.min(W - R, x - drag.off));
      s.t = first ? Math.min(px, sb.t) : Math.max(px, sa.t);
      if (first) set(Math.min(at(s.t), hi), hi); else set(lo, Math.max(at(s.t), lo));
      wake();
    }
    area.addEventListener('pointerdown', (e) => {
      if (e.button) return;
      const x = local(e), da = Math.abs(x - sa.t), db = Math.abs(x - sb.t);
      drag = { x, who: da < db ? A : db < da ? B : x > sb.t ? B : x < sa.t ? A : null };
      drag.off = Math.min(da, db) <= R ? x - (da <= db ? sa.t : sb.t) : 0;   // 손잡이를 잡았으면 잡은 자리를 지키고, 트랙을 눌렀으면 손잡이가 그리로 옵니다
      idle = Infinity;
      area.classList.add('is-drag');
      area.setPointerCapture(e.pointerId);
      move(x);
    });
    area.addEventListener('pointermove', (e) => { if (drag) move(local(e)); });
    const drop = () => {
      if (!drag) return;
      drag = null;
      idle = performance.now() + 6000;
      area.classList.remove('is-drag');
      rest();
    };
    area.addEventListener('pointerup', drop);
    area.addEventListener('pointercancel', drop);
    // 키보드: 화살표는 한 칸, Page Up · Down은 열 칸쯤, Home · End는 갈 수 있는 끝(다른 손잡이를 넘지 않습니다)
    const keys = (first) => (e) => {
      const big = Math.max(1, Math.round(n / 10));
      const by = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1, PageUp: big, PageDown: -big }[e.key];
      let v = first ? lo : hi;
      if (by) v += by; else if (e.key === 'Home') v = first ? 0 : lo; else if (e.key === 'End') v = first ? hi : n; else return;
      e.preventDefault();
      idle = performance.now() + 6000;
      if (first) set(Math.max(0, Math.min(hi, v)), hi); else set(lo, Math.max(lo, Math.min(n, v)));
      rest();
    };
    A.addEventListener('keydown', keys(true));
    B.addEventListener('keydown', keys(false));

    write();
    emit(true);
    onSize(area, (w) => { W = w; sa.t = pos(lo); sb.t = pos(hi); jump(); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (W) { write(); jump(); } });

    // 갤러리(data-vzb-loop): 화면에 보이는 동안, 손을 대기 전과 손을 뗀 지 6초 뒤부터 몇 가지 범위를 차례로 보여 줍니다.
    if (!reduce && card.closest('[data-vzb-loop]')) {
      const s0 = [lo / n, hi / n], plan = [[0.38, 0.5], [0.42, 0.58], [0.08, 0.46], [0.52, 0.92], s0];
      let k = 0, seen = true;
      if ('IntersectionObserver' in window) new IntersectionObserver((es) => { seen = es[es.length - 1].isIntersecting; }).observe(card);
      const timer = setInterval(() => {
        if (!card.isConnected) { clearInterval(timer); return; }
        if (drag || !seen || !W || performance.now() < idle) return;
        const p = plan[k++ % plan.length];
        set(Math.round(p[0] * n), Math.max(Math.round(p[0] * n), Math.round(p[1] * n)));
        rest();
      }, 1700);
    }
  }

  // Range Slider: 숫자 범위를 손잡이 둘로 고르는 컨트롤입니다(금액 · 수량 필터). min과 max 사이를 step 간격으로 고르고
  // (step을 비우면 범위의 1/100에 가까운 1 · 2 · 5와 그 열 배들), 값은 format대로 말풍선에 적습니다. value는 처음 범위 [시작, 끝]이고 비우면 전체입니다.
  // 값이 바뀌면 vzb-change 이벤트의 detail.value로 [시작, 끝] 숫자를 보냅니다(src/slider.js).
  mount('control-range', (card, d, f) => {
    const min = +d.min, max = +d.max;
    if (!fin(d.min) || !fin(d.max) || !(max > min)) throw new Error(tx(d, 'min과 max를 확인하세요.'));
    let step = fin(d.step) && +d.step > 0 ? +d.step : 0;
    if (!step) {
      const raw = (max - min) / 100, p = 10 ** Math.floor(Math.log10(raw)), q = raw / p;
      step = (q < 1.5 ? 1 : q < 3.5 ? 2 : q < 7.5 ? 5 : 10) * p;
    }
    const n = Math.max(1, Math.round((max - min) / step));
    const at = (i) => (i >= n ? max : +(min + i * step).toPrecision(12));
    const seat = (v, or) => (fin(v) ? Math.max(0, Math.min(n, Math.round((+v - min) / step))) : or);
    const v = Array.isArray(d.value) ? d.value : [], a = seat(v[0], 0), b = seat(v[1], n);
    slider(card, d, f, { n, text: (i) => show(f, at(i)), value: at, start: [Math.min(a, b), Math.max(a, b)], aria: [tx(d, '%s 최소', d.title || ''), tx(d, '%s 최대', d.title || '')] });
  });
})();
</script>
