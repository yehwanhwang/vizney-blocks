<style>
@font-face { font-family: 'Vizney Blocks Sans'; font-weight: 400; src: local('Spoqa Han Sans Neo Regular'), url(https://cdn.jsdelivr.net/gh/spoqa/spoqa-han-sans@latest/Subset/SpoqaHanSansNeo/SpoqaHanSansNeo-Regular.woff2) format('woff2'), url(https://cdn.jsdelivr.net/gh/spoqa/spoqa-han-sans@latest/Subset/SpoqaHanSansNeo/SpoqaHanSansNeo-Regular.woff) format('woff'); }

/* Vizney Blocks 토큰: 내 페이지의 :root에 같은 변수를 다시 적으면 모든 카드에 적용됩니다. 카드 코드는 고치지 않습니다.
   내 화면에 맞출 때는 바탕(--vzb-card) · 글자(--vzb-ink) · 강조(--vzb-primary) · 서체(--vzb-font, --vzb-title-*) · 모서리(--vzb-radius*)를 적습니다.
   회색 단계(--vzb-ink-2 · muted · grid · track · other · base)와 배지 · 툴팁 색은 바탕 · 글자 · 뜻 색을 섞어 만들어 함께 따라옵니다. 따로 적으면 적은 값을 씁니다.
   initial로 둔 변수는 비어 있는 것입니다. 비어 있으면 카드가 요소마다 정한 Vizney 모양을 쓰고, 적으면 그 묶음 전체가 그 값을 씁니다.
   색은 Vizney의 Figma 팔레트에서 고릅니다. 데이터는 파랑(#007aff) · 분홍빨강(#ff2d55) · 주황(#ff9500), 좋고 나쁨은 초록(#34c759) · 빨강(#ff3b30)입니다.
   JSON에 "theme": "dark"를 적으면 아래 .vzb-dark 값으로 Vizney 검정 바탕에 노랑을 첫째 색으로 그립니다.
   목록: https://blocks.vizney.com/ko/tokens.css */
:where(:root) {
  /* 글꼴. Vizney Blocks Sans는 카드에 든 @font-face의 이름입니다(Spoqa Han Sans Neo 파일). 브라우저는 이 이름으로 그리는 글자가 있을 때만 파일을 받으므로,
     --vzb-font를 바꾸면 카드는 밖으로 아무것도 요청하지 않습니다. */
  --vzb-font: 'Vizney Blocks Sans', 'Spoqa Han Sans Neo', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;   /* 카드의 모든 글자 */
  --vzb-title-font: initial;   /* 차트 카드 제목의 글꼴. 비우면 --vzb-font */
  --vzb-title-size: 17px;   /* 제목 크기. 12px보다 작게 적어도 12px로 그립니다 */
  --vzb-title-weight: 500;   /* 제목 굵기 */
  --vzb-title-case: none;   /* 제목 대소문자(text-transform). uppercase면 대문자 */
  --vzb-title-tracking: normal;   /* 제목 자간(letter-spacing). 예: 0.08em */
  --vzb-sub-font: initial;   /* 부제(기간 · 기준)의 글꼴. 비우면 --vzb-font */
  --vzb-sub-size: 14px;   /* 부제 크기. 12px보다 작게 적어도 12px로 그립니다 */
  --vzb-sub-weight: 400;   /* 부제 굵기 */
  --vzb-sub-case: none;   /* 부제 대소문자 */
  --vzb-sub-tracking: normal;   /* 부제 자간 */
  /* 바탕과 글자. 회색 단계는 글자색을 바탕에 섞은 값입니다(괄호 안은 기본값에서 나오는 색). */
  --vzb-card: #ffffff;   /* 카드 바탕. 펼친 창(달력 · 목록 · 분포 창 · 내려받기 메뉴)의 바탕, 고른 칩 · 날짜 위의 글자, 막대 글자의 테두리 */
  --vzb-edge: rgba(17, 24, 39, 0.05);   /* 카드 · 펼친 창 · 입력칸의 테두리 */
  --vzb-ink: #1b1b1b;   /* 제목 · 값 · 대표 수치. 컨트롤에서는 고른 칩 · 날짜, 손잡이, 내려받기 단추의 면 */
  --vzb-ink-2: color-mix(in srgb, var(--vzb-ink) 79.39%, var(--vzb-card));   /* (#4a4a4a) 이름 · 범례 · 고르지 않은 칩의 글자 */
  --vzb-muted: color-mix(in srgb, var(--vzb-ink) 61.4%, var(--vzb-card));   /* (#737373) 부제 · 단위 · 축 눈금 · 옅은 이름, Waterfall의 잇는 점 */
  --vzb-grid: color-mix(in srgb, var(--vzb-ink) 8.77%, var(--vzb-card));   /* (#ebebeb) 바닥선 */
  --vzb-track: color-mix(in srgb, var(--vzb-ink) 6.14%, var(--vzb-card));   /* (#f1f1f1) 옅은 면: 칩 · 단추 · 날짜 단추의 면, 다시 보기 단추, 말풍선 바탕, 짚은 줄의 띠 */
  --vzb-other: color-mix(in srgb, var(--vzb-ink) 16.67%, var(--vzb-card));   /* (#d9d9d9) 마우스를 올린 면, 슬라이더 레일 · 분포 막대, 구간 막대 */
  --vzb-base: color-mix(in srgb, var(--vzb-ink) 25.88%, var(--vzb-card));   /* (#c4c4c4) 기준 막대: Waterfall 합계 막대, Bar Overflow 한도 아래 막대 */
  /* 데이터 색 */
  --vzb-primary: #007aff;   /* 첫째 데이터 색(파랑): 짚을 항목, Funnel의 물, Waffle의 짚을 칸, Bump의 짚을 선. 포커스 링도 이 색(--vzb-focus를 비웠을 때) */
  --vzb-secondary: #ff2d55;   /* 둘째 데이터 색(분홍빨강): Butterfly의 왼쪽 그룹 */
  --vzb-tertiary: #ff9500;   /* 셋째 데이터 색(주황) */
  /* 뜻 색. good · bad는 증감의 좋고 나쁨만, alert는 주의(한도 초과 · 입력 오류 · 오류 문구)만 칠합니다. 감소를 회색으로 바꿔도 한도 초과는 빨강으로 남습니다.
     -tint(배지 바탕)와 -ink(글자)는 면 색을 바탕 · 글자색에 섞어 따라옵니다. */
  --vzb-good: #34c759;   /* 좋아진 증감의 면: Waterfall의 늘린 막대. 팔레트 초록. 흰 바탕 대비 2.2:1로 옅어 글자에는 쓰지 않습니다 */
  --vzb-good-tint: color-mix(in srgb, var(--vzb-good) 10.04%, var(--vzb-card));   /* (#ebf9ee) 좋은 증감 배지의 바탕 */
  --vzb-good-ink: color-mix(in srgb, var(--vzb-good) 58.97%, var(--vzb-ink));   /* (#2a8040) 좋은 증감의 글자(배지, 말풍선). 흰 바탕 대비 4.9:1 */
  --vzb-bad: #ff3b30;   /* 나빠진 증감의 면: Waterfall의 줄인 막대. 팔레트 빨강 */
  --vzb-bad-tint: color-mix(in srgb, var(--vzb-bad) 10.17%, var(--vzb-card));   /* (#ffebea) 나쁜 증감 배지의 바탕 */
  --vzb-bad-ink: color-mix(in srgb, var(--vzb-bad) 77.3%, var(--vzb-ink));   /* (#cb342b) 나쁜 증감의 글자. 흰 바탕 대비 5.2:1 */
  --vzb-alert: #ff3b30;   /* 주의의 면: Bar Overflow의 넘친 구간과 견본, 잘못 친 날짜의 테두리. 팔레트 빨강 */
  --vzb-alert-ink: color-mix(in srgb, var(--vzb-alert) 77.3%, var(--vzb-ink));   /* (#cb342b) 주의의 글자: 넘친 양, 오류 문구 */
  /* 툴팁과 포커스 */
  --vzb-tip: var(--vzb-ink);   /* (#1b1b1b) 툴팁 바탕 */
  --vzb-tip-ink: var(--vzb-card);   /* (#ffffff) 툴팁 글자. 이름과 설명은 이 색의 72% */
  --vzb-focus: initial;   /* 키보드 포커스 링. 비우면 --vzb-primary. 강조색이 바탕과 비슷하면(흰 바탕의 라임) 따로 적습니다 */
  /* 모양 */
  --vzb-radius: 18px;   /* 카드 모서리. 떠 있는 창(툴팁 8 · 달력 · 목록 16 · 분포 창 12)과 포커스 테두리(4)는 이 값과 제 값 중 작은 쪽 */
  --vzb-radius-mark: initial;   /* 데이터 표시의 모서리: 막대 끝(4), 와플 칸(2), 말풍선(7), 비율 알약(12), 증감 배지(7), 짚은 줄의 띠(4), 범례 견본(2 · 3). 0이면 모두 각지게 */
  --vzb-radius-control: initial;   /* 조작부의 모서리: 칩 · 날짜 · 목록 단추(알약), 아이콘 단추와 손잡이(원), 입력칸(10), 기간 단추, 날짜 칸, 목록 줄. 0이면 모두 각지게 */
  --vzb-unit: 168px;   /* 높이 1단위. 차트 카드의 높이는 1 · 1.5 · 2단위 가운데 하나입니다 */
  --vzb-shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 18px 40px -22px rgba(17, 24, 39, 0.22);   /* 카드 그림자. none이면 없음 */
  --vzb-shadow-float: initial;   /* 떠 있는 창(툴팁 · 달력 · 목록 · 분포 창 · 내려받기 메뉴)의 그림자. 비우면 요소마다 Vizney 그림자, none이면 없음 */
  /* 움직임. 무엇이 움직이느냐에 따라 값이 정해집니다. 스프링은 '세기 잦아듦' 두 숫자로 적습니다(세기가 클수록 빠르고, 잦아듦이 작을수록 더 튑니다).
     손이 닿는 것: Follow · Settle · Pop · Fade · Press. 값을 나타내는 것: Move(넘치지 않습니다. 높이나 자리가 곧 값이라, 튀면 잠깐 틀린 값을 보입니다).
     리듬: Lead · Seq · Rest. 카드 밖의 요소(KPI 타일, 표, 탭)도 같은 값으로 움직이면 화면이 한 손으로 만든 것처럼 보입니다. */
  --vzb-follow: 1000 63;   /* Follow: 끄는 동안 손에 붙어 따라갑니다(슬라이더 손잡이). 넘침 없음 */
  --vzb-settle: 340 26;   /* Settle: 놓이거나 열리거나 넓어질 때 자리를 잡습니다(달력 · 목록 · 메뉴 · 굴러가는 숫자). 넘침 4% */
  --vzb-pop: 520 21;   /* Pop: 눌렸다 놓인 단추, 고른 날짜와 칩, 떠오르는 말풍선. 값이 아니므로 튑니다. 넘침 20% */
  --vzb-move: 200 28.3;   /* Move: 막대 높이처럼 값을 나타내는 것이 제자리로 갑니다. 넘침 없음(잦아듦 = 2√세기) */
  --vzb-fade: 0.14s;   /* Fade: 투명도와 색이 바뀌는 시간. 나타날 때와 사라질 때 같습니다 */
  --vzb-press: 0.08s;   /* Press: 눌리는 순간 들어가는 시간. 놓으면 Pop으로 돌아옵니다 */
  --vzb-lead: 400ms;   /* Lead: 차트 카드가 화면에 들어와 움직이기 전의 뜸 */
  --vzb-seq: 1200ms;   /* Seq: 항목이 차례로 움직일 때의 전체 시간. 항목 수로 나눠 간격을 정합니다 */
  --vzb-rest: 2600ms;   /* Rest: 되풀이하는 카드(갤러리)가 다시 시작하기 전의 쉼 */
  /* 아래 여섯은 위 스프링에서 계산한 CSS 전환의 시간(-t)과 곡선(-e)입니다. 직접 고치지 않습니다. 위 값을 바꾸면 카드가 다시 계산해 씁니다. */
  --vzb-settle-t: 0.39s;
  --vzb-settle-e: linear(0, 0.023, 0.081, 0.164, 0.26, 0.362, 0.463, 0.56, 0.65, 0.731, 0.801, 0.861, 0.91, 0.95, 0.981, 1.005, 1.022, 1.033, 1.04, 1.043, 1.044, 1.042, 1.039, 1.036, 1.031, 1.027, 1.022, 1.018, 1.014, 1.011, 1.008, 1.005, 1);
  --vzb-pop-t: 0.52s;
  --vzb-pop-e: linear(0, 0.061, 0.212, 0.41, 0.619, 0.811, 0.969, 1.085, 1.158, 1.192, 1.193, 1.172, 1.138, 1.097, 1.057, 1.022, 0.995, 0.976, 0.965, 0.962, 0.963, 0.969, 0.977, 0.985, 0.992, 0.998, 1.003, 1.006, 1.007, 1.007, 1.007, 1.005, 1);
  --vzb-move-t: 0.54s;
  --vzb-move-e: linear(0, 0.024, 0.083, 0.161, 0.248, 0.335, 0.419, 0.498, 0.569, 0.633, 0.689, 0.737, 0.78, 0.816, 0.846, 0.872, 0.894, 0.913, 0.928, 0.941, 0.951, 0.96, 0.967, 0.973, 0.978, 0.982, 0.985, 0.988, 0.99, 0.992, 0.994, 0.995, 1);
}

/* 어두운 바탕("theme": "dark"): Vizney 검정 바탕을 고르는 값이라, 같은 변수를 카드 안에서 다시 정합니다. 그래서 :root에 적은 색은 이 카드에 닿지 않습니다.
   내 화면에 맞출 때는 어두운 화면이라도 theme을 비우고 :root에 바탕 · 글자 · 강조색을 적습니다. 이 블록을 고치려면 페이지에 .vzb-dark { … }를 적습니다(:where라 페이지 쪽이 이깁니다).
   노랑 · 흰색 · 회색은 색각 시뮬레이션(가장 가까운 쌍 ΔE 14.9)과 바탕 대비 검사를 통과합니다.
   좋고 나쁨은 밝은 바탕과 같은 초록(#34c759) · 빨강(#ff3b30)이고, 검정 바탕에서는 글자에도 그대로 씁니다(대비 7.8:1 · 4.9:1). */
:where(.vzb-dark) {
  --vzb-card: #1b1b1b;   /* 카드 바탕(Vizney 검정) */
  --vzb-edge: rgba(255, 255, 255, 0.08);   /* 카드 테두리 */
  --vzb-ink: #f5f5f5;   /* 제목과 대표 수치 */
  --vzb-ink-2: color-mix(in srgb, var(--vzb-ink) 82.57%, var(--vzb-card));   /* (#cfcfcf) 본문 글자 */
  --vzb-muted: color-mix(in srgb, var(--vzb-ink) 58.72%, var(--vzb-card));   /* (#9b9b9b) 부제, 단위, 축 눈금 */
  --vzb-grid: color-mix(in srgb, var(--vzb-ink) 9.17%, var(--vzb-card));   /* (#2f2f2f) 바닥선 */
  --vzb-track: color-mix(in srgb, var(--vzb-ink) 7.8%, var(--vzb-card));   /* (#2c2c2c) 옅은 면 */
  --vzb-other: color-mix(in srgb, var(--vzb-ink) 22.94%, var(--vzb-card));   /* (#4d4d4d) 마우스를 올린 면, 레일 */
  --vzb-base: color-mix(in srgb, var(--vzb-ink) 36.7%, var(--vzb-card));   /* (#6b6b6b) 기준 막대 */
  --vzb-primary: #ffcc00;   /* 첫째 데이터 색(Vizney 노랑) */
  --vzb-secondary: #f5f5f5;   /* 둘째 데이터 색(흰색) */
  --vzb-tertiary: #9b9b9b;   /* 셋째 데이터 색(회색) */
  --vzb-good: #34c759;   /* 좋은 증감(팔레트 초록) */
  --vzb-good-tint: color-mix(in srgb, var(--vzb-good) 16.24%, var(--vzb-card));   /* (#1f3725) 좋은 증감 배지의 바탕 */
  --vzb-good-ink: var(--vzb-good);   /* 좋은 증감의 글자 */
  --vzb-bad: #ff3b30;   /* 나쁜 증감(팔레트 빨강) */
  --vzb-bad-tint: color-mix(in srgb, var(--vzb-bad) 8.07%, var(--vzb-card));   /* (#2d1e1d) 나쁜 증감 배지의 바탕(글자 대비 4.5:1을 지키는 만큼) */
  --vzb-bad-ink: var(--vzb-bad);   /* 나쁜 증감의 글자 */
  --vzb-alert: #ff3b30;   /* 주의(팔레트 빨강) */
  --vzb-alert-ink: var(--vzb-alert);   /* 주의의 글자 */
  --vzb-tip: color-mix(in srgb, var(--vzb-ink) 14.22%, var(--vzb-card));   /* (#3a3a3a) 툴팁 바탕 */
  --vzb-tip-ink: #ffffff;   /* 툴팁 글자 */
  --vzb-shadow: none;   /* 카드 그림자 */
}
/* 카드: 놓인 자리를 채웁니다. 폭은 자리의 폭이고, 높이는 1 · 1.5 · 2단위 가운데 하나를 바닥으로(단위 --vzb-unit, 카드마다 자기 CSS에서 정합니다)
   자리가 그보다 높으면 그 높이까지 늘어납니다. 높이가 정해진 요소 안에 두든(100%), 격자 · 플렉스 줄에서 옆 카드에 맞춰 늘어나든 같습니다.

  box-sizing: border-box;
  display: flex;

  background: var(--vzb-card);
  color: var(--vzb-ink);
  border: 1px solid var(--vzb-edge);
  border-radius: var(--vzb-radius);
  box-shadow: var(--vzb-shadow);
  font: 400 14px/20px var(--vzb-font);   /* 글자 크기는 세 단계: 기본 14px, 보조 12px(단위 · 축 눈금 · 요일 · 개수 · 큰 숫자 위 설명), 큰 숫자 18px(말풍선 · 툴팁). 그 밖에 제목 17px, 대표 수치 34px(단위 16px) */
  text-align: left;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
.vzb-card *, .vzb-card *::before, .vzb-card *::after { box-sizing: border-box; }

/* 머리: 제목과 기간 부제, 그 아래 대표 수치와 바로 뒤의 증감 배지.
   배지와 비교 문구는 숫자와 같은 줄의 항목이라, 좁으면 비교 문구만 아래 줄로 내려가고 배지는 숫자 뒤에 남습니다. */

.vzb-title { font-family: var(--vzb-title-font, var(--vzb-font)); font-size: max(12px, var(--vzb-title-size)); line-height: max(24px, calc(var(--vzb-title-size) * 1.3)); font-weight: var(--vzb-title-weight); text-transform: var(--vzb-title-case); letter-spacing: var(--vzb-title-tracking); }

.vzb-num { margin-right: 4px; font-size: 34px; line-height: 40px; font-weight: 400; letter-spacing: -0.02em; white-space: nowrap; }   /* 숫자와 배지 사이 12px, 배지와 비교 문구 사이 8px */

.vzb-vs { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

.vzb-badge.vzb-bad { color: var(--vzb-bad-ink); background: var(--vzb-bad-tint); }

.vzb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* 그래픽은 카드 아래쪽에 붙습니다. 같은 줄의 카드 높이가 맞춰져도 그래픽끼리 바닥이 맞습니다. */

/* Date Picker: 카드 틀 없이 단추만 그립니다. 단추는 높이 40px · 모서리 20px의 알약으로, 트랙 회색 바탕에 달력 아이콘 · 기간(14px, 왼쪽 맞춤) ·
   일수(굴러가는 숫자) · 펼침 표시를 둡니다. 열려 있는 동안은 글자색으로 채웁니다(고른 칩과 같습니다). 바탕과 글자색은 한 번에 바꾸고
   단추 안 글자에도 색을 직접 적어, 어떤 순간에도 글자가 바탕과 같은 색이 되지 않게 합니다.
   단추와 달력은 같은 폭(300px, 놓인 자리가 더 좁으면 그 폭)이라 기간이 바뀌어도 단추가 늘고 줄지 않습니다.

   띠는 앞머리가 칸을 차례로 지나며 그어지고(스크립트가 칸마다 --vzb-d만큼 늦게 시작해 --vzb-t 동안 긋게 정합니다), 지울 때는 흐려지며 사라집니다.

/* 컨트롤은 카드 머리(제목 · 부제)와 카드 틀(바탕 · 테두리 · 그림자 · 안쪽 여백) 없이 조작부만 그립니다. 차트 위 필터 줄이나 머리글처럼
   원하는 자리에 그대로 놓는 부품이기 때문입니다. 폭은 놓인 자리를 채우고, 높이는 조작부 자체의 높이입니다.

.vzb-dp-anchor { position: relative; flex: none; width: 300px; max-width: 100%; }
.vzb-dp-btn { display: flex; align-items: center; gap: 8px; box-sizing: border-box; width: 100%; height: 40px; padding: 0 12px 0 14px; border: 0; border-radius: var(--vzb-radius-control, 20px); background: var(--vzb-track); color: var(--vzb-ink); font: 600 14px/1 var(--vzb-font); white-space: nowrap; overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform var(--vzb-pop-t) var(--vzb-pop-e); }

.vzb-dp-btn:active { transform: scale(0.97); transition-duration: var(--vzb-press); }
.vzb-dp-btn:focus-visible { outline: 2px solid var(--vzb-focus, var(--vzb-primary)); outline-offset: 2px; }
.vzb-dp-ic { flex: none; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
.vzb-dp-val { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.vzb-dp-tx { font-variant-numeric: tabular-nums; }
.vzb-dp-n { flex: none; display: inline-flex; align-items: baseline; padding: 3px 7px; border-radius: min(var(--vzb-radius-control, 10px), 10px); background: color-mix(in srgb, var(--vzb-ink) 10%, transparent); font-size: 12px; font-weight: 700; line-height: 1.2em; }

.vzb-dp-pop { position: absolute; left: 0; top: calc(100% + 8px); z-index: 3; box-sizing: border-box; width: 100%; padding: 12px 12px 10px; border: 1px solid var(--vzb-edge); border-radius: min(var(--vzb-radius), 16px); background: var(--vzb-card); box-shadow: var(--vzb-shadow-float, 0 12px 32px rgba(27, 27, 27, 0.18)); color: var(--vzb-ink); opacity: 0; visibility: hidden; transform: translateY(-6px) scale(0.97); transform-origin: 50% 0; transition: opacity var(--vzb-fade), transform var(--vzb-fade) ease-in, visibility 0s var(--vzb-fade); }

.vzb-dp.is-open .vzb-dp-pop { opacity: 1; visibility: visible; transform: none; transition: opacity var(--vzb-fade), transform var(--vzb-settle-t) var(--vzb-settle-e), visibility 0s; }
.vzb-dp-fields { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.vzb-dp-in { flex: 1 1 0; min-width: 0; box-sizing: border-box; height: 36px; padding: 0 10px; border: 1px solid var(--vzb-edge); border-radius: var(--vzb-radius-control, 10px); background: var(--vzb-card); color: var(--vzb-ink); font: 500 14px/1 var(--vzb-font); font-variant-numeric: tabular-nums; outline: none; transition: border-color var(--vzb-fade), box-shadow var(--vzb-fade); }
.vzb-dp-in::placeholder { color: var(--vzb-muted); }
.vzb-dp-in:hover { border-color: color-mix(in srgb, var(--vzb-ink) 30%, transparent); }
.vzb-dp-in:focus { border-color: var(--vzb-ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--vzb-ink) 14%, transparent); }
.vzb-dp-in.is-bad { border-color: var(--vzb-alert); box-shadow: 0 0 0 3px color-mix(in srgb, var(--vzb-alert) 18%, transparent); }   /* 읽을 수 없거나 고를 수 없는 날짜 */
.vzb-dp-dash { flex: none; font-size: 14px; color: var(--vzb-muted); }
.vzb-dp-hd { display: flex; align-items: center; gap: 2px; height: 30px; margin-bottom: 2px; }
.vzb-dp-title { flex: 0 1 auto; display: inline-flex; align-items: center; gap: 4px; min-width: 0; height: 30px; margin-right: auto; padding: 0 8px; border: 0; border-radius: var(--vzb-radius-control, 8px); background: none; color: var(--vzb-ink); font: 700 14px/1 var(--vzb-font); white-space: nowrap; cursor: pointer; transition: background-color var(--vzb-fade), transform var(--vzb-pop-t) var(--vzb-pop-e); }
.vzb-dp-title:hover { background: var(--vzb-track); }
.vzb-dp-title:active { transform: scale(0.96); transition-duration: var(--vzb-fade), var(--vzb-press); }
.vzb-dp-title:focus-visible { outline: 2px solid var(--vzb-focus, var(--vzb-primary)); outline-offset: 1px; }
.vzb-dp-ttx { overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.vzb-dp-tchev { flex: none; width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: transform var(--vzb-pop-t) var(--vzb-pop-e); }
.vzb-dp-title.is-alt .vzb-dp-tchev { transform: rotate(180deg); }
.vzb-dp-nav { flex: none; display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: var(--vzb-radius-control, 50%); background: none; color: var(--vzb-ink); cursor: pointer; transition: background-color var(--vzb-fade), transform var(--vzb-pop-t) var(--vzb-pop-e); }
.vzb-dp-nav:hover { background: var(--vzb-track); }
.vzb-dp-nav:active, .vzb-dp-nav.is-press { transform: scale(0.86); transition-duration: var(--vzb-fade), var(--vzb-press); }
.vzb-dp-nav:disabled { opacity: 0.3; cursor: default; background: none; transform: none; }

.vzb-dp-wk { display: grid; grid-template-columns: repeat(7, 1fr); height: 20px; align-items: center; text-align: center; font-size: 12px; font-weight: 500; color: var(--vzb-muted); }
.vzb-dp-body { position: relative; }
.vzb-dp-view { position: relative; overflow: hidden; }
.vzb-dp-grid { display: grid; grid-auto-rows: 1fr; height: 180px; }
.vzb-dp-alt { position: absolute; inset: 0; z-index: 2; background: var(--vzb-card); }

.vzb-dp-mon { min-width: 0; padding: 0; border: 0; border-radius: var(--vzb-radius-control, 12px); background: none; color: var(--vzb-ink); font: 500 14px/1 var(--vzb-font); font-variant-numeric: tabular-nums; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color var(--vzb-fade), color var(--vzb-fade), transform var(--vzb-pop-t) var(--vzb-pop-e); }
.vzb-dp-mon:hover { background: var(--vzb-track); }
.vzb-dp-mon.is-sel { background: color-mix(in srgb, var(--vzb-ink) 12%, transparent); font-weight: 700; }   /* 고른 기간이 걸친 달 · 해 */
.vzb-dp-mon.is-cur { box-shadow: inset 0 0 0 1.5px var(--vzb-ink); }   /* 지금 달력의 달 · 해 */
.vzb-dp-mon:active { transform: scale(0.94); transition-duration: var(--vzb-fade), var(--vzb-fade), var(--vzb-press); }
.vzb-dp-mon:disabled { opacity: 0.32; cursor: default; background: none; transform: none; }
.vzb-dp-mon:focus-visible { outline: 2px solid var(--vzb-focus, var(--vzb-primary)); outline-offset: 1px; }
.vzb-dp-grid.is-gone { position: absolute; left: 0; top: 0; width: 100%; pointer-events: none; }
.vzb-dp-row { display: grid; grid-template-columns: repeat(7, 1fr); }
.vzb-dp-cell { position: relative; display: grid; place-items: center; }
.vzb-dp-cell::before { content: ''; position: absolute; left: 0; right: 0; top: 2px; bottom: 2px; background: color-mix(in srgb, var(--vzb-ink) 12%, transparent); opacity: 0; transform: scaleX(0); transform-origin: 0 50%; transition: opacity var(--vzb-fade) ease-out, transform 0s var(--vzb-fade); }
.vzb-dp-cell.is-in::before { opacity: 1; transform: none; transition: transform var(--vzb-t, 0ms) linear var(--vzb-d, 0ms), opacity 0s var(--vzb-d, 0ms); }
.vzb-dp-cell.is-pv::before { background: color-mix(in srgb, var(--vzb-ink) 7%, transparent); }

    const mShort = new Intl.DateTimeFormat(loc, { month: en ? 'short' : 'long', timeZone: 'UTC' });
    function showAlt(next, dir, keys) {
      const was = mode;
      mode = next;
      if (next === 'day') {
        alt.hidden = true;
        alt.replaceChildren();
        heading(0);
        if (was !== 'day' && view.animate) view.animate([{ opacity: 0, transform: 'scale(1.06)' }, { opacity: 1, transform: 'none' }], { duration: 240, easing: 'ease-out' });
        if (keys) focusOn(clamp(Math.min(Math.max(fday, cur.first), cur.last)));
        return;
      }
      const g = el('div', 'vzb-dp-mgrid'), items = [];
      g.setAttribute('role', 'grid');
      const curY = parts(cur.first).y;
      for (let k = 0; k < 12; k++) {
        const a = next === 'month' ? at(yr, k, 1) : at(yr0 + k, 0, 1), b = next === 'month' ? at(yr, k + 1, 0) : at(yr0 + k + 1, 0, 0);
        const btnK = el('button', 'vzb-dp-mon', next === 'month' ? mShort.format(D(a)) : yearFmt.format(D(a)));
        btnK.type = 'button';
        btnK.tabIndex = -1;
        btnK.disabled = b < min || a > max;
        btnK.classList.toggle('is-sel', !one ? b >= lo && a <= hi : lo >= a && lo <= b);
        btnK.classList.toggle('is-cur', next === 'month' ? cur.month === yr * 12 + k : curY === yr0 + k);
        btnK.setAttribute('aria-label', next === 'month' ? monthFmt.format(D(a)) : yearFmt.format(D(a)));
        btnK.addEventListener('click', () => {
          if (next === 'month') { const mo = yr * 12 + k; if (mo !== cur.month) turn(mo, 0); showAlt('day', 0, btnK.matches(':focus-visible')); }
          else { yr = yr0 + k; showAlt('month', 0, btnK.matches(':focus-visible')); }
        });
        items.push(btnK);
        g.append(btnK);
      }
      const home = items.find((x) => x.classList.contains('is-cur') && !x.disabled) || items.find((x) => !x.disabled);
      if (home) home.tabIndex = 0;
      g.addEventListener('keydown', (e) => {
        const i = items.indexOf(e.target);
        if (i < 0) return;
        const by = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -3, ArrowDown: 3 }[e.key];
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); showAlt(mode === 'year' ? 'month' : 'day', 0, true); return; }
        if (!by) return;
        e.preventDefault();
        let j = i + by;
        while (j >= 0 && j < 12 && items[j].disabled) j += Math.sign(by);
        if (j < 0 || j > 11) { nav(Math.sign(by)); return; }
        items.forEach((x) => { x.tabIndex = -1; });
        items[j].tabIndex = 0;
        items[j].focus();
      });
      alt.replaceChildren(g);
      alt.hidden = false;
      heading(dir);
      if (g.animate) g.animate(dir ? [{ opacity: 0, transform: `translateX(${dir * 24}px)` }, { opacity: 1, transform: 'none' }] : [{ opacity: 0, transform: was === 'day' || (was === 'year' && next === 'month') ? 'scale(0.94)' : 'scale(1.06)' }, { opacity: 1, transform: 'none' }], { duration: 240, easing: 'ease-out' });
      if (keys && home) home.focus();
    }
    const goMonth = (n) => { const mo = monthOf(n); if (!cur || mo !== cur.month) turn(mo, cur ? Math.sign(mo - cur.month) : 0); };

    // 단추의 글자: 바뀌면 흐려지며 바뀌고, 단추 폭이 새 글자에 맞춰 용수철처럼 늘고 줄며, 일수가 굴러갑니다.
    // 단추의 글자: 폭이 정해진 단추에 들어가는 가장 긴 표기를 고릅니다(연도까지 → 기준일과 같은 해면 연도 없이 → 숫자 날짜).
    function fitText() {
      const yr = parts(anchor).y, tries = [spanText(fmt, lo, hi)];
      if (parts(lo).y === yr && parts(hi).y === yr) tries.push(spanText(noYear, lo, hi));
      tries.push(spanText(short, lo, hi));
      for (const t of tries) {
        txt.textContent = t;
        if (!val.clientWidth || val.scrollWidth <= val.clientWidth) break;   // 마지막 표기도 넘치면 말줄임표로 줄입니다
      }
    }
    // 기간이 바뀌면 새 기간이 살짝 떠오르며 나타나고 일수가 굴러갑니다. 단추의 폭과 색은 그대로라 글자는 늘 바탕과 대비됩니다.
    function label(anim) {
      const n = hi - lo + 1;
      btn.setAttribute('aria-label', `${name}: ${valueText()}`);
      if (!one) { roll(cntNum, num(n, 0)); cntUnit.textContent = en ? ` ${unitOf(n)}` : unitOf(n); }
      fitText();   // 일수의 자릿수가 바뀌면 글자 자리도 바뀌므로 일수를 먼저 적습니다
      syncIn();
      if (anim && val.animate) val.animate([{ opacity: 0.4, transform: 'translateY(5px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'ease-out' });   // 투명에서 시작하지 않아 어느 순간에도 글자가 읽힙니다
    }
    // 입력칸: 정한 기간을 YYYY-MM-DD로 적어 둡니다(치고 있는 칸은 건드리지 않습니다).
    function syncIn(force) {
      [[inLo, lo], [inHi, hi]].forEach(([i, n]) => {
        if (!i || (!force && document.activeElement === i)) return;
        i.value = iso(n);
        i.classList.remove('is-bad');
        i.removeAttribute('aria-invalid');
      });
    }
    // 친 날짜 적용: 둘 다 읽히고 min · max 안이면 기간으로 정하고(거꾸로 치면 바꿉니다) 그 달을 보여 줍니다.
    // 읽히지 않거나 고를 수 없는 날짜는 그 칸을 빨간 테두리로 두고 적용하지 않습니다. close면 적용한 뒤 닫습니다.
    function applyTyped(close) {
      const a = typed(inLo.value), b = inHi ? typed(inHi.value) : a;
      const bad = (n) => n == null || n < min || n > max;
      [[inLo, a], [inHi, b]].forEach(([i, n]) => { if (!i) return; i.classList.toggle('is-bad', bad(n)); if (bad(n)) i.setAttribute('aria-invalid', 'true'); else i.removeAttribute('aria-invalid'); });
      if (bad(a) || bad(b)) { say.textContent = tx(d, '날짜를 YYYY-MM-DD로, 고를 수 있는 날짜 안에서 적으세요.'); return; }
      const x = Math.min(a, b), y = Math.max(a, b), changed = x !== lo || y !== hi;
      pend = null;
      hov = null;
      if (mode !== 'day') showAlt('day', 0);
      goMonth(y);
      lo = x;
      hi = y;
      fday = hi;
      paint(changed ? 'sweep' : null);
      label(changed);
      syncIn(true);
      if (changed) emit();
      if (close && !loop) closeT = setTimeout(() => { setOpen(false); btn.focus(); }, changed ? 520 : 0);
    }
    function emit(quiet) {
      const value = one ? iso(lo) : [iso(lo), iso(hi)];
      card.setAttribute('data-vzb-value', JSON.stringify(value));
      if (quiet) return;
      say.textContent = tx(d, '%s 고름', valueText());
      card.dispatchEvent(new CustomEvent('vzb-change', { bubbles: true, detail: { name: d.name || '', value } }));
    }

    // 열고 닫기: 아래에 달력이 들어갈 자리가 없고 위가 더 넓으면 위로 엽니다(달력은 단추와 같은 폭이라 옆으로 넘치지 않습니다).
    let open = false, closeT = 0;
    const loop = !!card.closest('[data-vzb-loop]');
    function place() {
      const r = btn.getBoundingClientRect(), vh = window.innerHeight || document.documentElement.clientHeight;
      const ph = pop.offsetHeight;
      const below = vh - r.bottom - 8, above = r.top - 8;
      root.classList.toggle('is-up', below < ph + 8 && above > below);
    }
    function setOpen(v, focusDay) {
      clearTimeout(closeT);
      if (open !== v) {
        open = v;
        if (v) { fday = hi; if (cur.month !== monthOf(hi)) turn(monthOf(hi), 0); syncIn(true); place(); }   // 끝일이 든 달을 엽니다
        else { pend = null; hov = null; if (mode !== 'day') showAlt('day', 0); }
        root.classList.toggle('is-open', v);
        btn.setAttribute('aria-expanded', String(v));
        paint(v ? 'sweep' : null);
      }
      if (v && focusDay) focusOn(fday);
    }
    function focusOn(n) {
      n = clamp(n);
      goMonth(n);
      fday = n;
      if (pend != null) hov = n;
      paint();
      const x = cur.list.find((c) => c.n === n && c.inM);
      if (x) x.b.focus();
    }
    function commit(a, b) {
      const changed = a !== lo || b !== hi;
      lo = a;
      hi = b;
      pend = null;
      hov = null;
      fday = hi;
      paint('sweep');
      label(changed);
      if (changed) emit();
      if (!loop) closeT = setTimeout(() => { const inside = root.contains(document.activeElement); setOpen(false); if (inside) btn.focus(); }, 560);   // 띠가 다 그어진 뒤 닫습니다
    }
    function pick(n) {
      if (one) { commit(n, n); return; }
      if (pend == null) { pend = n; hov = n; paint(); return; }
      commit(Math.min(pend, n), Math.max(pend, n));
    }
    function usePreset(i) {
      const p = pre[i];
      if (!p) return;
      pend = null;
      hov = null;
      goMonth(p.b);
      commit(p.a, p.b);
    }
    function nav(dir) {
      if (!cur || (dir < 0 ? prevB : nextB).disabled) return;
      if (mode === 'month') { yr += dir; showAlt('month', dir); return; }
      if (mode === 'year') { yr0 += 12 * dir; showAlt('year', dir); return; }
      turn(cur.month + dir, dir);
    }

    // 손으로 하는 조작
    let idle = 0;
    const touch = () => { idle = performance.now() + 6000; };
    root.addEventListener('pointerdown', touch);
    root.addEventListener('keydown', touch);
    btn.addEventListener('click', (e) => { setOpen(!open, e.detail === 0); });   // detail 0: 키보드로 누름
    btn.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown') { e.preventDefault(); setOpen(true, true); } });
    title.addEventListener('click', (e) => {
      const keys = e.detail === 0;
      if (mode === 'day') { yr = parts(cur.first).y; showAlt('month', 0, keys); }
      else if (mode === 'month') { yr0 = yr - 7; showAlt('year', 0, keys); }   // 열두 해는 지난 해 쪽을 더 보여 줍니다(데이터는 대개 과거)
      else showAlt('day', 0, keys);
    });
    // 입력칸: Enter로 적용하고 닫습니다. 시작일을 치고 Tab으로 끝일로 넘어갈 때는 아직 적용하지 않고, 두 칸 밖으로 나갈 때 적용합니다
    // (시작일만 먼저 바꾸다 옛 끝일과 엇갈려 기간이 뒤집히지 않게 하기 위해서입니다).
    let typedAt = '';
    const typedNow = () => `${inLo.value}|${inHi ? inHi.value : ''}`;
    [inLo, inHi].forEach((i) => {
      if (!i) return;
      i.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); typedAt = typedNow(); applyTyped(true); } });
      i.addEventListener('focus', () => i.select());
    });
    fields.addEventListener('focusin', (e) => { if (!(e.relatedTarget && fields.contains(e.relatedTarget))) typedAt = typedNow(); });
    fields.addEventListener('focusout', (e) => {
      if (e.relatedTarget && fields.contains(e.relatedTarget)) return;
      if (open && typedNow() !== typedAt) applyTyped(false);
    });
    prevB.addEventListener('click', () => nav(-1));
    nextB.addEventListener('click', () => nav(1));
    chips.forEach((c, i) => c.addEventListener('click', () => usePreset(i)));
    view.addEventListener('click', (e) => {
      const b = e.target.closest('.vzb-dp-day');
      if (!b || b.disabled) return;
      fday = +b.dataset.n;
      pick(+b.dataset.n);
    });
    view.addEventListener('pointerover', (e) => {
      const b = e.target.closest('.vzb-dp-day');
      if (!b || b.disabled || pend == null || hov === +b.dataset.n) return;
      hov = +b.dataset.n;
      paint();
    });
    view.addEventListener('focusin', (e) => {
      const b = e.target.closest('.vzb-dp-day');
      if (!b || pend == null || hov === +b.dataset.n) return;
      hov = +b.dataset.n;
      paint();
    });
    view.addEventListener('keydown', (e) => {
      const b = e.target.closest('.vzb-dp-day');
      if (!b) return;
      const n = +b.dataset.n, p = parts(n);
      let to = null;
      if (e.key === 'ArrowLeft') to = n - 1;
      else if (e.key === 'ArrowRight') to = n + 1;
      else if (e.key === 'ArrowUp') to = n - 7;
      else if (e.key === 'ArrowDown') to = n + 7;
      else if (e.key === 'Home') to = n - p.w;
      else if (e.key === 'End') to = n + 6 - p.w;
      else if (e.key === 'PageUp' || e.key === 'PageDown') {
        const k = (e.key === 'PageUp' ? -1 : 1) * (e.shiftKey ? 12 : 1);
        to = Math.min(at(p.y, p.m + k, 1) + p.d - 1, at(p.y, p.m + k + 1, 0));
      } else return;
      e.preventDefault();
      focusOn(to);
    });
    root.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape' || !open) return;
      e.preventDefault();
      setOpen(false);
      btn.focus();
    });
    root.addEventListener('focusout', (e) => { if (open && e.relatedTarget && !root.contains(e.relatedTarget)) setOpen(false); });
    document.addEventListener('pointerdown', function away(e) {
      if (!card.isConnected) { document.removeEventListener('pointerdown', away, true); return; }
      if (open && !root.contains(e.target)) setOpen(false);
    }, true);

    goMonth(hi);
    label(false);
    emit(true);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (card.isConnected) label(false); });
    onSize(val, () => fitText());   // 놓인 자리가 좁아지거나 일수의 자릿수가 바뀌어 글자 자리가 줄면 표기를 다시 고릅니다

    // 갤러리(data-vzb-loop): 화면에 보이는 동안 달력을 연 채로 두고, 손을 대기 전과 손을 뗀 지 6초 뒤부터 고르기를 차례로 보여 줍니다.
    // 닫힌 단추에서 시작해 달력을 열고 → (연 달이 시작일의 달과 다르면) 다음 달 → 시작일을 누르고 → 끝일까지 띠가 따라오다 누르고 →
    // 빠른 선택 → 이전 달 → 마지막 빠른 선택 → 닫기. 갤러리는 닫힌 단추를 타일 가운데에 두고, 열면 달력과 함께 위로 올라가게 그립니다(사이트 CSS).
    if (loop) {
      let seen = true, k = 0, walkT = 0;
      if ('IntersectionObserver' in window) new IntersectionObserver((es) => { seen = es[es.length - 1].isIntersecting; }).observe(card);
      const press = (node) => { if (!node) return; node.classList.add('is-press'); setTimeout(() => node.classList.remove('is-press'), 140); };
      const dayB = (n) => (cur && (cur.list.find((x) => x.n === n) || {}).b) || null;
      const s0 = clamp(anchor - 13), s1 = clamp(anchor - 2);
      const steps = [];
      // 달력은 끝일이 든 달로 열리므로, 시작일이 다른 달에 있으면 그 달로 넘기는 것부터 보여 줍니다(같은 달이면 한 박자 쉽니다).
      steps.push(() => { const to = monthOf(s0); if (cur && cur.month !== to) { const dir = Math.sign(to - cur.month); press(dir > 0 ? nextB : prevB); nav(dir); } });
      if (!one && s1 > s0) {
        steps.push(() => { goMonth(s0); press(dayB(s0)); fday = s0; pick(s0); });
        steps.push(() => {
          let n = s0;
          clearInterval(walkT);
          walkT = setInterval(() => {
            if (!card.isConnected || performance.now() < idle || pend == null) { clearInterval(walkT); return; }
            if (n >= s1) { clearInterval(walkT); press(dayB(s1)); pick(s1); return; }
            n += 1;
            hov = n;
            paint();
          }, 60);
        });
      } else steps.push(() => { const n = clamp(anchor - 3); goMonth(n); press(dayB(n)); pick(n); });
      if (pre.length > 1) steps.push(() => { press(chips[1]); usePreset(1); });
      steps.push(() => { press(prevB); nav(-1); });
      if (pre.length) steps.push(() => { const i = pre.length - 1; press(chips[i]); usePreset(i); });
      steps.push(() => setOpen(false));   // 닫았다가 다음 박자에 다시 엽니다
      const timer = setInterval(() => {
        if (!card.isConnected) { clearInterval(timer); clearInterval(walkT); return; }
        if (!seen || performance.now() < idle) return;
        if (!open) { setOpen(true); return; }
        steps[k++ % steps.length]();
      }, 1500);
    }
  });
})();
</script>
