<style>

/* Vizney Blocks 토큰: 내 페이지의 :root에 같은 변수를 다시 적으면 모든 카드에 적용됩니다. 카드 코드는 고치지 않습니다.
   내 화면에 맞출 때는 바탕(--vzb-card) · 글자(--vzb-ink) · 강조(--vzb-primary) · 서체(--vzb-font, --vzb-title-*) · 모서리(--vzb-radius*)를 적습니다.
   회색 단계(--vzb-ink-2 · muted · grid · track · other · base)와 배지 · 툴팁 색은 바탕 · 글자 · 뜻 색을 섞어 만들어 함께 따라옵니다. 따로 적으면 적은 값을 씁니다.
   initial로 둔 변수는 비어 있는 것입니다. 비어 있으면 카드가 요소마다 정한 Vizney 모양을 쓰고, 적으면 그 묶음 전체가 그 값을 씁니다.
   색은 Vizney의 Figma 팔레트에서 고릅니다. 데이터는 파랑(#007aff) · 분홍빨강(#ff2d55) · 주황(#ff9500), 좋고 나쁨은 초록(#34c759) · 빨강(#ff3b30)입니다.
   JSON에 "theme": "dark"를 적으면 아래 .vzb-dark 값으로 Vizney 검정 바탕에 노랑을 첫째 색으로 그립니다.
   목록: https://blocks.vizney.com/ko/tokens.css */
:where(:root) {
  /* 글꼴. Vizney Blocks Sans는 카드에 든 @font-face의 이름입니다(Spoqa Han Sans Neo 파일). 브라우저는 이 이름으로 그리는 글자가 있을 때만 파일을 받으므로,
     --vzb-font를 바꾸면 카드는 밖으로 아무것도 요청하지 않습니다. */
  --vzb-font: 'Vizney Blocks Sans', 'Spoqa Han Sans Neo', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;   /* 카드의 모든 글자 */
  --vzb-title-font: initial;   /* 차트 카드 제목의 글꼴. 비우면 --vzb-font */
  --vzb-title-size: 17px;   /* 제목 크기. 12px보다 작게 적어도 12px로 그립니다 */
  --vzb-title-weight: 500;   /* 제목 굵기 */
  --vzb-title-case: none;   /* 제목 대소문자(text-transform). uppercase면 대문자 */
  --vzb-title-tracking: normal;   /* 제목 자간(letter-spacing). 예: 0.08em */
  --vzb-sub-font: initial;   /* 부제(기간 · 기준)의 글꼴. 비우면 --vzb-font */
  --vzb-sub-size: 14px;   /* 부제 크기. 12px보다 작게 적어도 12px로 그립니다 */
  --vzb-sub-weight: 400;   /* 부제 굵기 */
  --vzb-sub-case: none;   /* 부제 대소문자 */
  --vzb-sub-tracking: normal;   /* 부제 자간 */
  /* 바탕과 글자. 회색 단계는 글자색을 바탕에 섞은 값입니다(괄호 안은 기본값에서 나오는 색). */
  --vzb-card: #ffffff;   /* 카드 바탕. 펼친 창(달력 · 목록 · 분포 창 · 내려받기 메뉴)의 바탕, 고른 칩 · 날짜 위의 글자, 막대 글자의 테두리 */
  --vzb-edge: rgba(17, 24, 39, 0.05);   /* 카드 · 펼친 창 · 입력칸의 테두리 */
  --vzb-ink: #1b1b1b;   /* 제목 · 값 · 대표 수치. 컨트롤에서는 고른 칩 · 날짜, 손잡이, 내려받기 단추의 면 */
  --vzb-ink-2: color-mix(in srgb, var(--vzb-ink) 79.39%, var(--vzb-card));   /* (#4a4a4a) 이름 · 범례 · 고르지 않은 칩의 글자 */
  --vzb-muted: color-mix(in srgb, var(--vzb-ink) 61.4%, var(--vzb-card));   /* (#737373) 부제 · 단위 · 축 눈금 · 옅은 이름, Waterfall의 잇는 점 */
  --vzb-grid: color-mix(in srgb, var(--vzb-ink) 8.77%, var(--vzb-card));   /* (#ebebeb) 바닥선 */
  --vzb-track: color-mix(in srgb, var(--vzb-ink) 6.14%, var(--vzb-card));   /* (#f1f1f1) 옅은 면: 칩 · 단추 · 날짜 단추의 면, 다시 보기 단추, 말풍선 바탕, 짚은 줄의 띠 */
  --vzb-other: color-mix(in srgb, var(--vzb-ink) 16.67%, var(--vzb-card));   /* (#d9d9d9) 마우스를 올린 면, 슬라이더 레일 · 분포 막대, 구간 막대 */
  --vzb-base: color-mix(in srgb, var(--vzb-ink) 25.88%, var(--vzb-card));   /* (#c4c4c4) 기준 막대: Waterfall 합계 막대, Bar Overflow 한도 아래 막대 */
  /* 데이터 색 */
  --vzb-primary: #007aff;   /* 첫째 데이터 색(파랑): 짚을 항목, Funnel의 물, Waffle의 짚을 칸, Bump의 짚을 선. 포커스 링도 이 색(--vzb-focus를 비웠을 때) */
  --vzb-secondary: #ff2d55;   /* 둘째 데이터 색(분홍빨강): Butterfly의 왼쪽 그룹 */
  --vzb-tertiary: #ff9500;   /* 셋째 데이터 색(주황) */
  /* 뜻 색. good · bad는 증감의 좋고 나쁨만, alert는 주의(한도 초과 · 입력 오류 · 오류 문구)만 칠합니다. 감소를 회색으로 바꿔도 한도 초과는 빨강으로 남습니다.
     -tint(배지 바탕)와 -ink(글자)는 면 색을 바탕 · 글자색에 섞어 따라옵니다. */
  --vzb-good: #34c759;   /* 좋아진 증감의 면: Waterfall의 늘린 막대. 팔레트 초록. 흰 바탕 대비 2.2:1로 옅어 글자에는 쓰지 않습니다 */
  --vzb-good-tint: color-mix(in srgb, var(--vzb-good) 10.04%, var(--vzb-card));   /* (#ebf9ee) 좋은 증감 배지의 바탕 */
  --vzb-good-ink: color-mix(in srgb, var(--vzb-good) 58.97%, var(--vzb-ink));   /* (#2a8040) 좋은 증감의 글자(배지, 말풍선). 흰 바탕 대비 4.9:1 */
  --vzb-bad: #ff3b30;   /* 나빠진 증감의 면: Waterfall의 줄인 막대. 팔레트 빨강 */
  --vzb-bad-tint: color-mix(in srgb, var(--vzb-bad) 10.17%, var(--vzb-card));   /* (#ffebea) 나쁜 증감 배지의 바탕 */
  --vzb-bad-ink: color-mix(in srgb, var(--vzb-bad) 77.3%, var(--vzb-ink));   /* (#cb342b) 나쁜 증감의 글자. 흰 바탕 대비 5.2:1 */
  --vzb-alert: #ff3b30;   /* 주의의 면: Bar Overflow의 넘친 구간과 견본, 잘못 친 날짜의 테두리. 팔레트 빨강 */
  --vzb-alert-ink: color-mix(in srgb, var(--vzb-alert) 77.3%, var(--vzb-ink));   /* (#cb342b) 주의의 글자: 넘친 양, 오류 문구 */
  /* 툴팁과 포커스 */
  --vzb-tip: var(--vzb-ink);   /* (#1b1b1b) 툴팁 바탕 */
  --vzb-tip-ink: var(--vzb-card);   /* (#ffffff) 툴팁 글자. 이름과 설명은 이 색의 72% */
  --vzb-focus: initial;   /* 키보드 포커스 링. 비우면 --vzb-primary. 강조색이 바탕과 비슷하면(흰 바탕의 라임) 따로 적습니다 */
  /* 모양 */
  --vzb-radius: 18px;   /* 카드 모서리. 떠 있는 창(툴팁 8 · 달력 · 목록 16 · 분포 창 12)과 포커스 테두리(4)는 이 값과 제 값 중 작은 쪽 */
  --vzb-radius-mark: initial;   /* 데이터 표시의 모서리: 막대 끝(4), 와플 칸(2), 말풍선(7), 비율 알약(12), 증감 배지(7), 짚은 줄의 띠(4), 범례 견본(2 · 3). 0이면 모두 각지게 */
  --vzb-radius-control: initial;   /* 조작부의 모서리: 칩 · 날짜 · 목록 단추(알약), 아이콘 단추와 손잡이(원), 입력칸(10), 기간 단추, 날짜 칸, 목록 줄. 0이면 모두 각지게 */
  --vzb-unit: 168px;   /* 높이 1단위. 차트 카드의 높이는 1 · 1.5 · 2단위 가운데 하나입니다 */
  --vzb-shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 18px 40px -22px rgba(17, 24, 39, 0.22);   /* 카드 그림자. none이면 없음 */
  --vzb-shadow-float: initial;   /* 떠 있는 창(툴팁 · 달력 · 목록 · 분포 창 · 내려받기 메뉴)의 그림자. 비우면 요소마다 Vizney 그림자, none이면 없음 */
  /* 움직임. 무엇이 움직이느냐에 따라 값이 정해집니다. 스프링은 '세기 잦아듦' 두 숫자로 적습니다(세기가 클수록 빠르고, 잦아듦이 작을수록 더 튑니다).
     손이 닿는 것: Follow · Settle · Pop · Fade · Press. 값을 나타내는 것: Move(넘치지 않습니다. 높이나 자리가 곧 값이라, 튀면 잠깐 틀린 값을 보입니다).
     리듬: Lead · Seq · Rest. 카드 밖의 요소(KPI 타일, 표, 탭)도 같은 값으로 움직이면 화면이 한 손으로 만든 것처럼 보입니다. */
  --vzb-follow: 1000 63;   /* Follow: 끄는 동안 손에 붙어 따라갑니다(슬라이더 손잡이). 넘침 없음 */
  --vzb-settle: 340 26;   /* Settle: 놓이거나 열리거나 넓어질 때 자리를 잡습니다(달력 · 목록 · 메뉴 · 굴러가는 숫자). 넘침 4% */
  --vzb-pop: 520 21;   /* Pop: 눌렸다 놓인 단추, 고른 날짜와 칩, 떠오르는 말풍선. 값이 아니므로 튑니다. 넘침 20% */
  --vzb-move: 200 28.3;   /* Move: 막대 높이처럼 값을 나타내는 것이 제자리로 갑니다. 넘침 없음(잦아듦 = 2√세기) */
  --vzb-fade: 0.14s;   /* Fade: 투명도와 색이 바뀌는 시간. 나타날 때와 사라질 때 같습니다 */
  --vzb-press: 0.08s;   /* Press: 눌리는 순간 들어가는 시간. 놓으면 Pop으로 돌아옵니다 */
  --vzb-lead: 400ms;   /* Lead: 차트 카드가 화면에 들어와 움직이기 전의 뜸 */
  --vzb-seq: 1200ms;   /* Seq: 항목이 차례로 움직일 때의 전체 시간. 항목 수로 나눠 간격을 정합니다 */
  --vzb-rest: 2600ms;   /* Rest: 되풀이하는 카드(갤러리)가 다시 시작하기 전의 쉼 */
  /* 아래 여섯은 위 스프링에서 계산한 CSS 전환의 시간(-t)과 곡선(-e)입니다. 직접 고치지 않습니다. 위 값을 바꾸면 카드가 다시 계산해 씁니다. */
  --vzb-settle-t: 0.39s;
  --vzb-settle-e: linear(0, 0.023, 0.081, 0.164, 0.26, 0.362, 0.463, 0.56, 0.65, 0.731, 0.801, 0.861, 0.91, 0.95, 0.981, 1.005, 1.022, 1.033, 1.04, 1.043, 1.044, 1.042, 1.039, 1.036, 1.031, 1.027, 1.022, 1.018, 1.014, 1.011, 1.008, 1.005, 1);
  --vzb-pop-t: 0.52s;
  --vzb-pop-e: linear(0, 0.061, 0.212, 0.41, 0.619, 0.811, 0.969, 1.085, 1.158, 1.192, 1.193, 1.172, 1.138, 1.097, 1.057, 1.022, 0.995, 0.976, 0.965, 0.962, 0.963, 0.969, 0.977, 0.985, 0.992, 0.998, 1.003, 1.006, 1.007, 1.007, 1.007, 1.005, 1);
  --vzb-move-t: 0.54s;
  --vzb-move-e: linear(0, 0.024, 0.083, 0.161, 0.248, 0.335, 0.419, 0.498, 0.569, 0.633, 0.689, 0.737, 0.78, 0.816, 0.846, 0.872, 0.894, 0.913, 0.928, 0.941, 0.951, 0.96, 0.967, 0.973, 0.978, 0.982, 0.985, 0.988, 0.99, 0.992, 0.994, 0.995, 1);
}

/* 어두운 바탕("theme": "dark"): Vizney 검정 바탕을 고르는 값이라, 같은 변수를 카드 안에서 다시 정합니다. 그래서 :root에 적은 색은 이 카드에 닿지 않습니다.
   내 화면에 맞출 때는 어두운 화면이라도 theme을 비우고 :root에 바탕 · 글자 · 강조색을 적습니다. 이 블록을 고치려면 페이지에 .vzb-dark { … }를 적습니다(:where라 페이지 쪽이 이깁니다).
   노랑 · 흰색 · 회색은 색각 시뮬레이션(가장 가까운 쌍 ΔE 14.9)과 바탕 대비 검사를 통과합니다.
   좋고 나쁨은 밝은 바탕과 같은 초록(#34c759) · 빨강(#ff3b30)이고, 검정 바탕에서는 글자에도 그대로 씁니다(대비 7.8:1 · 4.9:1). */
:where(.vzb-dark) {
  --vzb-card: #1b1b1b;   /* 카드 바탕(Vizney 검정) */
  --vzb-edge: rgba(255, 255, 255, 0.08);   /* 카드 테두리 */
  --vzb-ink: #f5f5f5;   /* 제목과 대표 수치 */
  --vzb-ink-2: color-mix(in srgb, var(--vzb-ink) 82.57%, var(--vzb-card));   /* (#cfcfcf) 본문 글자 */
  --vzb-muted: color-mix(in srgb, var(--vzb-ink) 58.72%, var(--vzb-card));   /* (#9b9b9b) 부제, 단위, 축 눈금 */
  --vzb-grid: color-mix(in srgb, var(--vzb-ink) 9.17%, var(--vzb-card));   /* (#2f2f2f) 바닥선 */
  --vzb-track: color-mix(in srgb, var(--vzb-ink) 7.8%, var(--vzb-card));   /* (#2c2c2c) 옅은 면 */
  --vzb-other: color-mix(in srgb, var(--vzb-ink) 22.94%, var(--vzb-card));   /* (#4d4d4d) 마우스를 올린 면, 레일 */

        if (Math.abs(it.ly.x - it.lt) > 0.3 || Math.abs(it.ly.v) > 4) labBusy = true; else { it.ly.x = it.lt; it.ly.v = 0; }
      });
    }
    function render() {
      if (!W) return;
      const mv = moving, p = mv ? last : pAt(t);
      items.forEach((it) => {
        const ys = (it.ys = mv ? it.sy.map((sp) => (sp ? sp.x : null)) : it.py), e = (it.e = end(ys, p));
        it.path.setAttribute('d', pathTo(ys, p));
        it.g.setAttribute('opacity', fx(it.a));
        it.hd.setAttribute('opacity', e ? 1 : 0);
        it.lab.setAttribute('opacity', e ? 1 : 0);
        if (e) { it.hd.setAttribute('cx', fx(X(e.p))); it.hd.setAttribute('cy', fx(e.v)); it.lt = e.v; } else it.lt = null;
        if (hoverK >= 0 && ys[hoverK] != null) { it.dot.setAttribute('cx', fx(X(hoverK))); it.dot.setAttribute('cy', fx(ys[hoverK])); it.dot.setAttribute('opacity', 1); } else it.dot.setAttribute('opacity', 0);
      });
      gone.forEach((g) => { g.path.setAttribute('d', pathTo(g.ys, last)); g.path.setAttribute('opacity', fx(g.a)); });
      const [a, b] = items;
      if (b && a.e && b.e && Math.abs(a.e.v - b.e.v) < SEP) {
        const mid = (a.e.v + b.e.v) / 2, up = a.e.v < b.e.v || (a.e.v === b.e.v && a === fo) ? a : b, dn = up === a ? b : a;
        const c = Math.max(yT + 6 + SEP / 2, Math.min(y0 - 6 - SEP / 2, mid));
        up.lt = c - SEP / 2; dn.lt = c + SEP / 2;
      }
      items.forEach((it) => {
        if (it.lt == null) return;
        if (!it.ly) it.ly = { x: it.lt, v: 0 };
        it.lab.setAttribute('x', fx(X(it.e.p) + 10));
        it.lab.setAttribute('y', fx(it.ly.x + 5));
      });
      // 엇갈린 자리: 옮겨 가는 동안에는 화면의 두 선이 실제로 만나는 자리, 그 밖에는 값에서 구한 자리입니다. 선이 그 자리를 지난 뒤에 보입니다.
      const cs = !b ? [] : mv ? crossings(a.ys, b.ys) : vCross;
      let note = null;
      cs.forEach((c, i) => {
        const o = ringAt(i), e = end(a.ys, c.p), age = mv ? 1e9 : fresh.has(c.to) ? flashT : t - timeAt(c.p);
        const cx = X(c.p), cy = e ? e.v : 0, k = e ? popAt(age) : 0, u = age / 560;
        o.ring.setAttribute('cx', fx(cx)); o.ring.setAttribute('cy', fx(cy)); o.ring.setAttribute('r', fx(5 * k)); o.ring.setAttribute('opacity', k > 0 ? 1 : 0);
        o.pulse.setAttribute('cx', fx(cx)); o.pulse.setAttribute('cy', fx(cy)); o.pulse.setAttribute('r', fx(5 + 15 * clamp(u)));
        o.pulse.setAttribute('opacity', u > 0 && u < 1 ? fx(0.5 * (1 - u)) : 0);
        if (c.to === pillTo && e) note = { cx, cy, age: mv ? (pillKept ? 1e9 : -1) : pillFresh ? flashT : age };
      });
      for (let i = cs.length; i < rings.length; i++) { rings[i].ring.setAttribute('opacity', 0); rings[i].pulse.setAttribute('opacity', 0); }
      if (note && note.age > 0) {
        const k = popAt(note.age), px = Math.max(pillW / 2, Math.min(W - pillW / 2, note.cx)), top = yT + PILLH;
        noteG.setAttribute('opacity', fx(clamp(note.age / FADE)));
        pillG.setAttribute('transform', `translate(${fx(px)},${fx(top)}) scale(${k.toFixed(3)})`);
        leader.setAttribute('x1', fx(note.cx)); leader.setAttribute('x2', fx(note.cx));
        leader.setAttribute('y1', fx(top + 2)); leader.setAttribute('y2', fx(Math.max(top + 2, note.cy - 7)));
      } else noteG.setAttribute('opacity', 0);
      gridG.setAttribute('opacity', fx(gridA));
      // 머리의 숫자와 배지: 선 끝의 값을 그대로 셉니다. 숫자가 어느 기간의 값인지는 굵게 적은 기간 이름이 알려 줍니다.
      // 배지는 두 선 끝이 같은 기간에 있을 때만 적습니다(한쪽이 먼저 끊겼으면 다른 기간끼리 견주게 되므로 뺍니다).
      const ot = otherOf(fo), fe = end(fo.vals, p), oe = ot && end(ot.vals, p), same = fe && oe && fe.p === oe.p;
      setFig(mv ? fo.kv && fo.kv.x : fe && fe.v, same ? (mv ? ot.kv && ot.kv.x : oe.v) : null, ot);
      const nk = mv ? last : Math.min(last, Math.floor(p + 1e-6));
      if (nk !== nowK) { nowK = nk; names.forEach((tn, k) => tn.classList.toggle('is-now', k === nk)); }
    }
    // 지금 화면의 장면: 데이터가 바뀌어 카드를 갈아 끼울 때 새 카드에 넘깁니다.
    keep(card, () => {
      if (!W) return from;
      const mv = moving;
      return {
        inView, W, H, labels: labels.join('\n'), lo, hi: hiC, p: !mv && playing && t < FULL ? pAt(t) : null,
        cross: vCross.map((c) => c.to).filter((k) => !fresh.has(k)), pill: pillFresh ? -1 : pillTo,
        items: items.map((it) => {
          const e = end(it.vals, last);
          return {
            name: it.name, focus: it === fo, a: it.a, ys: mv ? it.sy.map((sp) => (sp ? sp.x : null)) : it.py.slice(), vs: mv ? it.sy.map((sp) => (sp ? sp.v : 0)) : [],
            kv: mv ? (it.kv ? it.kv.x : null) : e ? e.v : null, kvV: mv && it.kv ? it.kv.v : 0, ly: it.ly ? it.ly.x : null, lyV: it.ly ? it.ly.v : 0,
          };
        }),
      };
    });

    // 재생: 화면에 보이고(inView) 마우스 · 포커스로 잠시 멈추지 않았을 때(holds)만 움직입니다. 카드가 페이지에서 빠지면 멈춥니다.
    const live = card.hasAttribute('data-vzb-live');   // 데이터가 바뀌어 다시 그린 카드: 처음부터 재생하지 않습니다
    const loop = !!card.closest('[data-vzb-loop]');
    const holds = new Set();
    let playing = false, seen = false, inView = false, rest = 0, stamp0 = 0, raf = 0;
    // 옮겨 가기와 그 뒤의 한 번 튐은 데이터가 바뀐 데 대한 답이라, 마우스가 올라가 있어도 끝까지 갑니다.
    const on = () => card.isConnected && inView && (moving || flashT < FLASH || gridA < 1 || labBusy || (playing && !holds.size));
    function tick(stamp) {
      raf = 0;
      if (!on()) { stamp0 = 0; return; }
      const dt = stamp0 ? Math.min(100, stamp - stamp0) : 16;
      stamp0 = stamp;
      if (moving) step(dt);
      else {
        if (flashT < FLASH) { flashT += dt; if (flashT >= FLASH) { fresh.clear(); pillFresh = false; } }
        if (gridA < 1) gridA = Math.min(1, gridA + dt / (FADE * 2));
        if (playing && !holds.size) {
          if (rest > 0) { rest -= dt; if (rest <= 0) t = 0; }
          else { t = Math.min(TOTAL, t + dt); if (t >= TOTAL) { if (loop) rest = M.ms('rest'); else playing = false; } }
        }
      }
      stepLabels(dt);
      render();
      if (on()) raf = requestAnimationFrame(tick);
    }
    function kick() { if (!raf && on()) raf = requestAnimationFrame(tick); }
    function play() {
      if (moving) settle();
      flashT = FLASH; fresh.clear(); pillFresh = false; gridA = 1;
      items.forEach((it) => { it.a = 1; it.ly = null; });
      t = 0; rest = 0; stamp0 = 0; playing = true;
      render();
      kick();
    }
    btn.addEventListener('click', play);
    // 짚을 항목 바꾸기: 색과 머리의 숫자가 그 항목으로 옮겨 갑니다. 고른 항목은 카드 요소에 적어 두어, 데이터가 바뀌어 다시 그려도 이어 갑니다.
    function setFocus(it) {
      if (!it || it === fo) return;
      fo = it;
      card.setAttribute('data-vzb-focus', it.name);
      paint();
      describe();
      say.textContent = tx(d, '%s 강조', it.name);
      render();
      if (api.at() >= 0) api.show(api.at());
      kick();
    }
    plot.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') { holds.add('hover'); render(); } });
    plot.addEventListener('pointerleave', () => { holds.delete('hover'); kick(); });
    plot.addEventListener('focus', () => { if (plot.matches(':focus-visible')) { holds.add('focus'); render(); } });   // 키보드로 들어왔을 때만 멈춥니다
    plot.addEventListener('blur', () => { holds.delete('focus'); kick(); });
    // 툴팁: 기간을 짚으면 세로선과 두 선 위의 점으로 그 기간을 알리고, 두 항목의 값과 차이를 적습니다. 차이의 색은 머리의 배지와 같은 뜻입니다.
    const api = interact(plot, n,
      (cx) => Math.max(0, Math.min(last, Math.round(((cx - plot.getBoundingClientRect().left - GL) / PW) * last))),
      (k) => {
        const r = plot.getBoundingClientRect(), ot = otherOf(fo), a = fo.vals[k], b = ot ? ot.vals[k] : null;
        hoverK = k;
        guide.setAttribute('x1', fx(X(k)));
        guide.setAttribute('x2', fx(X(k)));
        guide.setAttribute('opacity', 1);
        names.forEach((tn, i) => tn.classList.toggle('is-on', i === k));
        render();
        const rows = [{ tone: 't1', value: a == null ? tx(d, '데이터 없음') : show(f, a), name: fo.name }];
        if (ot) rows.push({ tone: 't0', value: b == null ? tx(d, '데이터 없음') : show(f, b), name: ot.name });
        let note = null;
        if (ot && a != null && b != null) {
          const dv = delta(f, a, b, d.better);
          note = { text: `${signed(f, a - b)}${f.rel && b ? ` (${dv.text})` : ''} · ${tx(d, '%s 대비', ot.name)}`, tone: dv.tone === 'flat' ? null : dv.tone };
        }
        const tb = tipBody({ rows, note }, labels[k]);
        const ys = items.map((it) => it.ys && it.ys[k]).filter((y) => y != null);
        return { x: r.left + X(k), y: r.top + (ys.length ? ys.reduce((p, c) => p + c, 0) / ys.length : y0 / 2), label: labels[k], value: tb.node, text: tb.text, side: k > last / 2 ? 'left' : true };   // 오른쪽 절반에서는 왼쪽에 띄워 선 끝의 이름을 덮지 않습니다
      },
      () => { hoverK = -1; guide.setAttribute('opacity', 0); names.forEach((tn) => tn.classList.remove('is-on')); render(); });
    // 선 가까이를 누르면 그 선이, Enter나 스페이스를 누르면 다른 선이 짚을 항목이 됩니다.
    plot.addEventListener('click', (e) => {
      const k = api.at();
      if (k < 0 || N < 2) return;
      const y = e.clientY - plot.getBoundingClientRect().top;
      let best = null, gap = 26;
      items.forEach((it) => { const yy = it.ys && it.ys[k]; if (yy != null && Math.abs(yy - y) < gap) { gap = Math.abs(yy - y); best = it; } });
      setFocus(best);
    });
    plot.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && N === 2) { e.preventDefault(); setFocus(otherOf(fo)); } });

    if (live) t = 1e9;   // 마지막 장면에서 시작합니다(앞 장면을 받았으면 layout이 거기서 옮겨 가기를 시작합니다)
    if (from) inView = !!from.inView;   // 앞 카드가 화면에 보이고 있었으면 바로 움직입니다
    onSize(plot, layout);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (W) layout(W, H); });
    // 화면에 처음 보일 때 움직입니다. 화면 밖에 있는 동안은 멈춰 둡니다.
    const start = () => { if (!seen) { seen = true; if (!live) play(); } };
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((es) => {
        if (!card.isConnected) { io.disconnect(); return; }
        inView = es[es.length - 1].isIntersecting;
        if (!inView && (moving || flashT < FLASH)) { if (moving) settle(); flashT = FLASH; fresh.clear(); pillFresh = false; gridA = 1; render(); }   // 화면 밖에서는 옮겨 가기를 끝낸 장면으로 둡니다
        if (inView) start();
        kick();
      }, { threshold: 0.3 });
      io.observe(card);
    } else { inView = true; start(); }
  });
})();
</script>
