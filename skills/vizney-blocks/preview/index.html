/* Vizney Blocks tokens: re-declare the same variables on your page's :root and they apply to every card. The card code stays as it is.
   To match your screen, set the background (--vzb-card), the text (--vzb-ink), the accent (--vzb-primary), the type (--vzb-font, --vzb-title-*) and the corners (--vzb-radius*).
   The gray steps (--vzb-ink-2 · muted · grid · track · other · base) and the badge and tooltip colors are mixed from the background, the text and the meaning colors, so they follow. Set one yourself and yours is used.
   A variable set to initial is empty. Empty, the card uses the Vizney shape it gives each element; set, the whole group uses that value.
   The colors come from Vizney's Figma palette: blue (#007aff), pink-red (#ff2d55) and orange (#ff9500) for data, green (#34c759) and red (#ff3b30) for good and bad.
   With "theme": "dark" in the JSON, the .vzb-dark values below draw the card on Vizney black with yellow as the first color.
   List: https://blocks.vizney.com/tokens.css */
:where(:root) {
  /* Type. Vizney Blocks Sans is the name of the @font-face inside the card (the Spoqa Han Sans Neo files). A browser fetches the files only when
     some text is drawn in that name, so once --vzb-font is changed the card requests nothing from outside. */
  --vzb-font: 'Vizney Blocks Sans', 'Spoqa Han Sans Neo', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;   /* every word on the card */
  --vzb-title-font: initial;   /* the font of a chart card's title. Empty: --vzb-font */
  --vzb-title-size: 17px;   /* title size. Anything under 12px is drawn at 12px */
  --vzb-title-weight: 500;   /* title weight */
  --vzb-title-case: none;   /* title case (text-transform): uppercase for capitals */
  --vzb-title-tracking: normal;   /* title letter-spacing, such as 0.08em */
  --vzb-sub-font: initial;   /* the font of the subtitle (period and basis). Empty: --vzb-font */
  --vzb-sub-size: 14px;   /* subtitle size. Anything under 12px is drawn at 12px */
  --vzb-sub-weight: 400;   /* subtitle weight */
  --vzb-sub-case: none;   /* subtitle case */
  --vzb-sub-tracking: normal;   /* subtitle letter-spacing */
  /* Background and text. The gray steps are the text color mixed into the background (in brackets, the color the defaults give). */
  --vzb-card: #ffffff;   /* card background; also the background of opened parts (calendar, list, distribution, download menu), the text on a picked chip or day, the outline of bar labels */
  --vzb-edge: rgba(17, 24, 39, 0.05);   /* border of the card, opened parts and inputs */
  --vzb-ink: #1b1b1b;   /* titles, values, headline figures. On controls, the fill of a picked chip or day, the thumbs and the download button */
  --vzb-ink-2: color-mix(in srgb, var(--vzb-ink) 79.39%, var(--vzb-card));   /* (#4a4a4a) names, legends, text of unpicked chips */
  --vzb-muted: color-mix(in srgb, var(--vzb-ink) 61.4%, var(--vzb-card));   /* (#737373) subtitle, units, axis ticks, light names, the connecting dots of Waterfall */
  --vzb-grid: color-mix(in srgb, var(--vzb-ink) 8.77%, var(--vzb-card));   /* (#ebebeb) the baseline */
  --vzb-track: color-mix(in srgb, var(--vzb-ink) 6.14%, var(--vzb-card));   /* (#f1f1f1) light fills: chips, buttons and the date button, the replay button, the bubble, the band of a picked row */
  --vzb-other: color-mix(in srgb, var(--vzb-ink) 16.67%, var(--vzb-card));   /* (#d9d9d9) hovered fills, the slider rail and distribution bars, the scrubber */
  --vzb-base: color-mix(in srgb, var(--vzb-ink) 25.88%, var(--vzb-card));   /* (#c4c4c4) reference bars: the totals of Waterfall, the bars under the limit in Bar Overflow */
  /* Data colors */
  --vzb-primary: #007aff;   /* first data color (blue): the picked item, the water of Funnel, the picked cells of Waffle, the picked line of Bump. Also the focus ring (when --vzb-focus is empty) */
  --vzb-secondary: #ff2d55;   /* second data color (pink-red): the left group of Butterfly */
  --vzb-tertiary: #ff9500;   /* third data color (orange) */
  /* Meaning colors. good and bad paint only whether a change is good or bad; alert paints only warnings (over a limit, a wrong input, an error message).
     Turn decreases gray and the part over a limit stays red. -tint (badge background) and -ink (text) mix the fill into the background and the text, so they follow. */
  --vzb-good: #34c759;   /* fill of a good change: the increases of Waterfall. Palette green; 2.2:1 on white, so never for text */
  --vzb-good-tint: color-mix(in srgb, var(--vzb-good) 10.04%, var(--vzb-card));   /* (#ebf9ee) background of a good-change badge */
  --vzb-good-ink: color-mix(in srgb, var(--vzb-good) 58.97%, var(--vzb-ink));   /* (#2a8040) text of a good change (badges, the bubble), 4.9:1 on white */
  --vzb-bad: #ff3b30;   /* fill of a bad change: the decreases of Waterfall. Palette red */
  --vzb-bad-tint: color-mix(in srgb, var(--vzb-bad) 10.17%, var(--vzb-card));   /* (#ffebea) background of a bad-change badge */
  --vzb-bad-ink: color-mix(in srgb, var(--vzb-bad) 77.3%, var(--vzb-ink));   /* (#cb342b) text of a bad change, 5.2:1 on white */
  --vzb-alert: #ff3b30;   /* fill of a warning: the part over the limit in Bar Overflow and its key, the border of a wrong date. Palette red */
  --vzb-alert-ink: color-mix(in srgb, var(--vzb-alert) 77.3%, var(--vzb-ink));   /* (#cb342b) text of a warning: the amount over, error messages */
  /* Tooltip and focus */
  --vzb-tip: var(--vzb-ink);   /* (#1b1b1b) tooltip background */
  --vzb-tip-ink: var(--vzb-card);   /* (#ffffff) tooltip text; names and notes are 72% of it */
  --vzb-focus: initial;   /* keyboard focus ring. Empty: --vzb-primary. Set it when the accent is close to the background (lime on white) */
  /* Shape */
  --vzb-radius: 18px;   /* card corners. Floating parts (tooltip 8, calendar and list 16, distribution 12) and the focus outline (4) take the smaller of this and their own */
  --vzb-radius-mark: initial;   /* corners of data marks: bar ends (4), waffle cells (2), the bubble (7), share pills (12), change badges (7), the band of a picked row (4), legend keys (2 · 3). 0 squares them all */
  --vzb-radius-control: initial;   /* corners of controls: chips and the date and list buttons (pills), icon buttons and thumbs (circles), inputs (10), period buttons, day cells, list rows. 0 squares them all */
  --vzb-unit: 168px;   /* 1 height unit; a chart card is 1, 1.5 or 2 units tall */
  --vzb-shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 18px 40px -22px rgba(17, 24, 39, 0.22);   /* card shadow; none for no shadow */
  --vzb-shadow-float: initial;   /* shadow of floating parts (tooltip, calendar, list, distribution, download menu). Empty: the Vizney shadow of each; none for no shadow */
  /* Motion. What moves decides the value. A spring is two numbers, 'stiffness damping' (stiffer is faster; less damping bounces more).
     Things you touch: Follow · Settle · Pop · Fade · Press. Things that carry a value: Move (never overshoots: a height or a position
     is the value, so a bounce shows a wrong value for a moment). Rhythm: Lead · Seq · Rest. Move what sits around the cards
     (KPI tiles, tables, tabs) with the same values and the screen reads as made by one hand. */
  --vzb-follow: 1000 63;   /* Follow: sticks to the pointer while held (the slider thumb). No overshoot */
  --vzb-settle: 340 26;   /* Settle: lands when let go, opened or widened (calendar, list, menu, rolling digits). 4% overshoot */
  --vzb-pop: 520 21;   /* Pop: a released button, a picked day or chip, a surfacing label. Not a value, so it bounces. 20% overshoot */
  --vzb-move: 200 28.3;   /* Move: what carries a value, such as a bar height, goes to its place. No overshoot (damping = 2√stiffness) */
  --vzb-fade: 0.14s;   /* Fade: the time opacity and color take, the same in and out */
  --vzb-press: 0.08s;   /* Press: the time to sink when pressed. Released, it comes back with Pop */
  --vzb-lead: 400ms;   /* Lead: the wait before a chart card starts once it is in view */
  --vzb-seq: 1200ms;   /* Seq: the whole time items take to move in turn, shared out among them */
  --vzb-rest: 2600ms;   /* Rest: the pause before a looping card (the gallery) starts again */
  /* The six below are the CSS transition time (-t) and curve (-e) worked out from the springs above. Do not edit them: change the
     springs and the cards work them out again. */
  --vzb-settle-t: 0.39s;
  --vzb-settle-e: linear(0, 0.023, 0.081, 0.164, 0.26, 0.362, 0.463, 0.56, 0.65, 0.731, 0.801, 0.861, 0.91, 0.95, 0.981, 1.005, 1.022, 1.033, 1.04, 1.043, 1.044, 1.042, 1.039, 1.036, 1.031, 1.027, 1.022, 1.018, 1.014, 1.011, 1.008, 1.005, 1);
  --vzb-pop-t: 0.52s;
  --vzb-pop-e: linear(0, 0.061, 0.212, 0.41, 0.619, 0.811, 0.969, 1.085, 1.158, 1.192, 1.193, 1.172, 1.138, 1.097, 1.057, 1.022, 0.995, 0.976, 0.965, 0.962, 0.963, 0.969, 0.977, 0.985, 0.992, 0.998, 1.003, 1.006, 1.007, 1.007, 1.007, 1.005, 1);
  --vzb-move-t: 0.54s;
  --vzb-move-e: linear(0, 0.024, 0.083, 0.161, 0.248, 0.335, 0.419, 0.498, 0.569, 0.633, 0.689, 0.737, 0.78, 0.816, 0.846, 0.872, 0.894, 0.913, 0.928, 0.941, 0.951, 0.96, 0.967, 0.973, 0.978, 0.982, 0.985, 0.988, 0.99, 0.992, 0.994, 0.995, 1);
}

/* Dark ("theme": "dark"): it picks the Vizney black background, so the card sets the same variables again inside itself, and colors on :root do not reach it.
   To match your screen, leave theme empty even on a dark screen and set the background, text and accent on :root. To change this block, write .vzb-dark { … } on your page (it is :where, so yours wins).
   Yellow, white and gray pass a color vision simulation (closest pair ΔE 14.9) and a contrast check against the card.
   Good and bad are the same green (#34c759) and red (#ff3b30) as on white, and on black they serve as text too (7.8:1 and 4.9:1). */
:where(.vzb-dark) {
  --vzb-card: #1b1b1b;   /* card background (Vizney black) */
  --vzb-edge: rgba(255, 255, 255, 0.08);   /* card border */
  --vzb-ink: #f5f5f5;   /* title and headline figure */
  --vzb-ink-2: color-mix(in srgb, var(--vzb-ink) 82.57%, var(--vzb-card));   /* (#cfcfcf) body text */
  --vzb-muted: color-mix(in srgb, var(--vzb-ink) 58.72%, var(--vzb-card));   /* (#9b9b9b) subtitle, units, axis ticks */
  --vzb-grid: color-mix(in srgb, var(--vzb-ink) 9.17%, var(--vzb-card));   /* (#2f2f2f) the baseline */
  --vzb-track: color-mix(in srgb, var(--vzb-ink) 7.8%, var(--vzb-card));   /* (#2c2c2c) light fills */
  --vzb-other: color-mix(in srgb, var(--vzb-ink) 22.94%, var(--vzb-card));   /* (#4d4d4d) hovered fills, rails */
  --vzb-base: color-mix(in srgb, var(--vzb-ink) 36.7%, var(--vzb-card));   /* (#6b6b6b) reference bars */
  --vzb-primary: #ffcc00;   /* first data color (Vizney yellow) */
  --vzb-secondary: #f5f5f5;   /* second data color (white) */
  --vzb-tertiary: #9b9b9b;   /* third data color (gray) */
  --vzb-good: #34c759;   /* good change (palette green) */
  --vzb-good-tint: color-mix(in srgb, var(--vzb-good) 16.24%, var(--vzb-card));   /* (#1f3725) good badge background */
  --vzb-good-ink: var(--vzb-good);   /* text of a good change */
  --vzb-bad: #ff3b30;   /* bad change (palette red) */
  --vzb-bad-tint: color-mix(in srgb, var(--vzb-bad) 8.07%, var(--vzb-card));   /* (#2d1e1d) bad badge background (as much as keeps 4.5:1 for the text) */
  --vzb-bad-ink: var(--vzb-bad);   /* text of a bad change */
  --vzb-alert: #ff3b30;   /* warning (palette red) */
  --vzb-alert-ink: var(--vzb-alert);   /* text of a warning */
  --vzb-tip: color-mix(in srgb, var(--vzb-ink) 14.22%, var(--vzb-card));   /* (#3a3a3a) tooltip background */
  --vzb-tip-ink: #ffffff;   /* tooltip text */
  --vzb-shadow: none;   /* card shadow */
}
/* 카드: 놓인 자리를 채웁니다. 폭은 자리의 폭이고, 높이는 1 · 1.5 · 2단위 가운데 하나를 바닥으로(단위 --vzb-unit, 카드마다 자기 CSS에서 정합니다)
   자리가 그보다 높으면 그 높이까지 늘어납니다. 높이가 정해진 요소 안에 두든(100%), 격자 · 플렉스 줄에서 옆 카드에 맞춰 늘어나든 같습니다.
   늘어난 높이는 그림이 씁니다(chart.css의 .vzb-fill). */
.vzb-card {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: max(var(--vzb-unit) * 1.5, 100%);
  padding: 24px;
  background: var(--vzb-card);
  color: var(--vzb-ink);
  border: 1px solid var(--vzb-edge);
  border-radius: var(--vzb-radius);
  box-shadow: var(--vzb-shadow);
  font: 400 14px/20px var(--vzb-font);   /* 글자 크기는 세 단계: 기본 14px, 보조 12px(단위 · 축 눈금 · 요일 · 개수 · 큰 숫자 위 설명), 큰 숫자 18px(말풍선 · 툴팁). 그 밖에 제목 17px, 대표 수치 34px(단위 16px) */
  text-align: left;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
.vzb-card *, .vzb-card *::before, .vzb-card *::after { box-sizing: border-box; }

/* 머리: 제목과 기간 부제, 그 아래 대표 수치와 바로 뒤의 증감 배지.
   배지와 비교 문구는 숫자와 같은 줄의 항목이라, 좁으면 비교 문구만 아래 줄로 내려가고 배지는 숫자 뒤에 남습니다. */
/* 제목과 부제의 글꼴 · 크기 · 굵기 · 대소문자 · 자간은 --vzb-title-* · --vzb-sub-*로 바꿉니다. 크기는 12px 밑으로 내려가지 않고, 줄 높이는 크기에 맞춰 늘어납니다(기본 24px · 20px). */
.vzb-title { font-family: var(--vzb-title-font, var(--vzb-font)); font-size: max(12px, var(--vzb-title-size)); line-height: max(24px, calc(var(--vzb-title-size) * 1.3)); font-weight: var(--vzb-title-weight); text-transform: var(--vzb-title-case); letter-spacing: var(--vzb-title-tracking); }
.vzb-sub { margin-top: 2px; color: var(--vzb-muted); font-family: var(--vzb-sub-font, var(--vzb-font)); font-size: max(12px, var(--vzb-sub-size)); line-height: max(20px, calc(var(--vzb-sub-size) * 1.4)); font-weight: var(--vzb-sub-weight); text-transform: var(--vzb-sub-case); letter-spacing: var(--vzb-sub-tracking); }
.vzb-fig { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; margin-top: 20px; }   /* 숫자 줄은 기준선 아래에 16px이 남아 줄 사이를 따로 두지 않습니다 */
.vzb-num { margin-right: 4px; font-size: 34px; line-height: 40px; font-weight: 400; letter-spacing: -0.02em; white-space: nowrap; }   /* 숫자와 배지 사이 12px, 배지와 비교 문구 사이 8px */
.vzb-unit { margin-left: 4px; font-size: 16px; letter-spacing: 0; color: var(--vzb-muted); }
.vzb-delta { display: contents; color: var(--vzb-muted); white-space: nowrap; }
.vzb-vs { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.vzb-badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px 3px 6px; border-radius: var(--vzb-radius-mark, 7px); font-weight: 500; }
.vzb-badge.vzb-good { color: var(--vzb-good-ink); background: var(--vzb-good-tint); }
.vzb-badge.vzb-bad { color: var(--vzb-bad-ink); background: var(--vzb-bad-tint); }
.vzb-badge.vzb-flat { color: var(--vzb-ink-2); background: var(--vzb-track); padding-left: 8px; }
.vzb-arrow { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.vzb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* 그래픽은 카드 아래쪽에 붙습니다. 같은 줄의 카드 높이가 맞춰져도 그래픽끼리 바닥이 맞습니다. */
.vzb-foot { margin-top: auto; padding-top: 20px; }
.vzb-error { margin: 8px 0 0; color: var(--vzb-alert-ink); }
/* 굴러가는 숫자: 숫자 칸의 높이는 글자 높이(1.2em)이고, 칸 안의 0–9 띠가 위아래로 굴러 새 값에 섭니다. */
.vzb-rl { display: inline-flex; vertical-align: bottom; white-space: nowrap; font-variant-numeric: tabular-nums; }
.vzb-rl-col { display: inline-block; height: 1.2em; overflow: hidden; }
.vzb-rl-strip { display: flex; flex-direction: column; transition: transform var(--vzb-settle-t) var(--vzb-settle-e); }
.vzb-rl-strip > span, .vzb-rl-ch { display: block; height: 1.2em; line-height: 1.2em; }
/* Filter Chips: 카드 틀 없이 칩만 그립니다. 칩은 높이 40px, 모서리 20px(--vzb-radius-control), 14px 글자이고 사이는 8px입니다(컨트롤 크기 기준: 글자가 있는 조작부는 높이 40px · 글자 14px, 아이콘만 있는 단추는 44px). 고른 칩은 글자색(밝은 바탕 검정, 어두운 바탕 흰색)으로
   채우고 카드 바탕색으로 체크와 이름을 적습니다. 고르지 않은 칩은 트랙 회색입니다. 세 줄을 넘으면 한 줄로 두고 가로로 밉니다(is-scroll).

      const b = e.target.closest('.vzb-ch-chip');

      if ('IntersectionObserver' in window) new IntersectionObserver((es) => { seen = es[es.length - 1].isIntersecting; }).observe(card);
      const timer = setInterval(() => {
        if (!card.isConnected) { clearInterval(timer); return; }

    arrow.append(svgEl('path', { d: 'M10 3.2v8.6' }), svgEl('path', { d: 'M6.6 8.6l3.4 3.4 3.4-3.4' }));
    svg.append(arrow, svgEl('path', { class: 'vzb-dl-check', d: 'M6.4 9.6l2.5 2.5 4.8-5.2' }), svgEl('path', { class: 'vzb-dl-tray', d: 'M3.6 13.4v1.6a1.6 1.6 0 0 0 1.6 1.6h9.6a1.6 1.6 0 0 0 1.6-1.6v-1.6' }));

    });

    const meta = el('span', 'vzb-dl-meta'), got = el('span', 'vzb-dl-got'), what = el('span', 'vzb-dl-what'), count = el('span', 'vzb-rl'), unit = el('span', 'vzb-dl-unit');
    got.append(what, count, unit);
    got.setAttribute('aria-hidden', 'true');
    meta.append(got);
    const anchor = el('div', 'vzb-dl-anchor');   // 아이콘 자리(44px). 늘어난 단추는 이 자리에서 옆 내용 위로 겹쳐 뜹니다
    anchor.append(menu);
    row.append(anchor, meta);
    const alignEnd = d.align === 'end';   // 화면 오른쪽 위처럼 오른쪽 끝에 둘 때: 아이콘을 오른쪽 끝에 붙이고 왼쪽으로 펼칩니다
    foot.classList.toggle('is-end', alignEnd);
    foot.append(row, say);
    card.append(foot);

    // 열고 닫기: 마우스를 올리면 열고, 내리면 잠시 뒤 닫습니다. 키보드로 아이콘에 들어오거나 아이콘을 눌러도 엽니다.
    let open = false, shut = 0, since = 0, hush = false;   // hush: Esc로 닫고 아이콘에 포커스를 돌려줄 때는 다시 열지 않습니다
    // 펼칠 방향: 아이콘 오른쪽(왼쪽 맞춤이면)이나 왼쪽(align end면)으로 화면 안에 다 들어가면 그쪽, 아니면 반대쪽입니다. 아이콘은 그 자리에 있습니다.
    function side() {

    });
    document.addEventListener('pointerdown', function away(e) {
      if (!card.isConnected) { document.removeEventListener('pointerdown', away, true); return; }

    // 받을 표: target 카드의 지금 JSON에서 만듭니다.
    const target = () => (d.target ? document.querySelector(`.vzb-card[data-vzb="${String(d.target).replace(/["\\]/g, '')}"]`) : null);
    const isRows = (a) => Array.isArray(a) && a.length > 0 && a.every((r) => r && typeof r === 'object' && !Array.isArray(r));
    function rowsOf(t) {
      const src = t && t.querySelector('script[type="application/json"]');
      if (!src) return null;
      let data;
      try { data = JSON.parse(src.textContent); } catch (e) { return null; }
      if (isRows(data.items)) return data.items;
      if (Array.isArray(data.labels) && data.labels.length && Array.isArray(data.values)) {
        return data.labels.map((l, i) => {
          const r = { label: l, value: data.values[i] };
          ['limit', 'target'].forEach((k) => { if (fin(data[k])) r[k] = +data[k]; });
          return r;
        });
      }
      if (Array.isArray(data.labels) && data.labels.length && isRows(data.series)) {
        return data.labels.map((l, i) => Object.assign({ label: l }, ...data.series.map((s) => ({ [s.name]: Array.isArray(s.values) ? s.values[i] : null }))));
      }
      return Object.values(data).find(isRows) || null;
    }
    // CSV: 행마다 숫자 · 글자 필드를 처음 나온 순서대로 열로 둡니다. 쉼표 · 따옴표 · 줄바꿈이 든 칸은 따옴표로 감쌉니다.
    function csv(rows) {
      const cols = [];
      rows.forEach((r) => Object.keys(r).forEach((k) => { if (!cols.includes(k) && (r[k] == null || typeof r[k] !== 'object')) cols.push(k); }));
      const cell = (v) => { const s = v == null ? '' : String(v); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };

    }
    // PNG: 카드를 보이는 그대로 복제해 계산된 스타일을 글자로 옮기고, SVG 그림 안에 넣어 캔버스에 그립니다(외부 라이브러리 없이).

      const r = t.getBoundingClientRect(), w = Math.ceil(r.width), h = Math.ceil(r.height), clone = t.cloneNode(true);
      const from = [t, ...t.querySelectorAll('*')], to = [clone, ...clone.querySelectorAll('*')];
      from.forEach((node, i) => {
        const out = to[i];
        if (!out || !out.setAttribute) return;
        if (node.tagName === 'SCRIPT' || node.closest('button')) { out.setAttribute('style', 'visibility:hidden'); return; }   // 단추(다시 보기 등)는 자리만 남기고 그리지 않습니다

      clone.querySelectorAll('script').forEach((s) => s.remove());

    let back = 0;

      if (!state) return;

        if (px) { roll(count, '0'); requestAnimationFrame(() => roll(count, String(px[0]))); unit.textContent = `×${px[1]}px`; }
        else { unit.textContent = (d.lang === 'en' ? ' ' : '') + tx(d, n === 1 ? '행|1' : '행'); roll(count, '0'); requestAnimationFrame(() => roll(count, num(n, 0))); }
      } else {

      back = setTimeout(() => { if (card.isConnected) foot.classList.remove('is-done', 'is-none'); }, state === 'done' ? 1800 : 1400);

        try {
          const p = await png(t);
          if (go) save(p.blob, name);
          mark('done', fmt, 0, [p.w, p.h]);
          say.textContent = tx(d, '%s로 받았습니다.', name);
        } catch (e) { mark('none'); say.textContent = tx(d, '받을 데이터가 없습니다.'); }
        return;
      }
      if (go) save(new Blob([fmt === 'csv' ? csv(rows) : JSON.stringify(rows, null, 2)], { type: fmt === 'csv' ? 'text/csv;charset=utf-8' : 'application/json' }), name);
      mark('done', fmt, rows.length);
      say.textContent = rows.length === 1 ? tx(d, '%s로 1행을 받았습니다.', name) : tx(d, '%1로 %2행을 받았습니다.', name, rows.length);

    let idle = 0;
    btn.addEventListener('click', () => {
      idle = performance.now() + 8000;
      if (!open) setOpen(true);
      else if (performance.now() - since > 250) run(list[0]);   // 열린 상태에서 아이콘을 다시 누르면 첫 형식으로 받습니다
    });

  --vzb-tip: var(--vzb-ink);   /* (#1b1b1b) tooltip background */
  --vzb-tip-ink: var(--vzb-card);   /* (#ffffff) tooltip text; names and notes are 72% of it */
  --vzb-focus: initial;   /* keyboard focus ring. Empty: --vzb-primary. Set it when the accent is close to the background (lime on white) */
  /* Shape */
  --vzb-radius: 18px;   /* card corners. Floating parts (tooltip 8, calendar and list 16, distribution 12) and the focus outline (4) take the smaller of this and their own */
  --vzb-radius-mark: initial;   /* corners of data marks: bar ends (4), waffle cells (2), the bubble (7), share pills (12), change badges (7), the band of a picked row (4), legend keys (2 · 3). 0 squares them all */
  --vzb-radius-control: initial;   /* corners of controls: chips and the date and list buttons (pills), icon buttons and thumbs (circles), inputs (10), period buttons, day cells, list rows. 0 squares them all */
  --vzb-unit: 168px;   /* 1 height unit; a chart card is 1, 1.5 or 2 units tall */
  --vzb-shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 18px 40px -22px rgba(17, 24, 39, 0.22);   /* card shadow; none for no shadow */
  --vzb-shadow-float: initial;   /* shadow of floating parts (tooltip, calendar, list, distribution, download menu). Empty: the Vizney shadow of each; none for no shadow */
  /* Motion. What moves decides the value. A spring is two numbers, 'stiffness damping' (stiffer is faster; less damping bounces more).
     Things you touch: Follow · Settle · Pop · Fade · Press. Things that carry a value: Move (never overshoots: a height or a position
     is the value, so a bounce shows a wrong value for a moment). Rhythm: Lead · Seq · Rest. Move what sits around the cards
     (KPI tiles, tables, tabs) with the same values and the screen reads as made by one hand. */
  --vzb-follow: 1000 63;   /* Follow: sticks to the pointer while held (the slider thumb). No overshoot */
  --vzb-settle: 340 26;   /* Settle: lands when let go, opened or widened (calendar, list, menu, rolling digits). 4% overshoot */
  --vzb-pop: 520 21;   /* Pop: a released button, a picked day or chip, a surfacing label. Not a value, so it bounces. 20% overshoot */
  --vzb-move: 200 28.3;   /* Move: what carries a value, such as a bar height, goes to its place. No overshoot (damping = 2√stiffness) */
  --vzb-fade: 0.14s;   /* Fade: the time opacity and color take, the same in and out */
  --vzb-press: 0.08s;   /* Press: the time to sink when pressed. Released, it comes back with Pop */
  --vzb-lead: 400ms;   /* Lead: the wait before a chart card starts once it is in view */
  --vzb-seq: 1200ms;   /* Seq: the whole time items take to move in turn, shared out among them */
  --vzb-rest: 2600ms;   /* Rest: the pause before a looping card (the gallery) starts again */
  /* The six below are the CSS transition time (-t) and curve (-e) worked out from the springs above. Do not edit them: change the
     springs and the cards work them out again. */
  --vzb-settle-t: 0.39s;
  --vzb-settle-e: linear(0, 0.023, 0.081, 0.164, 0.26, 0.362, 0.463, 0.56, 0.65, 0.731, 0.801, 0.861, 0.91, 0.95, 0.981, 1.005, 1.022, 1.033, 1.04, 1.043, 1.044, 1.042, 1.039, 1.036, 1.031, 1.027, 1.022, 1.018, 1.014, 1.011, 1.008, 1.005, 1);
  --vzb-pop-t: 0.52s;
  --vzb-pop-e: linear(0, 0.061, 0.212, 0.41, 0.619, 0.811, 0.969, 1.085, 1.158, 1.192, 1.193, 1.172, 1.138, 1.097, 1.057, 1.022, 0.995, 0.976, 0.965, 0.962, 0.963, 0.969, 0.977, 0.985, 0.992, 0.998, 1.003, 1.006, 1.007, 1.007, 1.007, 1.005, 1);
  --vzb-move-t: 0.54s;
  --vzb-move-e: linear(0, 0.024, 0.083, 0.161, 0.248, 0.335, 0.419, 0.498, 0.569, 0.633, 0.689, 0.737, 0.78, 0.816, 0.846, 0.872, 0.894, 0.913, 0.928, 0.941, 0.951, 0.96, 0.967, 0.973, 0.978, 0.982, 0.985, 0.988, 0.99, 0.992, 0.994, 0.995, 1);
}

/* Dark ("theme": "dark"): it picks the Vizney black background, so the card sets the same variables again inside itself, and colors on :root do not reach it.
   To match your screen, leave theme empty even on a dark screen and set the background, text and accent on :root. To change this block, write .vzb-dark { … } on your page (it is :where, so yours wins).
   Yellow, white and gray pass a color vision simulation (closest pair ΔE 14.9) and a contrast check against the card.
   Good and bad are the same green (#34c759) and red (#ff3b30) as on white, and on black they serve as text too (7.8:1 and 4.9:1). */
:where(.vzb-dark) {
  --vzb-card: #1b1b1b;   /* card background (Vizney black) */
  --vzb-edge: rgba(255, 255, 255, 0.08);   /* card border */
  --vzb-ink: #f5f5f5;   /* title and headline figure */
  --vzb-ink-2: color-mix(in srgb, var(--vzb-ink) 82.57%, var(--vzb-card));   /* (#cfcfcf) body text */
  --vzb-muted: color-mix(in srgb, var(--vzb-ink) 58.72%, var(--vzb-card));   /* (#9b9b9b) subtitle, units, axis ticks */
  --vzb-grid: color-mix(in srgb, var(--vzb-ink) 9.17%, var(--vzb-card));   /* (#2f2f2f) the baseline */
  --vzb-track: color-mix(in srgb, var(--vzb-ink) 7.8%, var(--vzb-card));   /* (#2c2c2c) light fills */
  --vzb-other: color-mix(in srgb, var(--vzb-ink) 22.94%, var(--vzb-card));   /* (#4d4d4d) hovered fills, rails */
  --vzb-base: color-mix(in srgb, var(--vzb-ink) 36.7%, var(--vzb-card));   /* (#6b6b6b) reference bars */
  --vzb-primary: #ffcc00;   /* first data color (Vizney yellow) */
  --vzb-secondary: #f5f5f5;   /* second data color (white) */
  --vzb-tertiary: #9b9b9b;   /* third data color (gray) */
  --vzb-good: #34c759;   /* good change (palette green) */
  --vzb-good-tint: color-mix(in srgb, var(--vzb-good) 16.24%, var(--vzb-card));   /* (#1f3725) good badge background */
  --vzb-good-ink: var(--vzb-good);   /* text of a good change */
  --vzb-bad: #ff3b30;   /* bad change (palette red) */
  --vzb-bad-tint: color-mix(in srgb, var(--vzb-bad) 8.07%, var(--vzb-card));   /* (#2d1e1d) bad badge background (as much as keeps 4.5:1 for the text) */
  --vzb-bad-ink: var(--vzb-bad);   /* text of a bad change */
  --vzb-alert: #ff3b30;   /* warning (palette red) */
  --vzb-alert-ink: var(--vzb-alert);   /* text of a warning */
  --vzb-tip: color-mix(in srgb, var(--vzb-ink) 14.22%, var(--vzb-card));   /* (#3a3a3a) tooltip background */
  --vzb-tip-ink: #ffffff;   /* tooltip text */
  --vzb-shadow: none;   /* card shadow */
}
/* 카드: 놓인 자리를 채웁니다. 폭은 자리의 폭이고, 높이는 1 · 1.5 · 2단위 가운데 하나를 바닥으로(단위 --vzb-unit, 카드마다 자기 CSS에서 정합니다)
   자리가 그보다 높으면 그 높이까지 늘어납니다. 높이가 정해진 요소 안에 두든(100%), 격자 · 플렉스 줄에서 옆 카드에 맞춰 늘어나든 같습니다.
   늘어난 높이는 그림이 씁니다(chart.css의 .vzb-fill). */
.vzb-card {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: max(var(--vzb-unit) * 1.5, 100%);
  padding: 24px;
  background: var(--vzb-card);
  color: var(--vzb-ink);
  border: 1px solid var(--vzb-edge);
  border-radius: var(--vzb-radius);
  box-shadow: var(--vzb-shadow);
  font: 400 14px/20px var(--vzb-font);   /* 글자 크기는 세 단계: 기본 14px, 보조 12px(단위 · 축 눈금 · 요일 · 개수 · 큰 숫자 위 설명), 큰 숫자 18px(말풍선 · 툴팁). 그 밖에 제목 17px, 대표 수치 34px(단위 16px) */
  text-align: left;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
.vzb-card *, .vzb-card *::before, .vzb-card *::after { box-sizing: border-box; }

/* 머리: 제목과 기간 부제, 그 아래 대표 수치와 바로 뒤의 증감 배지.
   배지와 비교 문구는 숫자와 같은 줄의 항목이라, 좁으면 비교 문구만 아래 줄로 내려가고 배지는 숫자 뒤에 남습니다. */
/* 제목과 부제의 글꼴 · 크기 · 굵기 · 대소문자 · 자간은 --vzb-title-* · --vzb-sub-*로 바꿉니다. 크기는 12px 밑으로 내려가지 않고, 줄 높이는 크기에 맞춰 늘어납니다(기본 24px · 20px). */
.vzb-title { font-family: var(--vzb-title-font, var(--vzb-font)); font-size: max(12px, var(--vzb-title-size)); line-height: max(24px, calc(var(--vzb-title-size) * 1.3)); font-weight: var(--vzb-title-weight); text-transform: var(--vzb-title-case); letter-spacing: var(--vzb-title-tracking); }
.vzb-sub { margin-top: 2px; color: var(--vzb-muted); font-family: var(--vzb-sub-font, var(--vzb-font)); font-size: max(12px, var(--vzb-sub-size)); line-height: max(20px, calc(var(--vzb-sub-size) * 1.4)); font-weight: var(--vzb-sub-weight); text-transform: var(--vzb-sub-case); letter-spacing: var(--vzb-sub-tracking); }
.vzb-fig { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; margin-top: 20px; }   /* 숫자 줄은 기준선 아래에 16px이 남아 줄 사이를 따로 두지 않습니다 */
.vzb-num { margin-right: 4px; font-size: 34px; line-height: 40px; font-weight: 400; letter-spacing: -0.02em; white-space: nowrap; }   /* 숫자와 배지 사이 12px, 배지와 비교 문구 사이 8px */
.vzb-unit { margin-left: 4px; font-size: 16px; letter-spacing: 0; color: var(--vzb-muted); }
.vzb-delta { display: contents; color: var(--vzb-muted); white-space: nowrap; }
.vzb-vs { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.vzb-badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px 3px 6px; border-radius: var(--vzb-radius-mark, 7px); font-weight: 500; }
.vzb-badge.vzb-good { color: var(--vzb-good-ink); background: var(--vzb-good-tint); }
.vzb-badge.vzb-bad { color: var(--vzb-bad-ink); background: var(--vzb-bad-tint); }
.vzb-badge.vzb-flat { color: var(--vzb-ink-2); background: var(--vzb-track); padding-left: 8px; }
.vzb-arrow { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.vzb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* 그래픽은 카드 아래쪽에 붙습니다. 같은 줄의 카드 높이가 맞춰져도 그래픽끼리 바닥이 맞습니다. */
.vzb-foot { margin-top: auto; padding-top: 20px; }
.vzb-error { margin: 8px 0 0; color: var(--vzb-alert-ink); }
/* 그래프 영역: 마우스를 올리거나, 포커스한 뒤 좌우 화살표로 값을 봅니다. */
.vzb-plot { position: relative; border-radius: min(var(--vzb-radius), 4px); outline: none; touch-action: pan-y; }   /* 포커스 테두리의 모서리: 카드 모서리를 넘지 않게 */
.vzb-plot:focus-visible { outline: 2px solid var(--vzb-focus, var(--vzb-primary)); outline-offset: 4px; }
/* 남은 높이를 채우는 차트: 그래프 영역이 늘어나고 그림은 그 크기에 맞춰 다시 그립니다. */
.vzb-fill { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
.vzb-fill > .vzb-plot { flex: 1 1 auto; min-height: 72px; }
.vzb-fill > .vzb-plot > svg { position: absolute; left: 0; top: 0; }
.vzb-tip {
  position: fixed;
  z-index: 1000;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  padding: 7px 10px;
  border-radius: min(var(--vzb-radius), 8px);   /* 떠 있는 창: 카드 모서리와 8px 중 작은 쪽 */
  background: var(--vzb-tip);
  color: var(--vzb-tip-ink);
  box-shadow: var(--vzb-shadow-float, 0 10px 24px -8px rgba(27, 27, 27, 0.4));
  font: 400 14px/20px var(--vzb-font);
  white-space: nowrap;
  opacity: 0;
  transition: opacity var(--vzb-fade);
}
.vzb-tip.is-on { opacity: 1; }
.vzb-tip-label { color: color-mix(in srgb, var(--vzb-tip-ink) 72%, transparent); }
.vzb-tip-value { font-weight: 700; }
.vzb-tip-value.is-big { font-size: 18px; line-height: 24px; }   /* 툴팁이 대신 보여 주는 큰 숫자 */
/* 색 이름: t1 · t2 선(파랑 · 분홍빨강, 어두운 바탕은 노랑 · 흰색), f1 · f2 · f3 막대와 면(파랑 · 분홍빨강 · 주황),
   t0 · f0 비교 회색, tx · fx 그 밖의 회색, fg · fb 좋음 · 나쁨, fa 주의, ti 목표 · 기준 표시 */
.vzb-t1, .vzb-f1 { --vzb-c: var(--vzb-primary); }
.vzb-t2, .vzb-f2 { --vzb-c: var(--vzb-secondary); }
.vzb-f3 { --vzb-c: var(--vzb-tertiary); }
.vzb-t0, .vzb-f0 { --vzb-c: var(--vzb-base); }
.vzb-tx, .vzb-fx { --vzb-c: var(--vzb-other); }
.vzb-fg { --vzb-c: var(--vzb-good); }
.vzb-fb { --vzb-c: var(--vzb-bad); }
.vzb-fa { --vzb-c: var(--vzb-alert); }
.vzb-ti { --vzb-c: var(--vzb-ink); }
.vzb-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 10px 0 0; padding: 0; list-style: none; color: var(--vzb-ink-2); }
.vzb-legend li { display: inline-flex; align-items: center; gap: 6px; }
/* 견본의 모서리는 --vzb-radius-mark를 따르되 제 기본값보다 둥글게 그리지 않습니다(작은 네모가 동그라미로 읽히지 않게). 점 견본은 늘 동그랗습니다. */
.vzb-key, .vzb-tip-key { display: inline-block; flex: none; width: 12px; height: 3px; border-radius: min(var(--vzb-radius-mark, 2px), 2px); background: var(--vzb-c); }
.vzb-key.is-box { width: 10px; height: 10px; border-radius: min(var(--vzb-radius-mark, 3px), 3px); }
.vzb-key.is-dot { width: 9px; height: 9px; border-radius: 50%; }
.vzb-key.is-dim { opacity: 0.4; }
.vzb-tip-body { display: flex; flex-direction: column; }
.vzb-tip-rows { display: grid; grid-template-columns: auto auto auto; justify-content: start; align-items: center; column-gap: 8px; row-gap: 1px; margin-top: 3px; }
.vzb-tip-row { display: contents; }
.vzb-tip-key.is-box { width: 10px; height: 10px; border-radius: min(var(--vzb-radius-mark, 3px), 3px); }
.vzb-tip-row b { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.vzb-tip-row span { color: color-mix(in srgb, var(--vzb-tip-ink) 72%, transparent); }
/* flow: 앞에서 뒤로 넘어가는 값을 화살표로 한 줄에 잇습니다. 값은 굵게, 이름은 옅게, 화살표는 값과 같은 글자색으로 둡니다. */
.vzb-tip-flow { display: flex; align-items: baseline; column-gap: 8px; margin-top: 3px; }
.vzb-tip-flow-item { display: inline-flex; align-items: baseline; column-gap: 4px; }
.vzb-tip-flow b { font-weight: 700; font-variant-numeric: tabular-nums; }
.vzb-tip-flow-item span { color: color-mix(in srgb, var(--vzb-tip-ink) 72%, transparent); }
.vzb-tip-arrow { font-weight: 700; }
.vzb-tip-note { margin-top: 3px; color: color-mix(in srgb, var(--vzb-tip-ink) 72%, transparent); }
.vzb-tip-note + .vzb-tip-note { margin-top: 0; }
/* 툴팁의 증감과 주의: 좋음 · 나쁨 · 주의 색을 툴팁 글자색에 조금 섞어 씁니다. 기본(어두운 툴팁에 흰 글자)에서는 밝아져 대비 4.5:1 이상이 되고,
   밝은 툴팁에 어두운 글자를 적으면 어두워져 같은 대비를 지킵니다. */
.vzb-tip .is-good { color: color-mix(in srgb, var(--vzb-good) 82%, var(--vzb-tip-ink)); font-weight: 700; }
.vzb-tip .is-bad { color: color-mix(in srgb, var(--vzb-bad) 68%, var(--vzb-tip-ink)); font-weight: 700; }
.vzb-tip .is-alert { color: color-mix(in srgb, var(--vzb-alert) 68%, var(--vzb-tip-ink)); font-weight: 700; }
.vzb-key.is-tick { width: 2px; height: 12px; border-radius: min(var(--vzb-radius-mark, 1px), 1px); }
/* Bar Overflow: 높이 2단위. 세로 막대는 굵기 30px까지, 위쪽 끝만 4px 둥글게 그리고 한도선에 닿으면 선 아래에서 각지게 끊습니다.
   선 아래는 회색(--vzb-base), 선 위로 넘친 구간만 빨강(--vzb-alert)입니다. 한도선은 글자색 1.5px 실선으로 막대 위에 긋고,
   선의 오른쪽 끝(막대 칸 밖)에 이름(12px, 옅게)을 선 위에, 값(14px 굵게)을 선 아래에 붙입니다.
   기간 이름은 바닥선 아래 12px, 넘친 양은 넘친 막대 위에 14px 굵은 빨간 글자(--vzb-alert-ink)로 적습니다.
   그래프 아래 줄에는 다시 보기 단추와 카드가 계산한 한 줄(넘친 기간 수와 넘친 양)을 둡니다. 깜빡임은 스크립트가 불투명도로 그립니다. */
.vzb-card[data-vzb="bar-overflow"] { min-height: max(var(--vzb-unit) * 2, 100%); }   /* 2단위가 바닥이고, 놓인 자리가 더 높으면 그 높이를 채웁니다 */
.vzb-bb.vzb-foot { padding-top: 12px; }
.vzb-bb-svg { display: block; overflow: visible; font-family: var(--vzb-font); }
.vzb-bb-base { stroke: var(--vzb-grid); stroke-width: 1; }
.vzb-bb-fill { fill: var(--vzb-base); }
.vzb-bb-over { fill: var(--vzb-alert); }
.vzb-bb-line { stroke: var(--vzb-ink); stroke-width: 1.5; }
.vzb-bb-lim { font-size: 12px; font-weight: 500; fill: var(--vzb-ink-2); }
.vzb-bb-limv { font-size: 14px; font-weight: 700; fill: var(--vzb-ink); font-variant-numeric: tabular-nums; }
.vzb-bb-name { font-size: 12px; fill: var(--vzb-muted); }
.vzb-bb-ex { font-size: 14px; font-weight: 700; fill: var(--vzb-alert-ink); font-variant-numeric: tabular-nums; }
.vzb-bb-col.is-over .vzb-bb-name { font-weight: 700; fill: var(--vzb-ink); }
.vzb-bb-col { transition: opacity var(--vzb-fade); }
.vzb-bb-svg.is-hover .vzb-bb-col:not(.is-on) { opacity: 0.3; }
.vzb-bb-ctl { display: flex; align-items: center; gap: 10px; min-height: 28px; margin-top: 8px; }
.vzb-card[data-vzb="bar-overflow"] .vzb-hd { position: relative; padding-right: 40px; }   /* 오른쪽 위 다시 보기 단추 자리 */
.vzb-bb-btn { position: absolute; top: -4px; right: 0; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: var(--vzb-radius-control, 50%); background: var(--vzb-track); color: var(--vzb-ink); cursor: pointer; }
.vzb-bb-btn:hover { background: var(--vzb-other); }
.vzb-bb-btn[hidden] { display: none; }
.vzb-bb-btn:focus-visible { outline: 2px solid var(--vzb-focus, var(--vzb-primary)); outline-offset: 2px; }
.vzb-bb-ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

      const bar = (o, cx, yv, hit) => {

        o.fill.setAttribute('d', col(x, cut ? ylC + GAP : yv, bwC, y0, !cut));
        o.red.setAttribute('d', hit && yv < ylC - GAP ? col(x, yv, bwC, ylC - GAP, true) : '');
      };
      gone.forEach((g) => {
        bar(g, g.x * PW, y0 - g.h, g.h >= sly.x && sly.x > 0);
        g.nm.setAttribute('x', fx(g.x * PW));
        g.nm.setAttribute('y', fx(y0 + 15));
        g.g.setAttribute('opacity', fx(g.a));
      });
      items.forEach((it) => {
        const cx = mv ? it.sx.x * PW : it.cx;
        it.nm.setAttribute('x', fx(cx));
        if (it.v == null) { it.fill.setAttribute('d', ''); it.red.setAttribute('d', ''); it.ex.setAttribute('opacity', 0); return; }
        const h = mv ? Math.max(0, it.sh.x) : it.v * clamp(MOVE.at(t - it.start)) * s, yv = y0 - h;
        bar(it, cx, yv, mv ? h >= sly.x : it.v >= lim);
        const overNow = mv ? Math.max(0, (h - sly.x) * unit) : it.over;
        if (mv && overNow > 0) { cnt++; tot += overNow; }
        it.red.setAttribute('opacity', fx(fresh.has(it) && !mv ? Math.min(glow, glow2) : glow));
        const exText = signed(f, overNow);
        if (it.exT !== exText) { it.exT = exText; it.ex.textContent = exText; }
        it.ex.setAttribute('x', fx(cx + (it.exDx || 0)));
        it.ex.setAttribute('y', fx(yv - 5));
        it.ex.setAttribute('opacity', mv ? fx(it.exA) : it.exOn ? fx(clamp((t - it.start - DUR) / 200)) : 0);
        it.g.classList.toggle('is-over', mv ? overNow > 0 : it.over > 0 && alert);
      });
      if (mv) setSum(cnt, tot); else setSum(spill.length, sum);
      sumEl.style.opacity = mv ? 1 : fx(clamp((t - (spill.length ? FULL + WAIT : FULL)) / 240));
    }
    // 지금 화면의 장면: 데이터가 바뀌어 카드를 갈아 끼울 때 새 카드에 넘깁니다. 아직 그리기 전이면 받은 장면을 그대로 넘깁니다.

      if (!W) return from;
      const mv = moving;
      return {
        inView, lpx: mv ? sly.x : lim * s, lpxV: mv ? sly.v : 0, lim: mv ? slv.x : lim, limV: mv ? slv.v : 0, bw: mv ? sw.x : bw,

          key: it.key, name: it.name, nameOn: it.nm.getAttribute('opacity') === '1',
          h: mv ? Math.max(0, it.sh.x) : it.v * clamp(MOVE.at(t - it.start)) * s, hv: mv ? it.sh.v : 0,
          x: mv ? it.sx.x : it.cx / PW, xv: mv ? it.sx.v : 0,
          exA: mv ? it.exA : it.exOn ? clamp((t - it.start - DUR) / 200) : 0,
          over: it.over > 0, fresh: fresh.has(it) && (mv || flash < BLINK),
        })).concat(gone.map((g) => ({ key: `\n${g.x}`, name: g.nm.textContent, nameOn: g.nm.getAttribute('opacity') === '1', h: g.h, hv: 0, x: g.x, xv: 0, exA: 0, over: false, fresh: false, a: g.a }))),
      };
    });

    // 재생: 화면에 보이고(inView) 마우스 · 포커스로 잠시 멈추지 않았을 때(holds)만 움직입니다. 카드가 페이지에서 빠지면 멈춥니다.

      if (!on()) { last = 0; return; }

      else if (rest > 0) { rest -= dt; if (rest <= 0) t = 0; }
      else {
        t = Math.min(TOTAL, t + dt);

      }
      render();
      if (on()) raf = requestAnimationFrame(tick);

    plot.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') { holds.add('hover'); render(); } });
    plot.addEventListener('pointerleave', () => { holds.delete('hover'); kick(); });
    plot.addEventListener('focus', () => { if (plot.matches(':focus-visible')) { holds.add('focus'); render(); } });   // 키보드로 들어왔을 때만 멈춥니다

    // 툴팁: 막대를 짚으면 값, 한도, 넘치거나 남은 양과 한도 대비 비율을 보여 주고 그 막대만 진하게 남깁니다.
    // 넘친 양의 글자는 숨기지 않고 그대로 두며(숫자가 사라지면 오류처럼 보이므로), 그 글자가 보이는 막대는 툴팁에 넘친 양을 되풀이하지 않습니다.
    interact(plot, N,
      (cx) => Math.max(0, Math.min(N - 1, Math.floor((cx - plot.getBoundingClientRect().left) / slot))),
      (k) => {
        const it = items[k], r = plot.getBoundingClientRect();
        svg.classList.add('is-hover');
        items.forEach((x) => x.g.classList.toggle('is-on', x === it));
        const note = [`${label} ${limShow}`];
        if (it.v != null) {
          const gap = show(f, Math.abs(it.v - lim)), share = lim > 0 ? num((it.v / lim) * 100, 0) : null;
          // 한도를 넘친 줄은 막대의 넘친 부분과 같은 빨강으로 적습니다.
          if (share == null) note.push({ text: tx(d, '%s 초과|한도', gap), tone: it.v > lim ? 'alert' : null });
          else if (it.v > lim && it.exOn) note.push({ text: tx(d, '%1의 %2', inText, `${share}%`), tone: 'alert' });
          else note.push(it.v > lim ? { text: tx(d, '%1 초과 · %2의 %3%', gap, inText, share), tone: 'alert' } : it.v < lim ? tx(d, '%1 남음 · %2의 %3%', gap, inText, share) : tx(d, '%1의 %2', inText, `${share}%`));
        }
        const tb = tipBody({ value: it.v == null ? tx(d, '데이터 없음') : show(f, it.v), note }, it.name);
        return { x: r.left + it.cx, y: r.top + Math.min(it.yv, yl) - 6, label: it.name, value: tb.node, text: tb.text };
      },
      () => { svg.classList.remove('is-hover'); items.forEach((x) => x.g.classList.remove('is-on')); },
      false, true);

    if (live) t = 1e9;   // 마지막 장면에서 시작합니다(앞 장면을 받았으면 layout이 거기서 옮겨 가기를 시작합니다)
    if (from) inView = !!from.inView;   // 앞 카드가 화면에 보이고 있었으면 바로 움직입니다
    onSize(plot, layout);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (W) layout(W, H); });
    // 화면에 처음 보일 때 움직입니다. 화면 밖에 있는 동안은 멈춰 둡니다.
    const start = () => { if (!seen) { seen = true; if (!live) play(); } };
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((es) => {
        if (!card.isConnected) { io.disconnect(); return; }
        inView = es[es.length - 1].isIntersecting;
        if (!inView && (moving || flash < BLINK)) { if (moving) settle(); flash = BLINK; fresh.clear(); render(); }   // 화면 밖에서는 옮겨 가기를 끝낸 장면으로 둡니다
        if (inView) start();
        kick();
      }, { threshold: 0.3 });
      io.observe(card);
    } else { inView = true; start(); }
  });
})();

  /* The six below are the CSS transition time (-t) and curve (-e) worked out from the springs above. Do not edit them: change the
     springs and the cards work them out again. */
  --vzb-settle-t: 0.39s;
  --vzb-settle-e: linear(0, 0.023, 0.081, 0.164, 0.26, 0.362, 0.463, 0.56, 0.65, 0.731, 0.801, 0.861, 0.91, 0.95, 0.981, 1.005, 1.022, 1.033, 1.04, 1.043, 1.044, 1.042, 1.039, 1.036, 1.031, 1.027, 1.022, 1.018, 1.014, 1.011, 1.008, 1.005, 1);
  --vzb-pop-t: 0.52s;
  --vzb-pop-e: linear(0, 0.061, 0.212, 0.41, 0.619, 0.811, 0.969, 1.085, 1.158, 1.192, 1.193, 1.172, 1.138, 1.097, 1.057, 1.022, 0.995, 0.976, 0.965, 0.962, 0.963, 0.969, 0.977, 0.985, 0.992, 0.998, 1.003, 1.006, 1.007, 1.007, 1.007, 1.005, 1);
  --vzb-move-t: 0.54s;
  --vzb-move-e: linear(0, 0.024, 0.083, 0.161, 0.248, 0.335, 0.419, 0.498, 0.569, 0.633, 0.689, 0.737, 0.78, 0.816, 0.846, 0.872, 0.894, 0.913, 0.928, 0.941, 0.951, 0.96, 0.967, 0.973, 0.978, 0.982, 0.985, 0.988, 0.99, 0.992, 0.994, 0.995, 1);
}

/* Dark ("theme": "dark"): it picks the Vizney black background, so the card sets the same variables again inside itself, and colors on :root do not reach it.
   To match your screen, leave theme empty even on a dark screen and set the background, text and accent on :root. To change this block, write .vzb-dark { … } on your page (it is :where, so yours wins).
   Yellow, white and gray pass a color vision simulation (closest pair ΔE 14.9) and a contrast check against the card.
   Good and bad are the same green (#34c759) and red (#ff3b30) as on white, and on black they serve as text too (7.8:1 and 4.9:1). */
:where(.vzb-dark) {
  --vzb-card: #1b1b1b;   /* card background (Vizney black) */
  --vzb-edge: rgba(255, 255, 255, 0.08);   /* card border */
  --vzb-ink: #f5f5f5;   /* title and headline figure */
  --vzb-ink-2: color-mix(in srgb, var(--vzb-ink) 82.57%, var(--vzb-card));   /* (#cfcfcf) body text */
  --vzb-muted: color-mix(in srgb, var(--vzb-ink) 58.72%, var(--vzb-card));   /* (#9b9b9b) subtitle, units, axis ticks */
  --vzb-grid: color-mix(in srgb, var(--vzb-ink) 9.17%, var(--vzb-card));   /* (#2f2f2f) the baseline */
  --vzb-track: color-mix(in srgb, var(--vzb-ink) 7.8%, var(--vzb-card));   /* (#2c2c2c) light fills */
  --vzb-other: color-mix(in srgb, var(--vzb-ink) 22.94%, var(--vzb-card));   /* (#4d4d4d) hovered fills, rails */
  --vzb-base: color-mix(in srgb, var(--vzb-ink) 36.7%, var(--vzb-card));   /* (#6b6b6b) reference bars */
  --vzb-primary: #ffcc00;   /* first data color (Vizney yellow) */
  --vzb-secondary: #f5f5f5;   /* second data color (white) */
  --vzb-tertiary: #9b9b9b;   /* third data color (gray) */
  --vzb-good: #34c759;   /* good change (palette green) */
  --vzb-good-tint: color-mix(in srgb, var(--vzb-good) 16.24%, var(--vzb-card));   /* (#1f3725) good badge background */
  --vzb-good-ink: var(--vzb-good);   /* text of a good change */
  --vzb-bad: #ff3b30;   /* bad change (palette red) */
  --vzb-bad-tint: color-mix(in srgb, var(--vzb-bad) 8.07%, var(--vzb-card));   /* (#2d1e1d) bad badge background (as much as keeps 4.5:1 for the text) */
  --vzb-bad-ink: var(--vzb-bad);   /* text of a bad change */
  --vzb-alert: #ff3b30;   /* warning (palette red) */
  --vzb-alert-ink: var(--vzb-alert);   /* text of a warning */
  --vzb-tip: color-mix(in srgb, var(--vzb-ink) 14.22%, var(--vzb-card));   /* (#3a3a3a) tooltip background */
  --vzb-tip-ink: #ffffff;   /* tooltip text */
  --vzb-shadow: none;   /* card shadow */
}
/* 카드: 놓인 자리를 채웁니다. 폭은 자리의 폭이고, 높이는 1 · 1.5 · 2단위 가운데 하나를 바닥으로(단위 --vzb-unit, 카드마다 자기 CSS에서 정합니다)
   자리가 그보다 높으면 그 높이까지 늘어납니다. 높이가 정해진 요소 안에 두든(100%), 격자 · 플렉스 줄에서 옆 카드에 맞춰 늘어나든 같습니다.
   늘어난 높이는 그림이 씁니다(chart.css의 .vzb-fill). */
.vzb-card {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: max(var(--vzb-unit) * 1.5, 100%);
  padding: 24px;
  background: var(--vzb-card);
  color: var(--vzb-ink);
  border: 1px solid var(--vzb-edge);
  border-radius: var(--vzb-radius);
  box-shadow: var(--vzb-shadow);
  font: 400 14px/20px var(--vzb-font);   /* 글자 크기는 세 단계: 기본 14px, 보조 12px(단위 · 축 눈금 · 요일 · 개수 · 큰 숫자 위 설명), 큰 숫자 18px(말풍선 · 툴팁). 그 밖에 제목 17px, 대표 수치 34px(단위 16px) */
  text-align: left;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
.vzb-card *, .vzb-card *::before, .vzb-card *::after { box-sizing: border-box; }

/* 머리: 제목과 기간 부제, 그 아래 대표 수치와 바로 뒤의 증감 배지.
   배지와 비교 문구는 숫자와 같은 줄의 항목이라, 좁으면 비교 문구만 아래 줄로 내려가고 배지는 숫자 뒤에 남습니다. */
/* 제목과 부제의 글꼴 · 크기 · 굵기 · 대소문자 · 자간은 --vzb-title-* · --vzb-sub-*로 바꿉니다. 크기는 12px 밑으로 내려가지 않고, 줄 높이는 크기에 맞춰 늘어납니다(기본 24px · 20px). */
.vzb-title { font-family: var(--vzb-title-font, var(--vzb-font)); font-size: max(12px, var(--vzb-title-size)); line-height: max(24px, calc(var(--vzb-title-size) * 1.3)); font-weight: var(--vzb-title-weight); text-transform: var(--vzb-title-case); letter-spacing: var(--vzb-title-tracking); }
.vzb-sub { margin-top: 2px; color: var(--vzb-muted); font-family: var(--vzb-sub-font, var(--vzb-font)); font-size: max(12px, var(--vzb-sub-size)); line-height: max(20px, calc(var(--vzb-sub-size) * 1.4)); font-weight: var(--vzb-sub-weight); text-transform: var(--vzb-sub-case); letter-spacing: var(--vzb-sub-tracking); }
.vzb-fig { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; margin-top: 20px; }   /* 숫자 줄은 기준선 아래에 16px이 남아 줄 사이를 따로 두지 않습니다 */
.vzb-num { margin-right: 4px; font-size: 34px; line-height: 40px; font-weight: 400; letter-spacing: -0.02em; white-space: nowrap; }   /* 숫자와 배지 사이 12px, 배지와 비교 문구 사이 8px */
.vzb-unit { margin-left: 4px; font-size: 16px; letter-spacing: 0; color: var(--vzb-muted); }
.vzb-delta { display: contents; color: var(--vzb-muted); white-space: nowrap; }
.vzb-vs { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.vzb-badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px 3px 6px; border-radius: var(--vzb-radius-mark, 7px); font-weight: 500; }
.vzb-badge.vzb-good { color: var(--vzb-good-ink); background: var(--vzb-good-tint); }
.vzb-badge.vzb-bad { color: var(--vzb-bad-ink); background: var(--vzb-bad-tint); }
.vzb-badge.vzb-flat { color: var(--vzb-ink-2); background: var(--vzb-track); padding-left: 8px; }
.vzb-arrow { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.vzb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* 그래픽은 카드 아래쪽에 붙습니다. 같은 줄의 카드 높이가 맞춰져도 그래픽끼리 바닥이 맞습니다. */
.vzb-foot { margin-top: auto; padding-top: 20px; }
.vzb-error { margin: 8px 0 0; color: var(--vzb-alert-ink); }
/* 그래프 영역: 마우스를 올리거나, 포커스한 뒤 좌우 화살표로 값을 봅니다. */
.vzb-plot { position: relative; border-radius: min(var(--vzb-radius), 4px); outline: none; touch-action: pan-y; }   /* 포커스 테두리의 모서리: 카드 모서리를 넘지 않게 */
.vzb-plot:focus-visible { outline: 2px solid var(--vzb-focus, var(--vzb-primary)); outline-offset: 4px; }
/* 남은 높이를 채우는 차트: 그래프 영역이 늘어나고 그림은 그 크기에 맞춰 다시 그립니다. */
.vzb-fill { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
.vzb-fill > .vzb-plot { flex: 1 1 auto; min-height: 72px; }
.vzb-fill > .vzb-plot > svg { position: absolute; left: 0; top: 0; }
.vzb-tip {
  position: fixed;
  z-index: 1000;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  padding: 7px 10px;
  border-radius: min(var(--vzb-radius), 8px);   /* 떠 있는 창: 카드 모서리와 8px 중 작은 쪽 */
  background: var(--vzb-tip);
  color: var(--vzb-tip-ink);
  box-shadow: var(--vzb-shadow-float, 0 10px 24px -8px rgba(27, 27, 27, 0.4));
  font: 400 14px/20px var(--vzb-font);
  white-space: nowrap;
  opacity: 0;
  transition: opacity var(--vzb-fade);
}
.vzb-tip.is-on { opacity: 1; }
.vzb-tip-label { color: color-mix(in srgb, var(--vzb-tip-ink) 72%, transparent); }
.vzb-tip-value { font-weight: 700; }
.vzb-tip-value.is-big { font-size: 18px; line-height: 24px; }   /* 툴팁이 대신 보여 주는 큰 숫자 */
/* 색 이름: t1 · t2 선(파랑 · 분홍빨강, 어두운 바탕은 노랑 · 흰색), f1 · f2 · f3 막대와 면(파랑 · 분홍빨강 · 주황),
   t0 · f0 비교 회색, tx · fx 그 밖의 회색, fg · fb 좋음 · 나쁨, fa 주의, ti 목표 · 기준 표시 */
.vzb-t1, .vzb-f1 { --vzb-c: var(--vzb-primary); }
.vzb-t2, .vzb-f2 { --vzb-c: var(--vzb-secondary); }
.vzb-f3 { --vzb-c: var(--vzb-tertiary); }
.vzb-t0, .vzb-f0 { --vzb-c: var(--vzb-base); }
.vzb-tx, .vzb-fx { --vzb-c: var(--vzb-other); }
.vzb-fg { --vzb-c: var(--vzb-good); }
.vzb-fb { --vzb-c: var(--vzb-bad); }
.vzb-fa { --vzb-c: var(--vzb-alert); }
.vzb-ti { --vzb-c: var(--vzb-ink); }
.vzb-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 10px 0 0; padding: 0; list-style: none; color: var(--vzb-ink-2); }
.vzb-legend li { display: inline-flex; align-items: center; gap: 6px; }
/* 견본의 모서리는 --vzb-radius-mark를 따르되 제 기본값보다 둥글게 그리지 않습니다(작은 네모가 동그라미로 읽히지 않게). 점 견본은 늘 동그랗습니다. */
.vzb-key, .vzb-tip-key { display: inline-block; flex: none; width: 12px; height: 3px; border-radius: min(var(--vzb-radius-mark, 2px), 2px); background: var(--vzb-c); }
.vzb-key.is-box { width: 10px; height: 10px; border-radius: min(var(--vzb-radius-mark, 3px), 3px); }
.vzb-key.is-dot { width: 9px; height: 9px; border-radius: 50%; }
.vzb-key.is-dim { opacity: 0.4; }
.vzb-tip-body { display: flex; flex-direction: column; }
.vzb-tip-rows { display: grid; grid-template-columns: auto auto auto; justify-content: start; align-items: center; column-gap: 8px; row-gap: 1px; margin-top: 3px; }
.vzb-tip-row { display: contents; }
.vzb-tip-key.is-box { width: 10px; height: 10px; border-radius: min(var(--vzb-radius-mark, 3px), 3px); }
.vzb-tip-row b { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.vzb-tip-row span { color: color-mix(in srgb, var(--vzb-tip-ink) 72%, transparent); }
/* flow: 앞에서 뒤로 넘어가는 값을 화살표로 한 줄에 잇습니다. 값은 굵게, 이름은 옅게, 화살표는 값과 같은 글자색으로 둡니다. */
.vzb-tip-flow { display: flex; align-items: baseline; column-gap: 8px; margin-top: 3px; }
.vzb-tip-flow-item { display: inline-flex; align-items: baseline; column-gap: 4px; }
.vzb-tip-flow b { font-weight: 700; font-variant-numeric: tabular-nums; }
.vzb-tip-flow-item span { color: color-mix(in srgb, var(--vzb-tip-ink) 72%, transparent); }
.vzb-tip-arrow { font-weight: 700; }
.vzb-tip-note { margin-top: 3px; color: color-mix(in srgb, var(--vzb-tip-ink) 72%, transparent); }
.vzb-tip-note + .vzb-tip-note { margin-top: 0; }
/* 툴팁의 증감과 주의: 좋음 · 나쁨 · 주의 색을 툴팁 글자색에 조금 섞어 씁니다. 기본(어두운 툴팁에 흰 글자)에서는 밝아져 대비 4.5:1 이상이 되고,
   밝은 툴팁에 어두운 글자를 적으면 어두워져 같은 대비를 지킵니다. */
.vzb-tip .is-good { color: color-mix(in srgb, var(--vzb-good) 82%, var(--vzb-tip-ink)); font-weight: 700; }
.vzb-tip .is-bad { color: color-mix(in srgb, var(--vzb-bad) 68%, var(--vzb-tip-ink)); font-weight: 700; }
.vzb-tip .is-alert { color: color-mix(in srgb, var(--vzb-alert) 68%, var(--vzb-tip-ink)); font-weight: 700; }
.vzb-key.is-tick { width: 2px; height: 12px; border-radius: min(var(--vzb-radius-mark, 1px), 1px); }
/* Bump Race: 높이 2단위. 그래프는 머리 아래 남은 높이를 채우고, 맨 아래에 구간 막대(34px)를 둡니다.
   선은 2px S자 곡선이고, 짚을 항목만 첫째 데이터 색, 나머지는 글자색을 카드 바탕에 30% 섞은 회색입니다(겹쳐도 진해지지 않게 불투명).
   기간마다 지름 5px 점은 짚을 항목(과 마우스로 짚은 항목)에만 찍고, 선 끝 점(지름 8px · 짚을 항목 10px)은 카드 바탕색 2px 테두리로 겹친 선과 떼어 냅니다.
   이름표는 선 끝 오른쪽 10px에 '순위 이름'으로 적습니다(12px, 순위는 굵게 옅은 글자색, 짚을 항목은 이름까지 굵게 글자색).
   앞지르는 동안 두 이름표가 겹치면 짚을 항목 · 순위가 높은 쪽만 남기고 다른 쪽은 잠시 옅게 둡니다.
   구간 막대는 2px 레일 위에 기간마다 점 눈금을 두고, 지나온 구간 · 눈금 · 손잡이(지름 12px)는 글자색입니다.
   손잡이 아래에 지금 기간을 굵게 적고, 처음과 끝 기간은 옅게 적되 지금 기간과 겹치면 감춥니다.
   구간 막대 오른쪽(이름표 열 아래)에 되감기 · 재생/일시정지(28px 원) · 빨리 감기를 둡니다. 선이나 이름표를 누르면 그 항목이 짚을 항목이 됩니다.
   선이 자라는 움직임은 스크립트가 그립니다. */
.vzb-card[data-vzb="bump-race"] { min-height: max(var(--vzb-unit) * 2, 100%); }   /* 2단위가 바닥이고, 놓인 자리가 더 높으면 그 높이를 채웁니다 */
.vzb-br.vzb-foot { padding-top: 14px; }
.vzb-br-svg, .vzb-br-ssvg { display: block; overflow: visible; font-family: var(--vzb-font); }
.vzb-br-item { --vzb-c: color-mix(in srgb, var(--vzb-ink) 30%, var(--vzb-card)); transition: opacity var(--vzb-fade); }
.vzb-br-item.is-focus { --vzb-c: var(--vzb-primary); }
.vzb-br-line { fill: none; stroke: var(--vzb-c); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.vzb-br-dot { fill: var(--vzb-c); }
.vzb-br-item:not(.is-focus):not(.is-on) .vzb-br-dot { opacity: 0; }   /* 기간 점은 짚을 항목과 짚은 항목에만 찍어 회색 선을 가볍게 둡니다 */
.vzb-br-head { fill: color-mix(in srgb, var(--vzb-ink) 55%, var(--vzb-card)); stroke: var(--vzb-card); stroke-width: 2; transition: opacity var(--vzb-fade); }
.vzb-br-head.is-focus { fill: var(--vzb-primary); }
.vzb-br-lab { font-size: 14px; font-weight: 500; fill: var(--vzb-ink-2); paint-order: stroke; stroke: var(--vzb-card); stroke-width: 3px; stroke-linejoin: round; transition: opacity var(--vzb-fade); }
.vzb-br-lab.is-focus { font-weight: 700; fill: var(--vzb-ink); }
.vzb-br-lab.is-clash { opacity: 0.15; }   /* 앞지르는 동안 겹친 이름표는 잠시 옅게 */
.vzb-br-rk { font-weight: 700; fill: var(--vzb-muted); font-variant-numeric: tabular-nums; }
.vzb-br-lab.is-focus .vzb-br-rk { fill: var(--vzb-ink); }
.vzb-br-svg.is-hover .vzb-br-item:not(.is-on), .vzb-br-svg.is-hover .vzb-br-head:not(.is-on), .vzb-br-svg.is-hover .vzb-br-lab:not(.is-on) { opacity: 0.2; }
.vzb-br-svg.is-hover .vzb-br-item.is-on:not(.is-focus) { --vzb-c: var(--vzb-ink-2); }   /* 짚은 회색 항목은 진한 회색으로 */
.vzb-br-plot { cursor: pointer; }
.vzb-br-bar { display: flex; align-items: flex-start; gap: 8px; margin-top: 20px; }   /* 맨 아래 이름표와 재생 단추가 붙어 보이지 않게 띄웁니다 */
.vzb-br-ctl { flex: none; display: flex; align-items: center; gap: 2px; margin-top: -4px; }
.vzb-br-btn { display: grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 0; border-radius: var(--vzb-radius-control, 50%); background: none; color: var(--vzb-ink-2); cursor: pointer; touch-action: manipulation; }
.vzb-br-btn:hover { background: var(--vzb-track); color: var(--vzb-ink); }
.vzb-br-main { width: 28px; height: 28px; background: var(--vzb-track); color: var(--vzb-ink); }
.vzb-br-main:hover { background: var(--vzb-other); }
.vzb-br-btn[hidden] { display: none; }
.vzb-br-btn:focus-visible { outline: 2px solid var(--vzb-focus, var(--vzb-primary)); outline-offset: 2px; }
.vzb-br-ic { width: 16px; height: 16px; }

      // 기간의 자리도 이어 갑니다: 재생하던 중이면 그 자리에서 마저 재생하고, 아니면 고른 기간으로 갑니다.
      const goal = p;
      p = Math.max(0, Math.min(last, +prev.p || 0));
      if (prev.playing) { playing = true; wait = 0; setBtn(); } else if (Math.abs(p - goal) > 1e-3) glide(goal, 200);
      if (!any) { items.forEach((it) => { it.sy = null; }); return; }
      moving = true;
      m0 = now;
      stepMove(Math.min(100, Math.max(0, now - (prev.at || now))));   // 끄는 동안처럼 그릴 틈 없이 갈아 끼워져도, 그 사이 흐른 시간만큼 나아갑니다
      kick();
    }
    // 스프링을 dt만큼 옮기고, 모두 제자리에 닿고 다 나타나거나 사라졌으면 끝냅니다.
    const fadeK = () => Math.max(0, Math.min(1, (performance.now() - m0) / FADE));
    const oOf = (it, k) => (it.ghost ? it.o0 * (1 - k) : it.o0 + (1 - it.o0) * k);
    function stepMove(dt) {
      let more = false;
      const hh = Math.max(1, H);
      const go = (sp, to) => {
        springTo(sp, to, MK, MC, dt);
        if (Math.abs(sp.x - to) > hh * 0.0006 || Math.abs(sp.v) > hh * 0.01) more = true; else { sp.x = to; sp.v = 0; }
      };
      items.forEach((it) => { if (it.sy) it.sy.forEach((sp, t) => { if (sp) go(sp, Y(it.rk[t])); }); });
      if (sR) go(sR, RT);
      const k = fadeK();
      if (k < 1 && (ghosts.length || items.some((it) => it.o0 < 1))) more = true;
      items.concat(ghosts).forEach((it) => { if (it.ghost || it.o0 < 1) { const o = oOf(it, k).toFixed(3); [it.line, it.head, it.lab].forEach((n2) => { n2.style.opacity = o; }); } });
      if (!more) settle(); else setX(sR ? sR.x : RT);
    }
    // 다 옮겨 갔습니다: 옮겨 가는 동안 둔 것(높이 · 투명도 · 사라지던 항목)을 걷어 내, 처음부터 그린 장면과 같게 합니다.
    function settle() {
      moving = false;
      sR = null;
      items.forEach((it) => {
        it.sy = null;
        if (it.o0 < 1) [it.line, it.head, it.lab].forEach((n2) => { n2.style.removeProperty('opacity'); if (!n2.getAttribute('style')) n2.removeAttribute('style'); });
        it.o0 = 1;
      });
      ghosts.forEach((g) => { g.line.remove(); g.head.remove(); g.lab.remove(); });
      ghosts = [];
      setX(RT);
    }
    keep(card, () => {
      if (!W) return scene;
      const k = moving ? fadeK() : 1;
      const one = (it) => ({
        name: it.name, focus: !!it.focus, rt: it.labR.textContent, o: moving && (it.ghost || it.o0 < 1) ? oOf(it, k) : 1,
        ys: it.rk.map((r, t) => (r ? yy(it, t) : null)), vs: it.rk.map((r, t) => (r && it.sy && it.sy[t] ? it.sy[t].v : 0)),
      });
      const real = items.map(one), gone = ghosts.map((g) => Object.assign(one(g), { gone: true }));
      return { at: performance.now(), inView, W, H, p, playing, labels, R: sR ? sR.x : RT, Rv: sR ? sR.v : 0, items: real.concat(gone) };
    });
    // 지금 자리(p, 0~마지막 기간)를 그립니다. p의 정수 부분이 지나온 기간, 소수 부분이 다음 기간까지 간 몫입니다.
    function render() {
      if (!W) return;
      const i0 = Math.min(Math.floor(p), last - 1), s = Math.max(0, Math.min(1, p - i0)), u = uOf(s), cur = Math.round(p);
      const hx = xs[i0] + (xs[i0 + 1] - xs[i0]) * s;
      // 옮겨 가는 동안 이름표의 순위는 화면의 높이 순서로 셉니다(선이 엇갈리는 순간에 순위가 바뀝니다).
      let liveRk = null;
      if (moving) { liveRk = new Map(); items.filter((it) => it.rk[cur]).sort((a, b) => yy(a, cur) - yy(b, cur) || a.rk[cur] - b.rk[cur]).forEach((it, k) => liveRk.set(it, k + 1)); }
      items.concat(ghosts).forEach((it) => {
        let dpath = '', prev = -1, hy = null;
        for (let t = 0; t <= i0; t++) {
          const r = it.rk[t];
          vis(it.dots[t], !!r);
          if (!r) { prev = -1; continue; }
          dpath += prev >= 0 && prev === t - 1 ? cut(xs[t - 1], yy(it, t - 1), xs[t], yy(it, t), 1).d : `M${fx(xs[t])},${fx(yy(it, t))}`;
          prev = t;
        }
        for (let t = i0 + 1; t < n; t++) vis(it.dots[t], !!(t === i0 + 1 && s >= 1 && it.rk[t]));
        const ra = it.rk[i0], rb = it.rk[i0 + 1];
        if (ra && rb) {
          const c = cut(xs[i0], yy(it, i0), xs[i0 + 1], yy(it, i0 + 1), u);
          if (s > 0) dpath += c.d;
          hy = c.e[1];
        } else if (ra && s < 0.5) hy = yy(it, i0);   // 다음 기간에 값이 없으면 선은 여기서 끝나고 점은 가운데쯤 사라집니다
        else if (!ra && rb && s >= 0.5) hy = yy(it, i0 + 1);   // 다음 기간에 처음 나오는 항목은 가운데쯤 나타납니다
        const hxi = !ra && rb ? xs[i0 + 1] : ra && !rb ? xs[i0] : hx;
        it.path.setAttribute('d', dpath);
        it.hy = hy;
        const on = hy != null;
        vis(it.head, on);
        vis(it.lab, on);
        if (!on) return;
        it.head.setAttribute('cx', fx(hxi));
        it.head.setAttribute('cy', fx(hy));
        it.lab.setAttribute('x', fx(hxi + 10));
        it.lab.setAttribute('y', fx(hy + 4));
        const rt = it.ghost ? it.labR.textContent : rankText((liveRk && liveRk.get(it)) || it.rk[cur] || ra || rb);
        if (it.labR.textContent !== rt) it.labR.textContent = rt;
      });
      // 앞지르는 동안 두 이름표가 겹치면, 짚을 항목 · 지금 순위가 높은 항목의 이름표를 남기고 다른 쪽은 잠시 옅게 둡니다.
      const placed = [];
      items.filter((it) => it.hy != null).sort((a, b) => b.focus - a.focus || (a.rk[cur] || N + 1) - (b.rk[cur] || N + 1)).forEach((it) => {
        const clash = placed.some((y) => Math.abs(y - it.hy) < 13);
        it.lab.classList.toggle('is-clash', clash);
        if (!clash) placed.push(it.hy);
      });
      // 구간 막대: 손잡이는 선 끝과 같은 가로 자리입니다. 지금 기간 이름이 처음 · 끝 이름과 겹치면 그쪽 이름을 감춥니다.
      fill.setAttribute('x2', fx(hx));
      ticks.forEach((c, t) => c.classList.toggle('is-past', t <= p + 1e-6));
      thumb.setAttribute('cx', fx(hx));
      thumb.setAttribute('cy', 9);
      halo.setAttribute('cx', fx(hx));
      halo.setAttribute('cy', 9);
      if (now.textContent !== labels[cur]) now.textContent = labels[cur];
      const nw = nowW / 2 + 2, nx = Math.max(nw - 2, Math.min(scrub.clientWidth - nw, hx));
      now.setAttribute('x', fx(nx));
      const aw = textW(labels[0], 400, fam, 12), bw = textW(labels[last], 400, fam, 12);
      endA.style.opacity = nx - nw < Math.max(0, xs[0] - 6) + aw + 8 ? 0 : 1;
      endB.style.opacity = nx + nw > xs[last] + 6 - bw - 8 ? 0 : 1;
      scrub.setAttribute('aria-valuenow', String(cur));
      scrub.setAttribute('aria-valuetext', `${labels[cur]}: ${focus.name} ${rankText(focus.rk[cur])}`);
    }

    // 재생: 화면에 보이고(inView) 마우스 · 포커스로 잠시 멈추지 않았을 때(holds)만 흐릅니다. 카드가 페이지에서 빠지면 멈춥니다.
    // 기간 하나를 넘기는 시간 STEP, 처음 첫 기간을 읽는 시간 LEAD. 구간 막대로 옮길 때는 짧게 미끄러집니다(seek).
    const STEP = 520, LEAD = motion(card).ms('lead');
    const live = card.hasAttribute('data-vzb-live'), loop = !!card.closest('[data-vzb-loop]');
    const kept = labels.indexOf(card.getAttribute('data-vzb-period'));
    const holds = new Set();
    let p = kept >= 0 ? kept : last, playing = false, wait = 0, rest = 0, seek = null, seen = false, inView = false, took = false, raf = 0, stamp0 = 0;
    const easeInOut = (k) => (k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2);
    let scan = 0;
    const busy = () => playing || seek || scan || rest > 0;
    // 옮겨 가기는 데이터가 바뀐 데 대한 답이라, 마우스가 올라가 있어도 끝까지 갑니다.
    const on = () => card.isConnected && inView && (moving || (busy() && !holds.size));
    function setBtn() {
      btn.classList.toggle('is-on', playing);
      btn.setAttribute('aria-label', playing ? tx(d, '일시정지') : tx(d, '재생'));
    }
    // 짚을 항목 바꾸기: 색 · 굵기 · 선 끝 점 크기를 옮기고 그 선을 맨 위로 올립니다. 다시 그려도 이어 가도록 카드 요소에 적어 둡니다.
    function setFocus(it) {
      if (!it || it === focus) return;
      focus = it;
      items.forEach((x) => {
        x.focus = x === it;
        [x.line, x.head, x.lab].forEach((n2) => n2.classList.toggle('is-focus', x.focus));
        x.head.setAttribute('r', x.focus ? 5 : 4);
      });
      gLines.append(it.line);
      card.setAttribute('data-vzb-focus', it.name);
      const a = firstOf(it), b = lastOf(it);
      plot.setAttribute('aria-label', tx(d, '%1 순위 변화, %2–%3. %4: %5 → %6. 위아래 화살표로 항목을 옮깁니다. 모든 순위는 이어지는 표에 있습니다.',
        d.title || '', labels[0], labels[last], it.name, rankText(it.rk[a]), rankText(it.rk[b])));
      say.textContent = tx(d, '%s 강조', it.name);
      render();
    }
    function tick(stamp) {
      raf = 0;
      if (!on()) { stamp0 = 0; return; }
      const dt = stamp0 ? Math.min(100, stamp - stamp0) : 16;
      stamp0 = stamp;
      if (moving) stepMove(dt);
      if (holds.size) { /* 잠시 멈춤: 기간은 그대로 둡니다 */ } else if (seek) {
        seek.t = Math.min(seek.dur, seek.t + dt);
        p = seek.from + (seek.to - seek.from) * easeInOut(seek.t / seek.dur);
        if (seek.t >= seek.dur) { p = seek.to; const then = seek.then; seek = null; if (then) then(); }
      } else if (scan) {
        p = Math.max(0, Math.min(last, p + (scan * dt) / (STEP / 3)));   // 누르고 있는 동안 재생의 세 배 빠르기로
      } else if (rest > 0) {
        rest -= dt;
        if (rest <= 0) { rest = 0; glide(0, 900, () => { wait = 500; playing = true; setBtn(); }); }   // 갤러리: 처음으로 감고 다시 재생
      } else if (playing) {
        if (wait > 0) wait -= dt;
        else p = Math.min(last, p + dt / STEP);
        if (p >= last) { playing = false; setBtn(); if (took) card.setAttribute('data-vzb-period', labels[last]); else if (loop) rest = 2600; }
      }
      render();
      if (on()) raf = requestAnimationFrame(tick);
    }
    function kick() { if (!raf && on()) raf = requestAnimationFrame(tick); }
    // q 자리로 dur 동안 미끄러집니다. then은 다 간 뒤에 부릅니다.
    function glide(q, dur, then) {
      if (dur <= 0) { p = q; seek = null; render(); if (then) then(); return; }
      seek = { from: p, to: q, t: 0, dur, then };
      stamp0 = 0;
      kick();
    }
    function play() {
      took = true;
      rest = 0;
      if (playing) { pickAt(p, 200); return; }   // 멈추면 가까운 기간에 자리를 잡습니다
      const go = () => { playing = true; wait = 0; setBtn(); kick(); };
      if (p >= last - 1e-6) glide(0, 600, () => { wait = 300; go(); });   // 끝에 있으면 처음으로 감고 재생합니다
      else go();
    }
    btn.addEventListener('click', play);
    // 사용자가 고른 기간: 재생을 멈추고, 다시 그려도 이어 가도록 카드 요소에 적어 둡니다.
    function pickAt(q, dur) {
      took = true;
      rest = 0;
      playing = false;
      setBtn();
      const t = Math.max(0, Math.min(last, Math.round(q)));
      card.setAttribute('data-vzb-period', labels[t]);
      glide(t, dur);
    }
    // 되감기 · 빨리 감기: 누르면 한 기간, 누르고 있으면 계속. 키보드(Enter · Space)는 한 기간씩입니다.
    [[rew, -1], [ff, 1]].forEach(([b, dir]) => {
      let timer = 0;
      const stop = () => {
        clearTimeout(timer);
        timer = 0;
        if (scan) { scan = 0; pickAt(p, 180); }
      };
      b.addEventListener('pointerdown', (e) => {
        if (e.button) return;
        b.setPointerCapture(e.pointerId);
        pickAt((seek ? seek.to : Math.round(p)) + dir, 220);
        timer = setTimeout(() => { timer = 0; seek = null; scan = dir; stamp0 = 0; kick(); }, 380);
      });
      b.addEventListener('pointerup', stop);
      b.addEventListener('pointercancel', stop);
      b.addEventListener('lostpointercapture', stop);
      b.addEventListener('click', (e) => { if (e.detail === 0) pickAt((seek ? seek.to : Math.round(p)) + dir, 220); });
    });
    // 구간 막대: 누르면 그 기간으로 미끄러지고, 끄는 동안은 손을 따라 기간 사이도 그립니다. 놓으면 가까운 기간에 멈춥니다.
    const qAt = (cx) => { const r = scrub.getBoundingClientRect(), x = cx - r.left; return Math.max(0, Math.min(last, ((x - xs[0]) / Math.max(1, xs[last] - xs[0])) * last)); };
    let drag = null;
    scrub.addEventListener('pointerdown', (e) => {
      if (e.button) return;
      took = true; rest = 0; playing = false; setBtn(); seek = null;
      drag = { id: e.pointerId, moved: false };
      scrub.setPointerCapture(e.pointerId);
      scrub.classList.add('is-drag');
      const q = Math.round(qAt(e.clientX));
      glide(q, Math.min(260, 80 + Math.abs(q - p) * 40));
    });
    scrub.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      drag.moved = true;
      seek = null;
      p = qAt(e.clientX);
      render();
    });
    const drop = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      drag = null;
      scrub.classList.remove('is-drag');
      pickAt(seek ? seek.to : p, 200);
    };
    scrub.addEventListener('pointerup', drop);
    scrub.addEventListener('pointercancel', drop);
    scrub.addEventListener('keydown', (e) => {
      const base = seek ? seek.to : Math.round(p);
      const q = { ArrowRight: base + 1, ArrowUp: base + 1, ArrowLeft: base - 1, ArrowDown: base - 1, PageUp: base + 3, PageDown: base - 3, Home: 0, End: last }[e.key];
      if (q == null) return;
      e.preventDefault();
      pickAt(q, 260);
    });
    plot.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') { holds.add('hover'); render(); } });
    plot.addEventListener('pointerleave', () => { holds.delete('hover'); kick(); });
    plot.addEventListener('focus', () => { if (plot.matches(':focus-visible')) { holds.add('focus'); render(); } });   // 키보드로 들어왔을 때만 멈춥니다
    plot.addEventListener('blur', () => { holds.delete('focus'); kick(); });
    // 툴팁: 선을 짚으면 그 기간(지나온 기간 가운데 가장 가까운 기간)의 순위 · 값 · 앞 기간 대비 오르내림을 보이고 그 항목만 진하게 남깁니다.
    // 키보드는 그래프에 포커스한 뒤 위아래 화살표로 지금 기간의 순위 순서대로 옮깁니다.
    let tipT = null, tipIt = null;
    const ranked = (t) => items.filter((it) => it.rk[t]).sort((a, b) => a.rk[t] - b.rk[t]);
    interact(plot, () => ranked(Math.round(p)).length,
      (cx, cy) => {
        const r = plot.getBoundingClientRect(), x = cx - r.left, y = cy - r.top, upto = Math.max(0, Math.round(p));
        let t = 0;
        for (let k = 0; k <= upto; k++) if (Math.abs(xs[k] - x) < Math.abs(xs[t] - x)) t = k;
        const list2 = ranked(t);
        if (!list2.length) return -1;
        let best = 0;
        list2.forEach((it, k) => { if (Math.abs(Y(it.rk[t]) - y) < Math.abs(Y(list2[best].rk[t]) - y)) best = k; });
        tipT = t;
        return ranked(Math.round(p)).indexOf(list2[best]);
      },
      (k) => {
        const t = tipT != null ? tipT : Math.round(p), it = ranked(Math.round(p))[k] || ranked(t)[k];
        tipT = null;
        tipIt = it;
        svg.classList.add('is-hover');
        items.forEach((x) => [x.line, x.head, x.lab].forEach((n2) => n2.classList.toggle('is-on', x === it)));
        const r = plot.getBoundingClientRect(), rk = it.rk[t], pv = t > 0 ? it.rk[t - 1] : 0;
        const mv = rk && pv ? pv - rk : 0;
        const note = [`${labels[t]} · ${show(f, it.vals[t])}`];
        if (t > 0 && rk && pv) note.push({ text: `${mv > 0 ? tx(d, '%s계단 오름', mv) : mv < 0 ? tx(d, '%s계단 내림', -mv) : tx(d, '그대로')} · ${tx(d, '%s 대비', labels[t - 1])}`, tone: mv > 0 ? 'good' : mv < 0 ? 'bad' : null });
        const tb = tipBody({ value: rankText(rk), note }, it.name);
        // 툴팁은 점의 옆에 띄웁니다(앞쪽 기간은 오른쪽, 뒤쪽 기간은 왼쪽). 점 위에 띄우면 오른쪽 끝의 이름표와 같은 순위가 겹쳐 보이기 때문입니다.
        return { x: r.left + xs[t], y: r.top + Y(rk || 1), side: xs[t] < r.width * 0.35 ? 'right' : 'left', label: it.name, value: tb.node, text: tb.text };
      },
      () => { tipIt = null; svg.classList.remove('is-hover'); items.forEach((x) => [x.line, x.head, x.lab].forEach((n2) => n2.classList.remove('is-on'))); },
      true);
    plot.addEventListener('click', () => setFocus(tipIt));
    plot.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && tipIt) { e.preventDefault(); setFocus(tipIt); } });

    setBtn();
    const auto = !live;
    if (auto) p = 0;
    if (scene) inView = !!scene.inView;   // 앞 카드가 화면에 보이고 있었으면 바로 움직입니다
    onSize(plot, layout);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); if (W) layout(W, H); });
    // 화면에 처음 보일 때 첫 기간에서 잠시 멈췄다가 재생합니다. 화면 밖에 있는 동안은 멈춰 둡니다.
    const start = () => { if (!seen) { seen = true; if (auto && !took) { playing = true; wait = LEAD; setBtn(); } } };
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((es) => {
        if (!card.isConnected) { io.disconnect(); return; }
        inView = es[es.length - 1].isIntersecting;
        if (!inView && moving) { settle(); render(); }   // 화면 밖에서는 다 옮겨 간 장면으로 둡니다
        if (inView) start();
        kick();
      }, { threshold: 0.3 });
      io.observe(card);
    } else { inView = true; start(); }
  });
})();
</script>

<script>
// The full data the page holds: the period names, and the monthly spend and the monthly budget of each channel.
const LABELS = ["Nov '25","Dec '25","Jan '26","Feb '26","Mar '26","Apr '26","May '26","Jun '26","Jul '26","Aug '26","Sep '26","Oct '26","Nov '26"];
const SPEND = {"Social":[8600,16200,9700,9700,11900,9100,12900,13300,10000,14500,10100,10000,16400],"Search":[9500,10300,10100,10400,12800,10100,8500,8600,10600,15300,11000,10900,10700],"Display":[5500,6000,3600,3500,7200,5800,4900,5000,3700,5200,6200,6200,6200],"Video":[5300,5900,3500,3600,4300,5600,4800,5000,3700,5200,3700,6000,6100],"Affiliate":[2800,5000,3000,3100,3800,2900,2500,4200,3200,4500,3200,3200,3100],"Retargeting":[2500,2700,1600,2700,3400,2700,2200,2300,1700,4000,2900,2900,2800]};
const BUDGET = {"Social":12000,"Search":11200,"Display":5600,"Video":4800,"Affiliate":3600,"Retargeting":2800};
document.addEventListener('vzb-change', (e) => {
  if (e.detail.name !== 'channel') return;
  const picked = e.detail.value;   // the channels picked
  const src = document.querySelector('#spend .vzb-card script[type="application/json"]');
  const d = JSON.parse(src.textContent);
  d.labels = picked.length ? LABELS : [];   // nothing picked: an empty array, and the card draws its empty state
  d.values = d.labels.map((_, t) => picked.reduce((sum, c) => sum + SPEND[c][t], 0));
  d.limit = picked.reduce((sum, c) => sum + BUDGET[c], 0);
  d.subtitle = !picked.length ? 'No channel picked' : (picked.length === 6 ? 'All channels' : picked.join(', ')) + ', against a $' + d.limit / 1000 + 'K monthly budget';
  src.textContent = JSON.stringify(d);   // the card redraws when this text changes
});
</script>
</body></html>
