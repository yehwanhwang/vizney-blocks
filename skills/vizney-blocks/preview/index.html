    '최근 7일': 'Last 7 days', '최근 30일': 'Last 30 days', '이번 달': 'This month', '지난달': 'Last month', '이번 분기': 'This quarter', '올해': 'This year', '빠른 선택': 'Quick picks',

  // 뭉개지지 않게 합니다. decimals를 주면 줄인 숫자의 소수 자릿수를 그 값으로 맞춥니다(1억 8,600만 원은 2면 1.86억).

  function usd(v, d) {
    const a = Math.abs(v), s = v < 0 ? '-' : '';
    const [div, u] = a >= 1e9 ? [1e9, 'B'] : a >= 1e6 ? [1e6, 'M'] : a >= 1e3 ? [1e3, 'K'] : [1, ''];

  // format: eok(억 단위 값) · krw(원 단위 값) · usd(달러 값) · count(unit으로 단위) · pct(증감을 %p로) · days

  // 자리를 늘려(최대 세 자리) 1.12%에서 1.16%로 오른 것을 0.0%p가 아니라 0.03%p로 적습니다.

    const hd = el('div', 'vzb-hd');

  // 같은 종류의 카드를 모두 찾아 그립니다. 코드를 두 번 붙여 넣어도 카드는 한 번만 그립니다.
  // 데이터가 바뀌면 다시 그립니다: 페이지의 스크립트가 카드 안 JSON(<script type="application/json">)의 글자를 바꾸면 그 카드만
  // 새 요소로 갈아 끼워 새로 그립니다(필터 · 기간 컨트롤과 잇는 길). 갈아 끼운 카드에는 data-vzb-live가 붙어, 움직이는 카드는
  // 처음부터 다시 재생하지 않고 마지막 장면을 바로 그립니다. 예전 요소가 페이지에서 빠지므로 그 카드의 움직임도 함께 끝납니다.

        card.setAttribute('data-vzb-ready', '');

          card.append(el('p', 'vzb-error', tx(/"lang"\s*:\s*"en"/.test(raw) ? { lang: 'en' } : null, '카드 데이터(JSON)를 읽지 못했습니다: %s', e.message)));

  /* 굴러가는 숫자(컨트롤 공통): 숫자 한 자리마다 0–9를 세로로 쌓은 칸을 두고 새 값의 자리로 굴립니다(구독 수가 오르는 단추처럼).

    // 가로로 밀 때는 오른쪽 끝을 흐리게 해 칩이 더 있음을 알리고, 끝까지 밀면 흐림을 거둡니다.

      list.classList.remove('is-scroll');
      list.classList.add('is-measure');

      if (i < 0) { if (sel.size === opts.length) sel.clear(); else opts.forEach((o) => sel.add(o)); }

      if ('IntersectionObserver' in window) new IntersectionObserver((es) => { seen = es[es.length - 1].isIntersecting; }).observe(card);
      const timer = setInterval(() => {
        if (!card.isConnected) { clearInterval(timer); return; }
        if (!seen || performance.now() < idle) return;
        const i = plan[k++ % plan.length], b = i < 0 ? all : chips[i % chips.length];
        if (!b) return;
        b.classList.add('is-press');
        setTimeout(() => b.classList.remove('is-press'), 120);
        toggle(i < 0 ? -1 : i % chips.length);
      }, 1300);
    }
  });
})();
</script>

      return `M${fx(x)},${fx(yBottom)}V${fx(yTop + r)}A${r},${r} 0 0 1 ${fx(x + r)},${fx(yTop)}H${fx(x + w - r)}A${r},${r} 0 0 1 ${fx(x + w)},${fx(yTop + r)}V${fx(yBottom)}Z`;
    };
    // 시간표(밀리초): 한도선만 보이는 처음 · 막대 사이 간격 · 한 막대가 차는 시간 · 다 찬 뒤 쉬는 시간 · 깜빡임 한 번 · 깜빡이는 횟수
    const T0 = 300, STAG = Math.max(60, Math.min(140, 1500 / N)), DUR = 460, WAIT = 260, BLINK = 440, TIMES = 3, GAP = 1.5, NAMEH = 22;
    const easeOut = (k) => 1 - (1 - k) ** 3;
    let W = 0, H = 0, y0 = 0, s = 1, bw = 0, slot = 1, yl = 0, t = 0, FULL = 0, TOTAL = 0;
    function layout(w, h) {
      W = w; H = h;
      svg.setAttribute('width', w);
      svg.setAttribute('height', h);
      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
      y0 = h - NAMEH;
      s = Math.max(1, y0 - 4) / top;
      slot = w / N;
      bw = Math.max(4, Math.min(30, slot * 0.62));
      yl = y0 - lim * s;
      base.setAttribute('x1', 0);
      base.setAttribute('x2', w);
      base.setAttribute('y1', y0 + 0.5);
      base.setAttribute('y2', y0 + 0.5);
      limLine.setAttribute('x1', 0);
      limLine.setAttribute('x2', w);
      limLine.setAttribute('y1', fx(yl));
      limLine.setAttribute('y2', fx(yl));
      // 기간 이름: 다 들어가면 모두, 모자라면 몇 칸마다 하나씩(마지막 칸은 늘 적습니다)
      const nameW = Math.max(...items.map((it) => textW(it.name, 400, fam, 12))) + 6;
      const every = Math.max(1, Math.ceil(nameW / slot));
      // 넘친 양: 14px로 적고, 이웃한 넘친 양끼리 겹치면 12px로, 그래도 겹치면 적지 않습니다(툴팁과 요약 줄에는 남습니다).
      // 글자는 제 칸 밖으로 나가도 되지만 그림 밖으로는 나가지 않게 안쪽으로 당깁니다.
      const place = (size) => {
        let prev = -Infinity, ok = true;
        spill.forEach((it) => {
          const lw = textW(it.ex.textContent, 700, fam, size) + 4, cx = slot * (it.k + 0.5);
          it.exW = lw;
          it.exX = Math.max(lw / 2, Math.min(w - lw / 2, cx));
          if (it.exX - lw / 2 < prev + 4) ok = false;
          prev = it.exX + lw / 2;
        });
        return ok;
      };
      const exSize = place(14) ? 14 : place(12) ? 12 : 0;
      if (exSize) place(exSize);
      items.forEach((it) => {
        it.cx = slot * (it.k + 0.5);
        it.x = it.cx - bw / 2;
        it.yv = y0 - (it.v || 0) * s;
        it.nm.setAttribute('x', fx(it.cx));
        it.nm.setAttribute('y', fx(y0 + 15));
        it.nm.setAttribute('opacity', (N - 1 - it.k) % every === 0 ? 1 : 0);
        it.ex.setAttribute('x', fx(it.over > 0 && exSize ? it.exX : it.cx));
        it.ex.setAttribute('y', fx(it.yv - 5));
        it.ex.style.fontSize = exSize === 12 ? '12px' : '';
        it.exOn = it.over > 0 && !!exSize;
        it.start = T0 + it.k * STAG;
      });
      // 한도선의 이름은 선 바로 위, 한도를 넘는 막대(와 넘친 양)가 없는 자리에 적습니다. 오른쪽 끝부터 왼쪽으로 찾고,
      // 그런 자리가 없으면(거의 모든 기간이 넘을 때) 오른쪽 끝의 선 바로 아래에 적습니다. 선 아래는 모두 회색이라 빨강과 겹치지 않습니다.
      const lw = textW(limText.textContent, 500, fam, 12) + 6;
      // 막는 자리는 넘친 막대의 칸이고, 넘친 양이 작아 그 글자가 이름과 같은 높이에 걸치면 글자 자리까지 막습니다. 이웃과는 4px 띄웁니다.
      const blocked = items.filter((it) => it.over > 0).map((it) => {
        const a = it.cx - slot / 2, b = it.cx + slot / 2;
        return it.exOn && it.yv > yl - 16 ? [Math.min(a, it.exX - it.exW / 2), Math.max(b, it.exX + it.exW / 2)] : [a, b];
      });
      const fits = (x) => x - lw >= 0 && blocked.every(([a, b]) => b <= x - lw || a >= x);
      const ends = [w, ...blocked.map(([a]) => a - 4).sort((p, q) => q - p)];
      const at = ends.find(fits);
      limText.setAttribute('text-anchor', 'end');
      limText.setAttribute('x', fx(at == null ? w : at));
      limText.setAttribute('y', fx(at == null ? yl + 14 : yl - 5));
      FULL = T0 + (N - 1) * STAG + DUR;
      TOTAL = FULL + (spill.length ? WAIT + BLINK * TIMES : 240);
      render();
    }
    function render() {
      if (!W) return;
      // 깜빡임: 다 찬 뒤 넘친 구간만 옅어졌다 돌아오기를 되풀이하고, 진한 상태로 끝납니다. 멈춰서 값을 읽는 동안은 진하게 둡니다.
      const b = (t - FULL - WAIT) / BLINK;
      const glow = b <= 0 || b >= TIMES || holds.size ? 1 : 1 - 0.84 * (0.5 - 0.5 * Math.cos(2 * Math.PI * b));
      const alert = t >= FULL + WAIT;
      items.forEach((it) => {
        if (it.v == null) { it.fill.setAttribute('d', ''); it.red.setAttribute('d', ''); it.ex.setAttribute('opacity', 0); return; }
        const k = clamp((t - it.start) / DUR), e = easeOut(k), yv = y0 - it.v * s * e;
        // 한도에 닿은 막대는 한도선 아래에서 각지게 끊고, 넘친 만큼은 선 위에서 빨강으로 잇습니다.
        const hit = it.v >= lim && yv <= yl + GAP;
        it.fill.setAttribute('d', col(it.x, hit ? yl + GAP : yv, bw, y0, !hit));
        it.red.setAttribute('d', it.over > 0 && yv < yl - GAP ? col(it.x, yv, bw, yl - GAP, true) : '');
        it.red.setAttribute('opacity', fx(glow));
        it.ex.setAttribute('opacity', it.exOn ? fx(clamp((t - it.start - DUR) / 200)) : 0);
        it.g.classList.toggle('is-over', it.over > 0 && alert);
      });
      sumEl.style.opacity = fx(clamp((t - (spill.length ? FULL + WAIT : FULL)) / 240));
    }

    // 재생: 화면에 보이고(inView) 마우스 · 포커스로 잠시 멈추지 않았을 때(holds)만 움직입니다. 카드가 페이지에서 빠지면 멈춥니다.
    const live = card.hasAttribute('data-vzb-live');   // 데이터가 바뀌어 다시 그린 카드: 처음부터 재생하지 않습니다
    const loop = !!card.closest('[data-vzb-loop]');
    const holds = new Set();
    let playing = false, seen = false, inView = false, rest = 0, last = 0, raf = 0;
    const on = () => playing && inView && !holds.size && card.isConnected;
    function tick(stamp) {
      raf = 0;
      if (!on()) { last = 0; return; }
      const dt = last ? Math.min(100, stamp - last) : 16;
      last = stamp;
      if (rest > 0) { rest -= dt; if (rest <= 0) t = 0; }
      else {
        t = Math.min(TOTAL, t + dt);
        if (t >= TOTAL) { if (loop) rest = 2600; else playing = false; }
      }
      render();
      if (on()) raf = requestAnimationFrame(tick);
    }
    function kick() { if (!raf && on()) raf = requestAnimationFrame(tick); }
    function play() { t = 0; rest = 0; last = 0; playing = true; render(); kick(); }
    btn.addEventListener('click', play);
    plot.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') { holds.add('hover'); render(); } });
    plot.addEventListener('pointerleave', () => { holds.delete('hover'); kick(); });
    plot.addEventListener('focus', () => { if (plot.matches(':focus-visible')) { holds.add('focus'); render(); } });   // 키보드로 들어왔을 때만 멈춥니다
    plot.addEventListener('blur', () => { holds.delete('focus'); kick(); });
    // 툴팁: 막대를 짚으면 값, 한도, 넘치거나 남은 양과 한도 대비 비율을 보여 주고 그 막대만 진하게 남깁니다.
    interact(plot, N,
      (cx) => Math.max(0, Math.min(N - 1, Math.floor((cx - plot.getBoundingClientRect().left) / slot))),
      (k) => {
        const it = items[k], r = plot.getBoundingClientRect();
        svg.classList.add('is-hover');
        items.forEach((x) => x.g.classList.toggle('is-on', x === it));
        const note = [`${label} ${limShow}`];
        if (it.v != null) {
          const gap = show(f, Math.abs(it.v - lim)), share = lim > 0 ? num((it.v / lim) * 100, 0) : null;
          // 한도를 넘친 줄은 막대의 넘친 부분과 같은 빨강으로 적습니다.
          if (share == null) note.push({ text: tx(d, '%s 초과|한도', gap), tone: it.v > lim ? 'bad' : null });
          else note.push(it.v > lim ? { text: tx(d, '%1 초과 · %2의 %3%', gap, inText, share), tone: 'bad' } : it.v < lim ? tx(d, '%1 남음 · %2의 %3%', gap, inText, share) : tx(d, '%1의 %2', inText, `${share}%`));
        }
        const tb = tipBody({ value: it.v == null ? tx(d, '데이터 없음') : show(f, it.v), note }, it.name);
        return { x: r.left + it.cx, y: r.top + Math.min(it.yv, yl) - 6, label: it.name, value: tb.node, text: tb.text };
      },
      () => { svg.classList.remove('is-hover'); items.forEach((x) => x.g.classList.remove('is-on')); },
      false, true);

    if (live) t = 1e9;   // 마지막 장면에서 시작합니다
    onSize(plot, layout);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (W) layout(W, H); });
    // 화면에 처음 보일 때 움직입니다. 화면 밖에 있는 동안은 멈춰 둡니다.
    const start = () => { if (!seen) { seen = true; if (!live) play(); } };
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((es) => {
        if (!card.isConnected) { io.disconnect(); return; }
        inView = es[es.length - 1].isIntersecting;
        if (inView) start();
        kick();
      }, { threshold: 0.3 });
      io.observe(card);
    } else { inView = true; start(); }
  });
})();
</script>

    // 기간 단추: 두 기간 가운데 하나를 고르는 라디오 묶음입니다. 고른 기간에는 글자색 알약이 미끄러져 옮겨 갑니다.

    const plot = el('div', 'vzb-plot vzb-wf-plot');

    plot.setAttribute('role', 'img');
    const nowShare = pctText(focus.cells[last], 0);
    plot.setAttribute('aria-label', P > 1

    plot.append(svg);
    const ctl = el('div', 'vzb-wf-ctl'), legend = el('ul', 'vzb-wf-legend');
    legend.setAttribute('aria-hidden', 'true');
    items.forEach((it) => {
      it.li = el('li');
      it.val = el('b', null, pctText(it.cells[last], 0));
      it.li.append(el('i', `vzb-wf-key vzb-wf-c${it.k}`), el('span', null, it.name), it.val);
      legend.append(it.li);
    });
    ctl.append(legend);
    foot.append(plot, ctl);
    card.append(foot);
    // 화면 낭독기용 표: 항목 · 기간마다 비중(원래 값) · 차이
    const sr = el('div', 'vzb-sr'), table = el('table'), hr = el('tr');
    hr.append(...[tx(d, '이름'), ...periods.map((p) => p || tx(d, '비중')), ...(P > 1 ? [tx(d, '차이')] : [])].map((k) => el('th', null, k)));
    table.append(el('caption', null, d.title || ''), hr);
    items.forEach((it) => {
      const tr = el('tr');
      tr.append(el('th', null, it.name), ...periods.map((_, p) => el('td', null, `${pctText(it.share[p], 1)} (${show(f, it.vals[p])})`)));

    });

    // 칸 100개와 괄호: 칸 하나는 한 변 pitch에서 틈을 뺀 정사각형입니다.
    const cells = before.map((c, i) => {

      svg.append(r);

    });
    const brace = svgEl('path', { class: 'vzb-wf-br' }), braceText = svgText(0, 0, ppText(diff, 0), 'vzb-wf-brt', 'start');
    svg.append(brace, braceText);
    const ROWS = 5, COLS = 20, fx = (v) => v.toFixed(1), clamp = (v) => Math.max(0, Math.min(1, v));
    const fam = getComputedStyle(card).fontFamily;
    // 시간표(밀리초): 처음 앞 기간을 읽는 시간 · 칸 사이 간격(바뀐 칸이 많으면 짧게) · 한 칸이 뒤집히는 시간 · 괄호가 그어지는 시간
    const T0 = 700, K = flips.length, STAG = Math.max(28, Math.min(110, 1100 / Math.max(1, K))), FLIP = 300, OUT = 260;
    const order = new Map(flips.map((i, j) => [i, j]));
    const easeIn = (k) => k * k, spring = (k) => 1 + 2.2 * (k - 1) ** 3 + 1.2 * (k - 1) ** 2;
    // 지금 장면: from 기간에서 to 기간으로 가는 중(lead 동안은 from을 보이고, 그 뒤 바뀐 칸이 차례로 뒤집힘). 같으면 그 기간에 멈춰 있습니다.
    // 데이터가 바뀌어 다시 그린 카드는 카드 요소에 적어 둔 기간(data-vzb-period)을 이어 갑니다.
    const kept = periods.indexOf(card.getAttribute('data-vzb-period'));
    let from = kept >= 0 ? kept : last, to = from, lead = 0, t = 0;
    const endOf = () => lead + Math.max(0, K - 1) * STAG + (K ? FLIP : 0);
    const total = () => (from === to ? 0 : endOf() + (to === last && diff ? OUT + 240 : 160));
    const shownP = () => (from !== to && t < lead ? from : to);
    let pitch = 0, cell = 0, W = 0;
    // 칸 크기: 카드 높이(2단위) 안에서 큰 숫자 아래 남은 높이와 폭에 맞춰 될 수 있는 만큼 키웁니다(한 변 30px까지).
    // 넓은 카드(520px 이상)는 범례를 칸 오른쪽에 세로로 두고, 좁으면 범례는 칸 아래입니다.
    function layout(fw) {
      const side = fw >= 520;
      foot.classList.toggle('is-side', side);
      if (per) hd.style.paddingRight = `${per.offsetWidth + 12}px`;   // 제목은 기간 단추 왼쪽까지
      const cs = getComputedStyle(card), H = parseFloat(cs.minHeight) || 336;
      const top = fig.getBoundingClientRect().bottom - card.getBoundingClientRect().top;
      const below = parseFloat(cs.paddingBottom) + parseFloat(cs.borderBottomWidth) + parseFloat(getComputedStyle(foot).paddingTop) + (side ? 0 : ctl.offsetHeight + 8) + 22;
      const byH = (H - top - below + 3) / ROWS, byW = (fw - (side ? Math.max(...items.map((it) => it.li.offsetWidth)) + 28 : 0)) / COLS;
      pitch = Math.max(8, Math.min(30, byW, byH));
      const gap = pitch >= 14 ? 3 : 2, w = side ? pitch * COLS - gap : fw;
      W = w;
      cell = pitch - gap;
      const h = pitch * ROWS - gap + 22;
      svg.setAttribute('width', w);
      svg.setAttribute('height', h);
      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
      cells.forEach((r, i) => {
        r.setAttribute('x', fx(Math.floor(i / ROWS) * pitch));
        r.setAttribute('y', fx((i % ROWS) * pitch));
        r.setAttribute('width', fx(cell));
        r.setAttribute('height', fx(cell));
      });
      // 괄호: 짚을 항목에서 바뀐 칸이 든 세로줄들 아래. %p는 괄호 오른쪽, 자리가 모자라면 왼쪽에 적습니다.
      if (diff) {
        const a = Math.min(focus.cells[0], focus.cells[last]), b = Math.max(focus.cells[0], focus.cells[last]) - 1;
        const x1 = Math.floor(a / ROWS) * pitch, x2 = Math.floor(b / ROWS) * pitch + cell, y = pitch * ROWS - gap + 7;
        brace.setAttribute('d', `M${fx(x1)},${fx(y - 4)}V${fx(y)}H${fx(x2)}V${fx(y - 4)}`);
        brace.len = (x2 - x1) + 8;
        brace.setAttribute('stroke-dasharray', fx(brace.len));
        const tw = textW(braceText.textContent, 700, fam, 14) + 6, right = x2 + tw <= w;

    // 기간 단추의 알약: 처음 자리는 움직이지 않고 놓은 뒤부터 미끄러집니다(is-ready).

      pill.style.transform = `translateX(${b.offsetLeft}px)`;

      // 큰 숫자와 범례는 지금 보이는 칸 수 그대로입니다.

      items.forEach((it) => { const v = pctText(cnt[it.k], 0); if (it.val.textContent !== v) it.val.textContent = v; });
      setPill(shownP());
      const end = endOf(), done = !moving || t >= end, atLast = P > 1 && to === last;
      const kb = atLast && diff ? (moving ? clamp((t - end) / OUT) : 1) : 0;
      brace.setAttribute('stroke-dashoffset', fx((brace.len || 0) * (1 - kb)));
      brace.style.opacity = kb > 0 ? 1 : 0;
      braceText.style.opacity = atLast && diff ? (moving ? fx(clamp((t - end - OUT * 0.5) / (OUT * 0.5))) : 1) : 0;
      if (bd) { const show = atLast && done; bd.hidden = !show; vs.hidden = !show; }
    }

    // 재생: 화면에 보이고(inView) 마우스 · 포커스로 잠시 멈추지 않았을 때(holds)만 움직입니다. 카드가 페이지에서 빠지면 멈춥니다.

        const mine = cells.map((c, i) => [c, i]).filter(([c]) => c.cat === k);
        mine.forEach(([c]) => c.classList.add('is-on'));

        // 툴팁은 짚은 칸 묶음의 옆(묶음이 왼쪽 절반이면 오른쪽, 아니면 왼쪽)에 띄웁니다. 칸 위에 띄우면 머리의 대표 수치를 덮어 같은 숫자가 겹쳐 보이기 때문입니다.

        const p = shownP(), note = [P > 1 ? `${periods[p]} · ${show(f, it.vals[p])}` : show(f, it.vals[p])];
        const want = d.better === 'down' ? -1 : d.better === 'neutral' ? 0 : 1, dv = it.share[last] - it.share[0];

        const tb = tipBody({ value: pctText(it.share[p], 1), note }, it.name);
        return { x: r.left + (leftHalf ? c1 * pitch : c0 * pitch), y: r.top + (ROWS * pitch) / 2, side: leftHalf ? 'right' : 'left', label: it.name, value: tb.node, text: tb.text };
      },
      () => { svg.classList.remove('is-hover'); legend.classList.remove('is-hover'); items.forEach((x) => x.li.classList.remove('is-on')); cells.forEach((c) => c.classList.remove('is-on')); },
      false, true);

    // 처음 장면: 재생할 카드는 앞 기간에 멈춰 기다리고, 아니면(다시 그림 · 한 기간) 고른 기간 또는 뒤 기간입니다.
    const auto = !live && P > 1;
    if (auto) from = to = 0;
    onSize(foot, layout);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (W) layout(foot.clientWidth); });

    const start = () => { if (!seen) { seen = true; if (auto && !took) go(last, T0); } };

})();

        it.lab.style.display = on ? '' : 'none';
        if (!on) return;
        it.head.setAttribute('cx', fx(hxi));
        it.head.setAttribute('cy', fx(hy));
        it.lab.setAttribute('x', fx(hxi + 10));
        it.lab.setAttribute('y', fx(hy + 4));
        const rt = rankText(it.rk[cur] || ra || rb);
        if (it.labR.textContent !== rt) it.labR.textContent = rt;
      });
      // 앞지르는 동안 두 이름표가 겹치면, 짚을 항목 · 지금 순위가 높은 항목의 이름표를 남기고 다른 쪽은 잠시 옅게 둡니다.
      const placed = [];
      items.filter((it) => it.hy != null).sort((a, b) => b.focus - a.focus || (a.rk[cur] || N + 1) - (b.rk[cur] || N + 1)).forEach((it) => {
        const clash = placed.some((y) => Math.abs(y - it.hy) < 13);
        it.lab.classList.toggle('is-clash', clash);
        if (!clash) placed.push(it.hy);
      });
      // 구간 막대: 손잡이는 선 끝과 같은 가로 자리입니다. 지금 기간 이름이 처음 · 끝 이름과 겹치면 그쪽 이름을 감춥니다.
      fill.setAttribute('x2', fx(hx));
      ticks.forEach((c, t) => c.classList.toggle('is-past', t <= p + 1e-6));
      thumb.setAttribute('cx', fx(hx));
      thumb.setAttribute('cy', 9);
      halo.setAttribute('cx', fx(hx));
      halo.setAttribute('cy', 9);
      if (now.textContent !== labels[cur]) now.textContent = labels[cur];
      const nw = nowW / 2 + 2, nx = Math.max(nw - 2, Math.min(scrub.clientWidth - nw, hx));
      now.setAttribute('x', fx(nx));
      const aw = textW(labels[0], 400, fam, 12), bw = textW(labels[last], 400, fam, 12);
      endA.style.opacity = nx - nw < Math.max(0, xs[0] - 6) + aw + 8 ? 0 : 1;
      endB.style.opacity = nx + nw > xs[last] + 6 - bw - 8 ? 0 : 1;
      scrub.setAttribute('aria-valuenow', String(cur));
      scrub.setAttribute('aria-valuetext', `${labels[cur]}: ${focus.name} ${rankText(focus.rk[cur])}`);
    }

    // 재생: 화면에 보이고(inView) 마우스 · 포커스로 잠시 멈추지 않았을 때(holds)만 흐릅니다. 카드가 페이지에서 빠지면 멈춥니다.
    // 기간 하나를 넘기는 시간 STEP, 처음 첫 기간을 읽는 시간 LEAD. 구간 막대로 옮길 때는 짧게 미끄러집니다(seek).
    const STEP = 520, LEAD = 700;
    const live = card.hasAttribute('data-vzb-live'), loop = !!card.closest('[data-vzb-loop]');
    const kept = labels.indexOf(card.getAttribute('data-vzb-period'));
    const holds = new Set();
    let p = kept >= 0 ? kept : last, playing = false, wait = 0, rest = 0, seek = null, seen = false, inView = false, took = false, raf = 0, stamp0 = 0;
    const easeInOut = (k) => (k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2);
    let scan = 0;
    const busy = () => playing || seek || scan || rest > 0;
    const on = () => busy() && inView && !holds.size && card.isConnected;
    function setBtn() {
      btn.classList.toggle('is-on', playing);
      btn.setAttribute('aria-label', playing ? tx(d, '일시정지') : tx(d, '재생'));
    }
    // 짚을 항목 바꾸기: 색 · 굵기 · 선 끝 점 크기를 옮기고 그 선을 맨 위로 올립니다. 다시 그려도 이어 가도록 카드 요소에 적어 둡니다.
    function setFocus(it) {
      if (!it || it === focus) return;
      focus = it;
      items.forEach((x) => {
        x.focus = x === it;
        [x.line, x.head, x.lab].forEach((n2) => n2.classList.toggle('is-focus', x.focus));
        x.head.setAttribute('r', x.focus ? 5 : 4);
      });
      gLines.append(it.line);
      card.setAttribute('data-vzb-focus', it.name);
      const a = firstOf(it), b = lastOf(it);
      plot.setAttribute('aria-label', tx(d, '%1 순위 변화, %2–%3. %4: %5 → %6. 위아래 화살표로 항목을 옮깁니다. 모든 순위는 이어지는 표에 있습니다.',
        d.title || '', labels[0], labels[last], it.name, rankText(it.rk[a]), rankText(it.rk[b])));
      say.textContent = tx(d, '%s 강조', it.name);
      render();
    }
    function tick(stamp) {
      raf = 0;
      if (!on()) { stamp0 = 0; return; }
      const dt = stamp0 ? Math.min(100, stamp - stamp0) : 16;
      stamp0 = stamp;
      if (seek) {
        seek.t = Math.min(seek.dur, seek.t + dt);
        p = seek.from + (seek.to - seek.from) * easeInOut(seek.t / seek.dur);
        if (seek.t >= seek.dur) { p = seek.to; const then = seek.then; seek = null; if (then) then(); }
      } else if (scan) {
        p = Math.max(0, Math.min(last, p + (scan * dt) / (STEP / 3)));   // 누르고 있는 동안 재생의 세 배 빠르기로
      } else if (rest > 0) {
        rest -= dt;
        if (rest <= 0) { rest = 0; glide(0, 900, () => { wait = 500; playing = true; setBtn(); }); }   // 갤러리: 처음으로 감고 다시 재생
      } else if (playing) {
        if (wait > 0) wait -= dt;
        else p = Math.min(last, p + dt / STEP);
        if (p >= last) { playing = false; setBtn(); if (took) card.setAttribute('data-vzb-period', labels[last]); else if (loop) rest = 2600; }
      }
      render();
      if (on()) raf = requestAnimationFrame(tick);
    }
    function kick() { if (!raf && on()) raf = requestAnimationFrame(tick); }
    // q 자리로 dur 동안 미끄러집니다. then은 다 간 뒤에 부릅니다.
    function glide(q, dur, then) {
      if (dur <= 0) { p = q; seek = null; render(); if (then) then(); return; }
      seek = { from: p, to: q, t: 0, dur, then };
      stamp0 = 0;
      kick();
    }
    function play() {
      took = true;
      rest = 0;
      if (playing) { pickAt(p, 200); return; }   // 멈추면 가까운 기간에 자리를 잡습니다
      const go = () => { playing = true; wait = 0; setBtn(); kick(); };
      if (p >= last - 1e-6) glide(0, 600, () => { wait = 300; go(); });   // 끝에 있으면 처음으로 감고 재생합니다
      else go();
    }
    btn.addEventListener('click', play);
    // 사용자가 고른 기간: 재생을 멈추고, 다시 그려도 이어 가도록 카드 요소에 적어 둡니다.
    function pickAt(q, dur) {
      took = true;
      rest = 0;
      playing = false;
      setBtn();
      const t = Math.max(0, Math.min(last, Math.round(q)));
      card.setAttribute('data-vzb-period', labels[t]);
      glide(t, dur);
    }
    // 되감기 · 빨리 감기: 누르면 한 기간, 누르고 있으면 계속. 키보드(Enter · Space)는 한 기간씩입니다.
    [[rew, -1], [ff, 1]].forEach(([b, dir]) => {
      let timer = 0;
      const stop = () => {
        clearTimeout(timer);
        timer = 0;
        if (scan) { scan = 0; pickAt(p, 180); }
      };
      b.addEventListener('pointerdown', (e) => {
        if (e.button) return;
        b.setPointerCapture(e.pointerId);
        pickAt((seek ? seek.to : Math.round(p)) + dir, 220);
        timer = setTimeout(() => { timer = 0; seek = null; scan = dir; stamp0 = 0; kick(); }, 380);
      });
      b.addEventListener('pointerup', stop);
      b.addEventListener('pointercancel', stop);
      b.addEventListener('lostpointercapture', stop);
      b.addEventListener('click', (e) => { if (e.detail === 0) pickAt((seek ? seek.to : Math.round(p)) + dir, 220); });
    });
    // 구간 막대: 누르면 그 기간으로 미끄러지고, 끄는 동안은 손을 따라 기간 사이도 그립니다. 놓으면 가까운 기간에 멈춥니다.
    const qAt = (cx) => { const r = scrub.getBoundingClientRect(), x = cx - r.left; return Math.max(0, Math.min(last, ((x - xs[0]) / Math.max(1, xs[last] - xs[0])) * last)); };
    let drag = null;
    scrub.addEventListener('pointerdown', (e) => {
      if (e.button) return;
      took = true; rest = 0; playing = false; setBtn(); seek = null;
      drag = { id: e.pointerId, moved: false };
      scrub.setPointerCapture(e.pointerId);
      scrub.classList.add('is-drag');
      const q = Math.round(qAt(e.clientX));
      glide(q, Math.min(260, 80 + Math.abs(q - p) * 40));
    });
    scrub.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      drag.moved = true;
      seek = null;
      p = qAt(e.clientX);
      render();
    });
    const drop = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      drag = null;
      scrub.classList.remove('is-drag');
      pickAt(seek ? seek.to : p, 200);
    };
    scrub.addEventListener('pointerup', drop);
    scrub.addEventListener('pointercancel', drop);
    scrub.addEventListener('keydown', (e) => {
      const base = seek ? seek.to : Math.round(p);
      const q = { ArrowRight: base + 1, ArrowUp: base + 1, ArrowLeft: base - 1, ArrowDown: base - 1, PageUp: base + 3, PageDown: base - 3, Home: 0, End: last }[e.key];
      if (q == null) return;
      e.preventDefault();
      pickAt(q, 260);
    });
    plot.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') { holds.add('hover'); render(); } });
    plot.addEventListener('pointerleave', () => { holds.delete('hover'); kick(); });
    plot.addEventListener('focus', () => { if (plot.matches(':focus-visible')) { holds.add('focus'); render(); } });   // 키보드로 들어왔을 때만 멈춥니다
    plot.addEventListener('blur', () => { holds.delete('focus'); kick(); });
    // 툴팁: 선을 짚으면 그 기간(지나온 기간 가운데 가장 가까운 기간)의 순위 · 값 · 앞 기간 대비 오르내림을 보이고 그 항목만 진하게 남깁니다.
    // 키보드는 그래프에 포커스한 뒤 위아래 화살표로 지금 기간의 순위 순서대로 옮깁니다.
    let tipT = null, tipIt = null;
    const ranked = (t) => items.filter((it) => it.rk[t]).sort((a, b) => a.rk[t] - b.rk[t]);
    interact(plot, () => ranked(Math.round(p)).length,
      (cx, cy) => {
        const r = plot.getBoundingClientRect(), x = cx - r.left, y = cy - r.top, upto = Math.max(0, Math.round(p));
        let t = 0;
        for (let k = 0; k <= upto; k++) if (Math.abs(xs[k] - x) < Math.abs(xs[t] - x)) t = k;
        const list2 = ranked(t);
        if (!list2.length) return -1;
        let best = 0;
        list2.forEach((it, k) => { if (Math.abs(Y(it.rk[t]) - y) < Math.abs(Y(list2[best].rk[t]) - y)) best = k; });
        tipT = t;
        return ranked(Math.round(p)).indexOf(list2[best]);
      },
      (k) => {
        const t = tipT != null ? tipT : Math.round(p), it = ranked(Math.round(p))[k] || ranked(t)[k];
        tipT = null;
        tipIt = it;
        svg.classList.add('is-hover');
        items.forEach((x) => [x.line, x.head, x.lab].forEach((n2) => n2.classList.toggle('is-on', x === it)));
        const r = plot.getBoundingClientRect(), rk = it.rk[t], pv = t > 0 ? it.rk[t - 1] : 0;
        const mv = rk && pv ? pv - rk : 0;
        const note = [`${labels[t]} · ${show(f, it.vals[t])}`];
        if (t > 0 && rk && pv) note.push({ text: `${mv > 0 ? tx(d, '%s계단 오름', mv) : mv < 0 ? tx(d, '%s계단 내림', -mv) : tx(d, '그대로')} · ${tx(d, '%s 대비', labels[t - 1])}`, tone: mv > 0 ? 'good' : mv < 0 ? 'bad' : null });
        const tb = tipBody({ value: rankText(rk), note }, it.name);
        // 툴팁은 점의 옆에 띄웁니다(앞쪽 기간은 오른쪽, 뒤쪽 기간은 왼쪽). 점 위에 띄우면 오른쪽 끝의 이름표와 같은 순위가 겹쳐 보이기 때문입니다.
        return { x: r.left + xs[t], y: r.top + Y(rk || 1), side: xs[t] < r.width * 0.35 ? 'right' : 'left', label: it.name, value: tb.node, text: tb.text };
      },
      () => { tipIt = null; svg.classList.remove('is-hover'); items.forEach((x) => [x.line, x.head, x.lab].forEach((n2) => n2.classList.remove('is-on'))); },
      true);
    plot.addEventListener('click', () => setFocus(tipIt));
    plot.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && tipIt) { e.preventDefault(); setFocus(tipIt); } });

    setBtn();
    const auto = !live;
    if (auto) p = 0;
    onSize(plot, layout);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); if (W) layout(W, H); });
    // 화면에 처음 보일 때 첫 기간에서 잠시 멈췄다가 재생합니다. 화면 밖에 있는 동안은 멈춰 둡니다.
    const start = () => { if (!seen) { seen = true; if (auto && !took) { playing = true; wait = LEAD; setBtn(); } } };
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((es) => {
        if (!card.isConnected) { io.disconnect(); return; }
        inView = es[es.length - 1].isIntersecting;
        if (inView) start();
        kick();
      }, { threshold: 0.3 });
      io.observe(card);
    } else { inView = true; start(); }
  });
})();
</script>
</div>
</div>

<script>
// The full data the page holds: the period names, and the monthly spend and the monthly budget of each channel.
const LABELS = ["Nov '25","Dec '25","Jan '26","Feb '26","Mar '26","Apr '26","May '26","Jun '26","Jul '26","Aug '26","Sep '26","Oct '26","Nov '26"];
const SPEND = {"Social":[8600,16200,9700,9700,11900,9100,12900,13300,10000,14500,10100,10000,16400],"Search":[9500,10300,10100,10400,12800,10100,8500,8600,10600,15300,11000,10900,10700],"Display":[5500,6000,3600,3500,7200,5800,4900,5000,3700,5200,6200,6200,6200],"Video":[5300,5900,3500,3600,4300,5600,4800,5000,3700,5200,3700,6000,6100],"Affiliate":[2800,5000,3000,3100,3800,2900,2500,4200,3200,4500,3200,3200,3100],"Retargeting":[2500,2700,1600,2700,3400,2700,2200,2300,1700,4000,2900,2900,2800]};
const BUDGET = {"Social":12000,"Search":11200,"Display":5600,"Video":4800,"Affiliate":3600,"Retargeting":2800};
document.addEventListener('vzb-change', (e) => {
  if (e.detail.name !== 'channel') return;
  const picked = e.detail.value;   // the channels picked
  const src = document.querySelector('#spend .vzb-card script[type="application/json"]');
  const d = JSON.parse(src.textContent);
  d.labels = picked.length ? LABELS : [];   // nothing picked: an empty array, and the card draws its empty state
  d.values = d.labels.map((_, t) => picked.reduce((sum, c) => sum + SPEND[c][t], 0));
  d.limit = picked.reduce((sum, c) => sum + BUDGET[c], 0);
  d.subtitle = !picked.length ? 'No channel picked' : (picked.length === 6 ? 'All channels' : picked.join(', ')) + ', against a $' + d.limit / 1000 + 'K monthly budget';
  src.textContent = JSON.stringify(d);   // the card redraws when this text changes
});
</script>
